# Health — پایش خودکار سلامت ربات‌ها روی VPS، هر ۳۰ دقیقه.
# اگر رباتی offline/errored باشد یا در کرش‌لوپ افتاده باشد، جاب قرمز می‌شود،
# آخرین خطوط error-log همان ربات در لاگ چاپ می‌شود و یک GitHub Issue
# ساخته/به‌روزرسانی می‌شود تا مشکل حتی وقتی کسی آنلاین نیست ثبت شود.
name: Health

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot health on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/voice2text
            UNHEALTHY=$(pm2 jlist | node -e "
              const a = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const bad = a.filter(p =>
                p.pm2_env.status !== 'online' ||
                // کرش‌لوپ: بالا آمده ولی در ۱۰ دقیقه‌ی اخیر و با ری‌استارت زیاد
                ((Date.now() - p.pm2_env.pm_uptime) < 10 * 60000 && p.pm2_env.restart_time > 5)
              );
              for (const p of bad) console.log(p.name + ' status=' + p.pm2_env.status + ' restarts=' + p.pm2_env.restart_time);
            ")
            FAILED=0
            if [ -n "$UNHEALTHY" ]; then
              FAILED=1
              echo "🚨 ربات(های) ناسالم (pm2):"
              echo "$UNHEALTHY"
              echo "$UNHEALTHY" | awk '{print $1}' | while read -r app; do
                echo "===== $app — error.log (آخرین ۴۰ خط) ====="
                tail -n 40 ~/.pm2/logs/"$app"-error.log 2>/dev/null || echo "(خالی)"
                echo "===== $app — out.log (آخرین ۲۰ خط) ====="
                tail -n 20 ~/.pm2/logs/"$app"-out.log 2>/dev/null || echo "(خالی)"
              done
            fi
            # tabir-khab: systemd نه pm2 (استثنای مونوریپو)
            if sudo systemctl list-unit-files 2>/dev/null | grep -q '^tabir-khab'; then
              STATE=$(sudo systemctl is-active tabir-khab 2>/dev/null || true)
              if [ "$STATE" != "active" ]; then
                FAILED=1
                echo "🚨 tabir-khab status=$STATE (systemd)"
                echo "===== tabir-khab — bot.log (آخرین ۴۰ خط) ====="
                tail -n 40 /home/ubuntu/tabir_khab/logs/bot.log 2>/dev/null || echo "(خالی)"
              fi
            fi
            # صف رسیدهای معطل: پرداخت waiting_review قدیمی‌تر از ۲ ساعت = اعتماد مالی در خطر (بند ۱۰ ریشه)
            STALE=$(for d in bots/*/data; do
              app=$(basename "$(dirname "$d")")
              DBFILE=$(ls "$d"/*.db 2>/dev/null | head -1)
              [ -n "$DBFILE" ] || continue
              [ -d "bots/$app/node_modules/better-sqlite3" ] || continue
              DBFILE="$DBFILE" APP="$app" node -e "
                try {
                  const path = require('path');
                  const D = require(path.join(process.cwd(), 'bots', process.env.APP, 'node_modules', 'better-sqlite3'));
                  const db = new D(process.env.DBFILE, { readonly: true, fileMustExist: true });
                  const t = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='payments'\").get();
                  if (!t) process.exit(0);
                  const r = db.prepare(\"SELECT COUNT(*) c FROM payments WHERE status='waiting_review' AND updated_at < unixepoch()-7200\").get();
                  if (r.c > 0) console.log(process.env.APP + ': ' + r.c + ' رسید بیش از ۲ ساعت منتظر تأیید');
                } catch (e) {}
              " 2>/dev/null
            done)
            if [ -n "$STALE" ]; then
              FAILED=1
              echo "🚨 صف رسید معطل:"
              echo "$STALE"
            fi
            [ "$FAILED" = "0" ] || exit 1
            echo "✅ همه‌ی ربات‌ها online و صف رسید خالی/تازه است"

      # پیام مستقیم تلگرام به مالک — مالک غیرفنی در GitHub زندگی نمی‌کند (نیازمند secret اختیاری OWNER_TELEGRAM_ID)
      - name: Telegram alert on failure
        if: failure()
        env:
          T_V2T:   ${{ secrets.VOICE2TEXT_BOT_TOKEN }}
          T_TAROT: ${{ secrets.TAROT_BOT_TOKEN }}
          T_RT:    ${{ secrets.RESUME_TAILOR_BOT_TOKEN }}
          OWNER:   ${{ secrets.OWNER_TELEGRAM_ID }}
        run: |
          TOKEN="${T_V2T:-${T_TAROT:-$T_RT}}"
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then echo "ℹ️ OWNER_TELEGRAM_ID یا توکن ربات ست نشده — هشدار تلگرام رد شد"; exit 0; fi
          curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$OWNER" \
            --data-urlencode text="🚨 یک یا چند ربات ناسالم است — لاگ خطا: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          (برای دیباگ به Claude Code بگو: «ربات مشکل دارد، Health قرمز شده»)" || true

      - name: Create or update alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🚨 Health check failed — یک یا چند ربات ناسالم است"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="پایش خودکار سلامت شکست خورد. لاگ خطای ربات(های) ناسالم در خودِ همین run چاپ شده:
          $run_url

          برای دیباگ: workflow «Ops» را با action=logs و نام ربات اجرا کن (یا به Claude Code بگو)."
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title Health check failed" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
