# Health — ناظرِ **بیرونیِ** سلامت. از ۱۴۰۵/۰۵/۲۹ نقشش عوض شد.
#
# قبلاً: هر ۳۰ دقیقه SSH می‌زد و همه‌ی چک‌های ریز را خودش انجام می‌داد.
# مشکل: گیت‌هاب هر جاب را حتی برای ۱۷ ثانیه **یک دقیقه‌ی کامل** حساب می‌کند، پس ۴۸ اجرا
# در روز یعنی ~۱۴۴۰ دقیقه در ماه، ۷۲٪ کلِ سهمیه‌ی حساب. و همان زمان‌بندی هم تضمینی نبود
# (روی همین ریپو ۱ تا ۴ ساعت تأخیر دیده شد)، یعنی گران‌ترین چیزِ حساب دیرترین هشدار را می‌داد.
#
# حالا: همه‌ی چک‌های ریز (pm2، systemd، دیسک، موجودیِ OpenRouter) روی **خودِ سرور** و هر
# ۵ دقیقه اجرا می‌شوند — `tools/health-watch.mjs` که یک اپِ pm2 است و مستقیم به تلگرام
# هشدار می‌دهد. صفر دقیقه‌ی Actions و شش برابر سریع‌تر از قبل.
#
# ⚠️ چرا این فایل حذف نشد: ناظری که داخلِ همان چیزی است که می‌پاید، خودش را نمی‌پاید.
# اگر کلِ سرور یا خودِ pm2 بمیرد، آن ناظر هم با آن می‌میرد و هیچ‌کس خبردار نمی‌شود.
# پس این جاب ماند ولی فقط **دو سؤال** می‌پرسد: سرور جواب می‌دهد؟ و ناظر زنده است؟
# هر ۶ ساعت = ۴ اجرا در روز ≈ ۱۲۰ دقیقه در ماه (به‌جای ۱۴۴۰).
#
# معاوضه‌ی آگاهانه: مرگِ کاملِ سرور تا ۶ ساعت (به‌علاوه‌ی تأخیرِ خودِ گیت‌هاب) دیرتر دیده
# می‌شود. اگر روزی این ریسک بزرگ‌تر از هزینه شد، فقط همین cron را تنگ‌تر کن.
name: Health

on:
  schedule:
    # دقیقه‌ی ۱۷ عمدی است: صفِ زمان‌بندیِ گیت‌هاب سرِ ساعتِ گرد شلوغ‌ترین حالت را دارد.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: زنده بودنِ سرور و ناظرِ روی آن
        id: check
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/health_key
          chmod 600 ~/.ssh/health_key
          ssh-keyscan -H 185.204.171.170 >> ~/.ssh/known_hosts 2>/dev/null
          OUT=$(ssh -i ~/.ssh/health_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 ubuntu@185.204.171.170 'bash -s' <<'REMOTE'
            cd ~/voice2text
            # تنها چکِ این جاب: خودِ ناظر. بقیه‌ی چک‌ها کارِ اوست و اگر او زنده باشد،
            # هر خرابیِ دیگری حداکثر ۵ دقیقه بعد مستقیم به تلگرامِ مالک می‌رسد.
            pm2 jlist 2>/dev/null | node -e "
              let a = [];
              try { a = JSON.parse(require('fs').readFileSync(0, 'utf8')); } catch (e) {}
              const w = a.find(p => p.name === 'health-watch');
              if (!w) console.log('PROBLEM:🔴 ناظرِ سلامت («health-watch») اصلاً در pm2 نیست — یعنی از پایشِ پنج‌دقیقه‌ای خبری نیست. با Ops restart یا دیپلوی برگردانش.');
              else if (w.pm2_env.status !== 'online') console.log('PROBLEM:🔴 ناظرِ سلامت آفلاین است (وضعیت=' + w.pm2_env.status + ') — پایشِ پنج‌دقیقه‌ای متوقف شده.');
            "
            # اگر ناظر خراب است، لاگش تنها سرنخِ موجود است.
            pm2 jlist 2>/dev/null | node -e "
              let a = [];
              try { a = JSON.parse(require('fs').readFileSync(0, 'utf8')); } catch (e) {}
              const w = a.find(p => p.name === 'health-watch');
              process.exit(!w || w.pm2_env.status !== 'online' ? 0 : 1);
            " && {
              echo '===== health-watch — error.log (آخرین ۴۰ خط) ====='
              tail -n 40 ~/.pm2/logs/health-watch-error.log 2>/dev/null || echo '(خالی)'
            }
            echo "HEALTH_DONE"
          REMOTE
          )
          RC=$?
          echo "$OUT"
          # سرور در دسترس نیست (SSH ناموفق یا خروجی ناقص) = جدی‌ترین حالتِ ممکن،
          # و دقیقاً همان چیزی که ناظرِ روی سرور هرگز نمی‌تواند گزارش کند.
          if [ $RC -ne 0 ] || ! printf '%s' "$OUT" | grep -q 'HEALTH_DONE'; then
            LINE="🔴 سرور VPS در دسترس نیست (SSH ناموفق, rc=$RC) — ممکن است کلِ سرور یا شبکه داون باشد"
            { echo "alert<<EOF"; echo "$LINE"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "outage=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ALERT=$(printf '%s\n' "$OUT" | sed -n 's/^PROBLEM://p')
          { echo "alert<<EOF"; printf '%s\n' "$ALERT"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          if [ -n "$ALERT" ]; then echo "outage=true"; else echo "outage=false"; fi >> "$GITHUB_OUTPUT"
          [ -n "$ALERT" ] && printf '⚠️ %s\n' "$ALERT" || echo "✅ سرور جواب می‌دهد و ناظرِ سلامت روی آن زنده است"

      # پیام تلگرام به مالک(ها). این جاب فقط خرابیِ ریشه‌ای گزارش می‌دهد، پس هر پیامش مهم است.
      - name: هشدار تلگرام
        if: steps.check.outputs.outage == 'true'
        env:
          T_V2T:   ${{ secrets.VOICE2TEXT_BOT_TOKEN }}
          T_TAROT: ${{ secrets.TAROT_BOT_TOKEN }}
          OWNER:   ${{ secrets.OWNER_TELEGRAM_ID }}
          DETAIL:  ${{ steps.check.outputs.alert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN="${T_V2T:-$T_TAROT}"
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then echo "ℹ️ OWNER_TELEGRAM_ID یا توکن ربات ست نشده — هشدار تلگرام رد شد"; exit 0; fi
          MSG="🚨 پایشِ بیرونی — خرابیِ ریشه‌ای:

          $DETAIL

          لاگ کامل: $RUN_URL
          (به Claude Code بگو: «ربات مشکل دارد، Health قرمز شده» تا بررسی کنم)"
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$id" \
              --data-urlencode text="$MSG" >/dev/null || true
          done

      - name: ساخت یا آپدیتِ Issue
        if: steps.check.outputs.outage == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL:   ${{ steps.check.outputs.alert }}
        run: |
          title="🚨 Health check failed — خرابی ربات"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="پایشِ بیرونی خرابیِ ریشه‌ای پیدا کرد:

          $DETAIL

          لاگ کامل: $run_url
          برای دیباگ: workflow «Ops» با action=logs (یا به Claude Code بگو)."
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title Health check failed" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: قرمزکردنِ جاب در خرابی
        if: steps.check.outputs.outage == 'true'
        run: |
          echo "خرابیِ ریشه‌ای — جاب قرمز می‌شود."
          exit 1
