# Marketing — بازوی اجراییِ زیرساخت مارکتینگ کانال‌ها (قرارداد: بند «مارکتینگ کانال» CLAUDE.md ریشه)
#
# سشن‌های Claude Code این workflow را با workflow_dispatch اجرا می‌کنند
# (GitHub MCP: actions_run_trigger) و خروجی را از لاگ جاب می‌خوانند (get_job_logs).
#
# اکشن‌ها:
#   post          انتشار یک پست merge شده (marketing/<bot>/posts/*.json) در کانال با توکن خود ربات
#   day-post      انتشار دستیِ «روزِ کامل» (هدر + ۱۲ پستِ تصویری) از فایل <YYYY-MM-DD>-day.json
#   campaign-add  ثبت idempotent کد کمپین در platform.db داشبورد (تا در صفحه‌ی مارکتینگ قابل‌سنجش شود)
#   poll          انتشار نظرسنجی در کانال (marketing/<bot>/polls/*.json): متنِ زمینه‌ی اختیاری + sendPoll
#   getme         چاپ username واقعی ربات (برای پر کردن رجیستری بدون حدس)
#   delete        حذف پیام‌های خودِ ربات از کانال (Bot API فقط تا ۴۸ ساعت)
#
# نگاشت bot→token فقط همین‌جاست: ربات جدید = یک خط env + یک شاخه case (طبق چک‌لیست بند ۵ ریشه).
name: Marketing

on:
  # ⚠️ زمان‌بندی عمداً حذف شد (۴ شهریور ۱۴۰۵).
  # انتشارِ روزانه از GitHub Actions به **کرونِ خودِ VPS** منتقل شد:
  # tools/marketing/vps-daily-post.sh که deploy.yml نصبش می‌کند.
  # دلیل: سقفِ دقیقه‌ی Actions ریپوی خصوصی تمام‌شدنی است و وقتی تمام شد هیچ
  # workflow ای اجرا نمی‌شود؛ ۲۲ تا ۲۶ مرداد ۱۴۰۵ پنج روز پست دقیقاً به همین
  # دلیل از دست رفت. VPS نه سقفِ دقیقه دارد، نه به بیلینگِ گیت‌هاب وصل است.
  #
  # اینجا هیچ cron ای نباید برگردد: اگر برگردد، بعد از ریست‌شدنِ سهمیه هم Actions
  # منتشر می‌کند هم کرونِ سرور، و روز **دوبار** پست می‌شود (مارکرِ کشِ Actions و
  # مارکرِ روی سرور از هم بی‌خبرند). انتشارِ دستی با workflow_dispatch باقی است.
  workflow_dispatch:
    inputs:
      action:
        description: 'چه کاری؟'
        required: true
        type: choice
        options: [post, day-post, poll, campaign-add, getme, chat-info, delete]
      bot:
        description: 'کلید ربات در marketing/registry.json (مثل tarot یا tabir-khab)'
        required: true
      chat:
        description: 'مقصد پست: @channelusername یا آی‌دی عددی (برای post؛ خالی = فیلد chat خود فایل پست)'
        required: false
        default: ''
      path:
        description: 'مسیر فایل در ریپو: پستِ marketing/<bot>/posts/*.json (برای post) یا نظرسنجیِ marketing/<bot>/polls/*.json (برای poll)'
        required: false
        default: ''
      code:
        description: 'کد کمپین base62 (برای campaign-add)'
        required: false
        default: ''
      source:
        description: 'منبع کمپین = نام کانال، مثل @tarot_channel (برای campaign-add)'
        required: false
        default: ''
      name:
        description: 'برچسب کمپین (برای campaign-add)'
        required: false
        default: ''
      message_ids:
        description: 'شناسه‌ی پیام‌ها با کاما برای حذف (برای delete)، مثل 8,9,10'
        required: false
        default: ''

jobs:
  marketing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main — فایل پست باید merge شده باشد)
        if: inputs.action == 'post' || inputs.action == 'day-post' || inputs.action == 'poll'
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: inputs.action == 'day-post'
        with:
          node-version: '20'

      - name: Post to channel
        if: inputs.action == 'post'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          OWNER:      ${{ secrets.OWNER_TELEGRAM_ID }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CHAT:   ${{ inputs.chat }}
          MKT_PATH:   ${{ inputs.path }}
        run: |
          set -e
          # ضد تزریق و ضد path traversal: فقط الگوهای امن
          case "$MKT_BOT" in (*[!a-z0-9-]*|'') echo "❌ bot نامعتبر"; exit 1;; esac
          case "$MKT_PATH" in
            marketing/*/posts/*.json) ;;
            *) echo "❌ path باید marketing/<bot>/posts/<file>.json باشد"; exit 1;;
          esac
          case "$MKT_PATH" in (*..*) echo "❌ path نامعتبر"; exit 1;; esac
          [ -f "$MKT_PATH" ] || { echo "❌ فایل پست در main نیست: $MKT_PATH (اول merge کن)"; exit 1; }

          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده (این فایل را آپدیت کن)"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }

          CHAT="${MKT_CHAT:-$(jq -r '.chat // empty' "$MKT_PATH")}"
          # chat=owner یعنی «به‌جای کانال، به خودِ مالک بفرست» — برای دیدنِ یک قالبِ جدید
          # قبل از اینکه عمومی شود (مثلاً وقتی شکلِ کپشن عوض می‌شود).
          if [ "$CHAT" = "owner" ]; then
            CHAT="$(printf '%s' "$OWNER" | cut -d, -f1 | tr -d '[:space:]')"
            [ -n "$CHAT" ] || { echo "❌ chat=owner ولی OWNER_TELEGRAM_ID ست نیست"; exit 1; }
          fi
          case "$CHAT" in
            @[A-Za-z0-9_]*|-100[0-9]*|[0-9]*) ;;
            *) echo "❌ chat نامعتبر: «$CHAT»"; exit 1;;
          esac

          TEXT=$(jq -r '.text // empty' "$MKT_PATH")
          [ -n "$TEXT" ] || { echo "❌ فیلد text در فایل پست خالی است"; exit 1; }
          LEN=$(printf '%s' "$TEXT" | wc -m)
          [ "$LEN" -le 4096 ] || { echo "❌ متن پست $LEN کاراکتر است (سقف تلگرام 4096)"; exit 1; }

          BTN_TEXT=$(jq -r '.button_text // empty' "$MKT_PATH")
          BTN_URL=$(jq -r '.button_url // empty' "$MKT_PATH")
          PREVIEW=$(jq -r 'if .preview == true then "false" else "true" end' "$MKT_PATH")

          ARGS=( -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview="$PREVIEW" )
          if [ -n "$BTN_TEXT" ] && [ -n "$BTN_URL" ]; then
            KB=$(jq -cn --arg t "$BTN_TEXT" --arg u "$BTN_URL" '{inline_keyboard: [[{text: $t, url: $u}]]}')
            ARGS+=( -d reply_markup="$KB" )
          fi

          RESP=$(printf '%s' "$TEXT" | curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            "${ARGS[@]}" --data-urlencode text@- ) || { echo "❌ خطای شبکه در ارسال"; exit 1; }
          OK=$(printf '%s' "$RESP" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "❌ تلگرام رد کرد: $(printf '%s' "$RESP" | jq -r '.description // .')"
            exit 1
          fi
          MSG_ID=$(printf '%s' "$RESP" | jq -r '.result.message_id')
          echo "✅ پست منتشر شد: chat=$CHAT message_id=$MSG_ID path=$MKT_PATH"

      # نظرسنجیِ کانال: یک پیامِ متنیِ اختیاری (زمینه) + یک sendPoll.
      # چرا دو پیام و نه یکی: سقفِ سؤالِ نظرسنجی در تلگرام ۳۰۰ کاراکتر است، پس متنِ
      # معرفی نمی‌تواند داخلِ خودِ سؤال بنشیند. اعتبارسنجی کامل قبل از ارسالِ حتی یک
      # پیام انجام می‌شود (همان قاعده‌ی publish-day.mjs): نظرسنجیِ نیمه‌فرستاده بدتر از
      # نفرستادن است، چون پیامِ زمینه بدونِ سؤال در کانال می‌ماند.
      - name: Send poll
        if: inputs.action == 'poll'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          OWNER:      ${{ secrets.OWNER_TELEGRAM_ID }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CHAT:   ${{ inputs.chat }}
          MKT_PATH:   ${{ inputs.path }}
        run: |
          set -e
          case "$MKT_BOT" in (*[!a-z0-9-]*|'') echo "❌ bot نامعتبر"; exit 1;; esac
          case "$MKT_PATH" in
            marketing/*/polls/*.json) ;;
            *) echo "❌ path باید marketing/<bot>/polls/<file>.json باشد"; exit 1;;
          esac
          case "$MKT_PATH" in (*..*) echo "❌ path نامعتبر"; exit 1;; esac
          [ -f "$MKT_PATH" ] || { echo "❌ فایل نظرسنجی در main نیست: $MKT_PATH (اول merge کن)"; exit 1; }

          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده (این فایل را آپدیت کن)"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }

          CHAT="${MKT_CHAT:-$(jq -r '.chat // empty' "$MKT_PATH")}"
          if [ "$CHAT" = "owner" ]; then
            CHAT="$(printf '%s' "$OWNER" | cut -d, -f1 | tr -d '[:space:]')"
            [ -n "$CHAT" ] || { echo "❌ chat=owner ولی OWNER_TELEGRAM_ID ست نیست"; exit 1; }
          fi
          case "$CHAT" in
            @[A-Za-z0-9_]*|-100[0-9]*|[0-9]*) ;;
            *) echo "❌ chat نامعتبر: «$CHAT»"; exit 1;;
          esac

          # ---- اعتبارسنجیِ کامل، قبل از ارسالِ هر پیام ----
          QUESTION=$(jq -r '.question // empty' "$MKT_PATH")
          [ -n "$QUESTION" ] || { echo "❌ فیلد question خالی است"; exit 1; }
          QLEN=$(printf '%s' "$QUESTION" | wc -m)
          [ "$QLEN" -le 300 ] || { echo "❌ سؤال $QLEN کاراکتر است (سقف تلگرام 300)"; exit 1; }

          jq -e '.options | type == "array"' "$MKT_PATH" >/dev/null || { echo "❌ options باید آرایه باشد"; exit 1; }
          NOPT=$(jq -r '.options | length' "$MKT_PATH")
          [ "$NOPT" -ge 2 ] && [ "$NOPT" -le 12 ] || { echo "❌ تعداد گزینه‌ها $NOPT است (تلگرام: ۲ تا ۱۲)"; exit 1; }
          BAD=$(jq -r '[.options[] | select((.|length) == 0 or (.|length) > 100)] | length' "$MKT_PATH")
          [ "$BAD" = "0" ] || { echo "❌ $BAD گزینه خالی یا بیش از ۱۰۰ کاراکتر است"; exit 1; }

          TEXT=$(jq -r '.text // empty' "$MKT_PATH")
          if [ -n "$TEXT" ]; then
            TLEN=$(printf '%s' "$TEXT" | wc -m)
            [ "$TLEN" -le 4096 ] || { echo "❌ متنِ زمینه $TLEN کاراکتر است (سقف 4096)"; exit 1; }
          fi
          echo "✔ اعتبارسنجی گذشت: سؤال $QLEN کاراکتر، $NOPT گزینه، متنِ زمینه ${TEXT:+دارد}${TEXT:-ندارد}"

          # ---- ارسال ----
          if [ -n "$TEXT" ]; then
            RESP=$(printf '%s' "$TEXT" | curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview=true \
              --data-urlencode text@-) || { echo "❌ خطای شبکه در ارسالِ متنِ زمینه"; exit 1; }
            OK=$(printf '%s' "$RESP" | jq -r '.ok')
            if [ "$OK" != "true" ]; then
              echo "❌ تلگرام متنِ زمینه را رد کرد: $(printf '%s' "$RESP" | jq -r '.description // .')"
              exit 1
            fi
            echo "✅ متنِ زمینه منتشر شد: message_id=$(printf '%s' "$RESP" | jq -r '.result.message_id')"
          fi

          OPTS=$(jq -c '.options' "$MKT_PATH")
          ANON=$(jq -r 'if .is_anonymous == false then "false" else "true" end' "$MKT_PATH")
          MULTI=$(jq -r 'if .allows_multiple_answers == true then "true" else "false" end' "$MKT_PATH")
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendPoll" \
            -d chat_id="$CHAT" -d is_anonymous="$ANON" -d allows_multiple_answers="$MULTI" \
            --data-urlencode question="$QUESTION" --data-urlencode options="$OPTS") \
            || { echo "❌ خطای شبکه در ارسالِ نظرسنجی"; exit 1; }
          OK=$(printf '%s' "$RESP" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "❌ تلگرام نظرسنجی را رد کرد: $(printf '%s' "$RESP" | jq -r '.description // .')"
            exit 1
          fi
          echo "✅ نظرسنجی منتشر شد: chat=$CHAT message_id=$(printf '%s' "$RESP" | jq -r '.result.message_id')"

      # حذفِ پیام‌های خودِ ربات از کانال (Bot API فقط پیامِ خودش را و فقط تا ۴۸ ساعت می‌تواند پاک کند)
      - name: Delete messages
        if: inputs.action == 'delete'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CHAT:   ${{ inputs.chat }}
          MKT_IDS:    ${{ inputs.message_ids }}
        run: |
          set -e
          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }
          case "$MKT_CHAT" in (@[A-Za-z0-9_]*|-100[0-9]*) ;; (*) echo "❌ chat نامعتبر: «$MKT_CHAT»"; exit 1;; esac
          case "$MKT_IDS" in (*[!0-9,]*|'') echo "❌ message_ids فقط عدد و کاما"; exit 1;; esac
          OK=0; FAIL=0
          for ID in $(printf '%s' "$MKT_IDS" | tr ',' ' '); do
            RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/deleteMessage" \
              -d chat_id="$MKT_CHAT" -d message_id="$ID") || { echo "❌ خطای شبکه روی $ID"; FAIL=$((FAIL+1)); continue; }
            if [ "$(printf '%s' "$RESP" | jq -r '.ok')" = "true" ]; then
              echo "🗑 پیام $ID پاک شد"; OK=$((OK+1))
            else
              echo "⏭ پیام $ID پاک نشد: $(printf '%s' "$RESP" | jq -r '.description // .')"; FAIL=$((FAIL+1))
            fi
          done
          echo "نتیجه: $OK پاک شد، $FAIL ناموفق"

      # انتشارِ دستیِ روزِ کامل (همان منطقِ جابِ زمان‌بندی‌شده)
      - name: Day post (manual)
        id: manual_day
        if: inputs.action == 'day-post'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_PATH:   ${{ inputs.path }}
        run: |
          set -e
          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }
          case "$MKT_PATH" in
            marketing/*/posts/*-day.json) ;;
            *) echo "❌ مسیر باید marketing/<bot>/posts/<YYYY-MM-DD>-day.json باشد"; exit 1;;
          esac
          case "$MKT_PATH" in *..*) echo "❌ مسیر نامعتبر"; exit 1;; esac
          TELEGRAM_TOKEN="$TOKEN" node tools/marketing/publish-day.mjs --file "$MKT_PATH"
          # تاریخِ روز از نامِ فایل، برای گذاشتنِ همان مارکرِ idempotency که جابِ زمان‌بندی‌شده
          # می‌خواند. بدون این، انتشارِ دستی «نامرئی» می‌ماند و پنجره‌ی بعدیِ همان روز دوباره منتشر می‌کرد.
          DAY=$(basename "$MKT_PATH" -day.json)
          case "$DAY" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) date -u +%FT%TZ > .daypost-marker
              echo "day=$DAY" >> "$GITHUB_OUTPUT";;
            *) echo "⚠️ تاریخ از نامِ فایل درنیامد؛ مارکر گذاشته نشد";;
          esac

      - name: Save publish marker (manual)
        if: steps.manual_day.outputs.day != ''
        uses: actions/cache/save@v4
        with:
          path: .daypost-marker
          key: daypost-${{ steps.manual_day.outputs.day }}

      # تعدادِ ممبرِ کانال. Bot API هیچ متدی برای **لیست‌کردنِ** ممبرهای کانال ندارد
      # (نه getChatMembers، نه چیزی معادلش)؛ فقط شمارشِ کل و وضعیتِ یک کاربرِ مشخص.
      # پس همپوشانیِ «کانال در برابر ربات» فقط در سطحِ عدد قابل‌محاسبه است، نه لیست.
      - name: Chat info (chat-info)
        if: inputs.action == 'chat-info'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CHAT:   ${{ inputs.chat }}
        run: |
          set -e
          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }
          case "$MKT_CHAT" in (@[A-Za-z0-9_]*|-100[0-9]*) ;; (*) echo "❌ chat نامعتبر: «$MKT_CHAT»"; exit 1;; esac
          CNT=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChatMemberCount" -d chat_id="$MKT_CHAT")
          echo "getChatMemberCount($MKT_CHAT): $(printf '%s' "$CNT" | jq -r 'if .ok then .result else ("❌ " + (.description // "خطا")) end')"
          INF=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChat" -d chat_id="$MKT_CHAT")
          printf '%s' "$INF" | jq -r 'if .ok then "title: \(.result.title // "-")   type: \(.result.type)" else ("❌ " + (.description // "خطا")) end'

      - name: Get bot username (getme)
        if: inputs.action == 'getme'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
        run: |
          set -e
          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }
          RESP=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getMe")
          echo "getMe($MKT_BOT): username=@$(printf '%s' "$RESP" | jq -r '.result.username') id=$(printf '%s' "$RESP" | jq -r '.result.id')"

      - name: Register campaign code on VPS (campaign-add)
        if: inputs.action == 'campaign-add'
        uses: appleboy/ssh-action@v1
        env:
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CODE:   ${{ inputs.code }}
          MKT_SOURCE: ${{ inputs.source }}
          MKT_NAME:   ${{ inputs.name }}
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MKT_BOT,MKT_CODE,MKT_SOURCE,MKT_NAME
          script: |
            set -e
            cd ~/voice2text/bots/dashboard
            # ضد تزریق: مقادیر فقط از env و فقط bound parameter وارد SQL می‌شوند
            case "$MKT_BOT"  in (*[!a-z0-9-]*|'') echo "❌ bot نامعتبر"; exit 1;; esac
            case "$MKT_CODE" in (*[!A-Za-z0-9]*|'') echo "❌ code نامعتبر"; exit 1;; esac
            node -e "
              const D = require('better-sqlite3');
              const db = new D('./data/platform.db');
              db.pragma('journal_mode = WAL'); db.pragma('busy_timeout = 5000');
              const { MKT_BOT, MKT_CODE, MKT_SOURCE, MKT_NAME } = process.env;
              const ex = db.prepare('SELECT * FROM campaigns WHERE code=?').get(MKT_CODE);
              if (ex) { console.log('⏭ کد از قبل ثبت است:', JSON.stringify(ex)); process.exit(0); }
              db.prepare('INSERT INTO campaigns (code, bot, source, medium, name, notes) VALUES (?,?,?,?,?,?)')
                .run(MKT_CODE, MKT_BOT, MKT_SOURCE || '', 'content', MKT_NAME || '', 'ساخته‌شده از workflow Marketing');
              db.prepare('INSERT INTO audit_log (action, target, details) VALUES (?,?,?)')
                .run('campaign.create', MKT_BOT + ':' + MKT_CODE, 'via Marketing workflow (' + (MKT_SOURCE || '') + ')');
              console.log('✅ کمپین ثبت شد:', JSON.stringify(db.prepare('SELECT * FROM campaigns WHERE code=?').get(MKT_CODE)));
            "

      - name: Telegram alert to owner on failure
        if: failure()
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          OWNER:      ${{ secrets.OWNER_TELEGRAM_ID }}
          MKT_ACTION: ${{ inputs.action }}
          MKT_BOT:    ${{ inputs.bot }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN="${T_TAROT:-$T_TABIR_FA}"
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then echo "توکن/OWNER ست نیست؛ هشدار تلگرامی رد شد"; exit 0; fi
          MSG="⚠️ اجرای Marketing شکست خورد: action=$MKT_ACTION bot=$MKT_BOT
          $RUN_URL"
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$id" \
              --data-urlencode text="$MSG" >/dev/null || true
          done
