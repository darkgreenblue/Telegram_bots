# Marketing — بازوی اجراییِ زیرساخت مارکتینگ کانال‌ها (قرارداد: بند «مارکتینگ کانال» CLAUDE.md ریشه)
#
# سشن‌های Claude Code این workflow را با workflow_dispatch اجرا می‌کنند
# (GitHub MCP: actions_run_trigger) و خروجی را از لاگ جاب می‌خوانند (get_job_logs).
#
# اکشن‌ها:
#   post          انتشار یک پست merge شده (marketing/<bot>/posts/*.json) در کانال با توکن خود ربات
#   campaign-add  ثبت idempotent کد کمپین در platform.db داشبورد (تا در صفحه‌ی مارکتینگ قابل‌سنجش شود)
#   getme         چاپ username واقعی ربات (برای پر کردن رجیستری بدون حدس)
#
# نگاشت bot→token فقط همین‌جاست: ربات جدید = یک خط env + یک شاخه case (طبق چک‌لیست بند ۵ ریشه).
name: Marketing

on:
  # انتشار زمان‌بندی‌شده‌ی اسلات‌های روزانه (قرارداد: marketing/tarot/strategy.md بند ۳).
  # هر cron یکی از ۵ اسلات تهران است (تهران = UTC+3:30 ثابت):
  #   ۰۸:۳۰ ← 05:00 UTC | ۱۴:۰۰ ← 10:30 | ۱۷:۰۰ ← 13:30 | ۲۰:۳۰ ← 17:00 | ۲۳:۰۰ ← 19:30
  # جاب slot-post فایل marketing/<bot>/posts/<تاریخ-تهران>-s<slot>.json را (اگر merge شده باشد)
  # منتشر می‌کند؛ نبودن فایل = رد بی‌صدا (روتین تولید محتوا هنوز نرسیده یا آن روز عمداً خالی است).
  schedule:
    # ۱۰ اسلات روزانه — همه UTC؛ تهران = UTC+3:30 (ایران ساعت تابستانی ندارد)
    - cron: '30 4 * * *'   # 08:00 تهران
    - cron: '0 6 * * *'    # 09:30
    - cron: '30 7 * * *'   # 11:00
    - cron: '0 9 * * *'    # 12:30
    - cron: '30 10 * * *'  # 14:00
    - cron: '30 12 * * *'  # 16:00
    - cron: '30 14 * * *'  # 18:00
    - cron: '30 16 * * *'  # 20:00
    - cron: '0 18 * * *'   # 21:30
    - cron: '30 19 * * *'  # 23:00
  workflow_dispatch:
    inputs:
      action:
        description: 'چه کاری؟'
        required: true
        type: choice
        options: [post, campaign-add, getme, delete]
      bot:
        description: 'کلید ربات در marketing/registry.json (مثل tarot یا tabir-khab)'
        required: true
      chat:
        description: 'مقصد پست: @channelusername یا آی‌دی عددی (برای post؛ خالی = فیلد chat خود فایل پست)'
        required: false
        default: ''
      path:
        description: 'مسیر فایل پست در ریپو، مثل marketing/tarot/posts/2026-07-27.json (برای post)'
        required: false
        default: ''
      code:
        description: 'کد کمپین base62 (برای campaign-add)'
        required: false
        default: ''
      source:
        description: 'منبع کمپین = نام کانال، مثل @tarot_channel (برای campaign-add)'
        required: false
        default: ''
      name:
        description: 'برچسب کمپین (برای campaign-add)'
        required: false
        default: ''
      message_ids:
        description: 'شناسه‌ی پیام‌ها با کاما برای حذف (برای delete)، مثل 8,9,10'
        required: false
        default: ''

jobs:
  # انتشار خودکار اسلاتِ الان (فقط روی رویداد schedule)
  slot-post:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish current slot posts
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
        run: |
          set -e
          # اسلات = نزدیک‌ترین زمانِ اسلات به الان (ضد تأخیرِ چند دقیقه‌ایِ کرانِ گیت‌هاب)
          NOW_MIN=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          BEST_SLOT=""; BEST_DIST=999999
          i=0
          for M in 270 360 450 540 630 750 870 990 1080 1170; do
            i=$((i+1))
            D=$(( NOW_MIN - M )); [ $D -lt 0 ] && D=$(( -D ))
            if [ $D -lt $BEST_DIST ]; then BEST_DIST=$D; BEST_SLOT=$i; fi
          done
          # تاریخِ تهران (UTC+3:30)
          TODAY=$(date -u -d '+3 hours +30 minutes' +%F)
          echo "🕐 اسلات $BEST_SLOT برای $TODAY (فاصله از زمان اسمی: ${BEST_DIST}m)"

          FOUND=0
          for F in marketing/*/posts/${TODAY}-s${BEST_SLOT}.json; do
            [ -f "$F" ] || continue
            FOUND=1
            BOT=$(echo "$F" | cut -d/ -f2)
            case "$BOT" in
              tarot)      TOKEN="$T_TAROT";;
              tabir-khab) TOKEN="$T_TABIR_FA";;
              *) echo "⏭ $F: نگاشت توکن برای «$BOT» نیست"; continue;;
            esac
            [ -n "$TOKEN" ] || { echo "⏭ $F: Secret توکن ست نیست"; continue; }

            CHAT=$(jq -r '.chat // empty' "$F")
            TEXT=$(jq -r '.text // empty' "$F")
            case "$CHAT" in (@[A-Za-z0-9_]*|-100[0-9]*) ;; (*) echo "❌ $F: chat نامعتبر"; exit 1;; esac
            [ -n "$TEXT" ] || { echo "❌ $F: متن خالی"; exit 1; }
            LEN=$(printf '%s' "$TEXT" | wc -m)
            [ "$LEN" -le 4096 ] || { echo "❌ $F: متن $LEN کاراکتر (سقف 4096)"; exit 1; }

            BTN_TEXT=$(jq -r '.button_text // empty' "$F")
            BTN_URL=$(jq -r '.button_url // empty' "$F")
            PREVIEW=$(jq -r 'if .preview == true then "false" else "true" end' "$F")
            SILENT=$(jq -r 'if .silent == true then "true" else "false" end' "$F")

            ARGS=( -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview="$PREVIEW" -d disable_notification="$SILENT" )
            if [ -n "$BTN_TEXT" ] && [ -n "$BTN_URL" ]; then
              KB=$(jq -cn --arg t "$BTN_TEXT" --arg u "$BTN_URL" '{inline_keyboard: [[{text: $t, url: $u}]]}')
              ARGS+=( -d reply_markup="$KB" )
            fi
            RESP=$(printf '%s' "$TEXT" | curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              "${ARGS[@]}" --data-urlencode text@- ) || { echo "❌ $F: خطای شبکه"; exit 1; }
            OK=$(printf '%s' "$RESP" | jq -r '.ok')
            if [ "$OK" != "true" ]; then
              echo "❌ $F: تلگرام رد کرد: $(printf '%s' "$RESP" | jq -r '.description // .')"
              exit 1
            fi
            echo "✅ اسلات $BEST_SLOT منتشر شد: $F → $CHAT message_id=$(printf '%s' "$RESP" | jq -r '.result.message_id') silent=$SILENT"
          done
          [ "$FOUND" = "1" ] || echo "⏭ فایل پستی برای اسلات $BEST_SLOT امروز نیست (روتین محتوا هنوز merge نکرده)"

      - name: Telegram alert to owner on failure
        if: failure()
        env:
          T_TAROT: ${{ secrets.TAROT_BOT_TOKEN }}
          OWNER:   ${{ secrets.OWNER_TELEGRAM_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$T_TAROT" ] || [ -z "$OWNER" ]; then exit 0; fi
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${T_TAROT}/sendMessage" -d chat_id="$id" \
              --data-urlencode text="⚠️ انتشار اسلات زمان‌بندی‌شده‌ی کانال شکست خورد
          $RUN_URL" >/dev/null || true
          done

  marketing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main — فایل پست باید merge شده باشد)
        if: inputs.action == 'post'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Post to channel
        if: inputs.action == 'post'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CHAT:   ${{ inputs.chat }}
          MKT_PATH:   ${{ inputs.path }}
        run: |
          set -e
          # ضد تزریق و ضد path traversal: فقط الگوهای امن
          case "$MKT_BOT" in (*[!a-z0-9-]*|'') echo "❌ bot نامعتبر"; exit 1;; esac
          case "$MKT_PATH" in
            marketing/*/posts/*.json) ;;
            *) echo "❌ path باید marketing/<bot>/posts/<file>.json باشد"; exit 1;;
          esac
          case "$MKT_PATH" in (*..*) echo "❌ path نامعتبر"; exit 1;; esac
          [ -f "$MKT_PATH" ] || { echo "❌ فایل پست در main نیست: $MKT_PATH (اول merge کن)"; exit 1; }

          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده (این فایل را آپدیت کن)"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }

          CHAT="${MKT_CHAT:-$(jq -r '.chat // empty' "$MKT_PATH")}"
          case "$CHAT" in
            @[A-Za-z0-9_]*|-100[0-9]*|[0-9]*) ;;
            *) echo "❌ chat نامعتبر: «$CHAT»"; exit 1;;
          esac

          TEXT=$(jq -r '.text // empty' "$MKT_PATH")
          [ -n "$TEXT" ] || { echo "❌ فیلد text در فایل پست خالی است"; exit 1; }
          LEN=$(printf '%s' "$TEXT" | wc -m)
          [ "$LEN" -le 4096 ] || { echo "❌ متن پست $LEN کاراکتر است (سقف تلگرام 4096)"; exit 1; }

          BTN_TEXT=$(jq -r '.button_text // empty' "$MKT_PATH")
          BTN_URL=$(jq -r '.button_url // empty' "$MKT_PATH")
          PREVIEW=$(jq -r 'if .preview == true then "false" else "true" end' "$MKT_PATH")

          ARGS=( -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview="$PREVIEW" )
          if [ -n "$BTN_TEXT" ] && [ -n "$BTN_URL" ]; then
            KB=$(jq -cn --arg t "$BTN_TEXT" --arg u "$BTN_URL" '{inline_keyboard: [[{text: $t, url: $u}]]}')
            ARGS+=( -d reply_markup="$KB" )
          fi

          RESP=$(printf '%s' "$TEXT" | curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            "${ARGS[@]}" --data-urlencode text@- ) || { echo "❌ خطای شبکه در ارسال"; exit 1; }
          OK=$(printf '%s' "$RESP" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "❌ تلگرام رد کرد: $(printf '%s' "$RESP" | jq -r '.description // .')"
            exit 1
          fi
          MSG_ID=$(printf '%s' "$RESP" | jq -r '.result.message_id')
          echo "✅ پست منتشر شد: chat=$CHAT message_id=$MSG_ID path=$MKT_PATH"

      # حذفِ پیام‌های خودِ ربات از کانال (Bot API فقط پیامِ خودش را و فقط تا ۴۸ ساعت می‌تواند پاک کند)
      - name: Delete messages
        if: inputs.action == 'delete'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CHAT:   ${{ inputs.chat }}
          MKT_IDS:    ${{ inputs.message_ids }}
        run: |
          set -e
          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }
          case "$MKT_CHAT" in (@[A-Za-z0-9_]*|-100[0-9]*) ;; (*) echo "❌ chat نامعتبر: «$MKT_CHAT»"; exit 1;; esac
          case "$MKT_IDS" in (*[!0-9,]*|'') echo "❌ message_ids فقط عدد و کاما"; exit 1;; esac
          OK=0; FAIL=0
          for ID in $(printf '%s' "$MKT_IDS" | tr ',' ' '); do
            RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/deleteMessage" \
              -d chat_id="$MKT_CHAT" -d message_id="$ID") || { echo "❌ خطای شبکه روی $ID"; FAIL=$((FAIL+1)); continue; }
            if [ "$(printf '%s' "$RESP" | jq -r '.ok')" = "true" ]; then
              echo "🗑 پیام $ID پاک شد"; OK=$((OK+1))
            else
              echo "⏭ پیام $ID پاک نشد: $(printf '%s' "$RESP" | jq -r '.description // .')"; FAIL=$((FAIL+1))
            fi
          done
          echo "نتیجه: $OK پاک شد، $FAIL ناموفق"

      - name: Get bot username (getme)
        if: inputs.action == 'getme'
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          MKT_BOT:    ${{ inputs.bot }}
        run: |
          set -e
          case "$MKT_BOT" in
            tarot)      TOKEN="$T_TAROT";;
            tabir-khab) TOKEN="$T_TABIR_FA";;
            *) echo "❌ نگاشت توکن برای «$MKT_BOT» تعریف نشده"; exit 1;;
          esac
          [ -n "$TOKEN" ] || { echo "❌ Secret توکن ربات $MKT_BOT ست نیست"; exit 1; }
          RESP=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getMe")
          echo "getMe($MKT_BOT): username=@$(printf '%s' "$RESP" | jq -r '.result.username') id=$(printf '%s' "$RESP" | jq -r '.result.id')"

      - name: Register campaign code on VPS (campaign-add)
        if: inputs.action == 'campaign-add'
        uses: appleboy/ssh-action@v1
        env:
          MKT_BOT:    ${{ inputs.bot }}
          MKT_CODE:   ${{ inputs.code }}
          MKT_SOURCE: ${{ inputs.source }}
          MKT_NAME:   ${{ inputs.name }}
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MKT_BOT,MKT_CODE,MKT_SOURCE,MKT_NAME
          script: |
            set -e
            cd ~/voice2text/bots/dashboard
            # ضد تزریق: مقادیر فقط از env و فقط bound parameter وارد SQL می‌شوند
            case "$MKT_BOT"  in (*[!a-z0-9-]*|'') echo "❌ bot نامعتبر"; exit 1;; esac
            case "$MKT_CODE" in (*[!A-Za-z0-9]*|'') echo "❌ code نامعتبر"; exit 1;; esac
            node -e "
              const D = require('better-sqlite3');
              const db = new D('./data/platform.db');
              db.pragma('journal_mode = WAL'); db.pragma('busy_timeout = 5000');
              const { MKT_BOT, MKT_CODE, MKT_SOURCE, MKT_NAME } = process.env;
              const ex = db.prepare('SELECT * FROM campaigns WHERE code=?').get(MKT_CODE);
              if (ex) { console.log('⏭ کد از قبل ثبت است:', JSON.stringify(ex)); process.exit(0); }
              db.prepare('INSERT INTO campaigns (code, bot, source, medium, name, notes) VALUES (?,?,?,?,?,?)')
                .run(MKT_CODE, MKT_BOT, MKT_SOURCE || '', 'content', MKT_NAME || '', 'ساخته‌شده از workflow Marketing');
              db.prepare('INSERT INTO audit_log (action, target, details) VALUES (?,?,?)')
                .run('campaign.create', MKT_BOT + ':' + MKT_CODE, 'via Marketing workflow (' + (MKT_SOURCE || '') + ')');
              console.log('✅ کمپین ثبت شد:', JSON.stringify(db.prepare('SELECT * FROM campaigns WHERE code=?').get(MKT_CODE)));
            "

      - name: Telegram alert to owner on failure
        if: failure()
        env:
          T_TAROT:    ${{ secrets.TAROT_BOT_TOKEN }}
          T_TABIR_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          OWNER:      ${{ secrets.OWNER_TELEGRAM_ID }}
          MKT_ACTION: ${{ inputs.action }}
          MKT_BOT:    ${{ inputs.bot }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN="${T_TAROT:-$T_TABIR_FA}"
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then echo "توکن/OWNER ست نیست؛ هشدار تلگرامی رد شد"; exit 0; fi
          MSG="⚠️ اجرای Marketing شکست خورد: action=$MKT_ACTION bot=$MKT_BOT
          $RUN_URL"
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$id" \
              --data-urlencode text="$MSG" >/dev/null || true
          done
