name: Deploy Notebook Podcast

on:
  pull_request:
    paths:
      - 'bots/notebook-podcast/**'
      - '.github/workflows/deploy-notebook-podcast.yml'
  push:
    branches: [main]
    paths:
      - 'bots/notebook-podcast/**'
      - '.github/workflows/deploy-notebook-podcast.yml'
  workflow_dispatch:

# This bot has its own PM2 app and files. A separate queue prevents GitHub from
# cancelling its pending run when the monorepo's main deploy queues up.
concurrency:
  group: deploy-notebook-podcast
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r bots/notebook-podcast/requirements.txt
      - name: Validate code
        run: |
          python -m compileall -q bots/notebook-podcast
          python -m unittest discover -s bots/notebook-podcast -p 'test_*.py'
      - name: Check required secrets
        if: github.event_name != 'pull_request'
        id: ready
        env:
          BOT_TOKEN: ${{ secrets.NOTEBOOK_PODCAST_BOT_TOKEN }}
          OWNER_IDS: ${{ secrets.OWNER_TELEGRAM_ID }}
          MASTER_TOKEN: ${{ secrets.NOTEBOOK_PODCAST_GOOGLE_MASTER_TOKEN_JSON }}
          PROXY_CONFIG: ${{ secrets.NOTEBOOK_PODCAST_PROXY_CONFIG_JSON }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$OWNER_IDS" ] && [ -n "$MASTER_TOKEN" ] && [ -n "$PROXY_CONFIG" ] && [ -n "$SSH_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '⚠️ Required secrets: NOTEBOOK_PODCAST_BOT_TOKEN, OWNER_TELEGRAM_ID, NOTEBOOK_PODCAST_GOOGLE_MASTER_TOKEN_JSON, NOTEBOOK_PODCAST_PROXY_CONFIG_JSON, VPS_SSH_KEY'
          fi
      - name: Deploy only notebook-podcast
        if: steps.ready.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.NOTEBOOK_PODCAST_BOT_TOKEN }}
          OWNER_IDS: ${{ secrets.OWNER_TELEGRAM_ID }}
          MASTER_TOKEN: ${{ secrets.NOTEBOOK_PODCAST_GOOGLE_MASTER_TOKEN_JSON }}
          PROXY_CONFIG: ${{ secrets.NOTEBOOK_PODCAST_PROXY_CONFIG_JSON }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]
          [[ "$OWNER_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]
          python -c 'import json,os; v=json.loads(os.environ["MASTER_TOKEN"]); assert isinstance(v,dict)'
          python -c 'import json,os; v=json.loads(os.environ["PROXY_CONFIG"]); i=v["inbounds"]; b={x["tag"] for x in v["routing"]["balancers"]}; assert all(x["listen"]=="127.0.0.1" and x["protocol"]=="http" for x in i); assert {x["port"] for x in i}=={18759,*range(18760,18766),*range(18770,18773),*range(18775,18780)}; assert {"active","job-0","job-1","job-2"}<=b; assert len(v["outbounds"])==11; assert v["api"]["listen"]=="127.0.0.1:18769"'
          curl -fsSL -o /tmp/notebook-podcast-xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/notebook-podcast-xray.zip' | sha256sum -c -
          unzip -p /tmp/notebook-podcast-xray.zip xray > /tmp/notebook-podcast-xray
          chmod 700 /tmp/notebook-podcast-xray
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/notebook_podcast_key"
          chmod 600 "$HOME/.ssh/notebook_podcast_key"
          ssh-keyscan -H 185.204.171.170 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          SSH=(ssh -i "$HOME/.ssh/notebook_podcast_key" -o StrictHostKeyChecking=yes ubuntu@185.204.171.170)
          TARGET=/home/ubuntu/voice2text/bots/notebook-podcast
          # Archive tracked source only; never copy the runner's SQLite test data.
          git archive HEAD:bots/notebook-podcast | "${SSH[@]}" "mkdir -p '$TARGET' && tar -xf - -C '$TARGET'"
          "${SSH[@]}" "mkdir -p '$TARGET/.proxy' && chmod 700 '$TARGET/.proxy'"
          cat /tmp/notebook-podcast-xray | "${SSH[@]}" "umask 077; cat > '$TARGET/.proxy/xray.new' && chmod 700 '$TARGET/.proxy/xray.new' && mv '$TARGET/.proxy/xray.new' '$TARGET/.proxy/xray'"
          printf '%s' "$PROXY_CONFIG" | "${SSH[@]}" "umask 077; cat > '$TARGET/.proxy/config.json.new' && mv '$TARGET/.proxy/config.json.new' '$TARGET/.proxy/config.json'"
          printf 'BOT_TOKEN=%s\nADMIN_IDS=%s\nNOTEBOOKLM_PROFILE=notebook-podcast\n' "$BOT_TOKEN" "$OWNER_IDS" \
            | "${SSH[@]}" "umask 077; cat > '$TARGET/.env.new' && mv '$TARGET/.env.new' '$TARGET/.env'"
          printf '%s' "$MASTER_TOKEN" \
            | "${SSH[@]}" 'umask 077; mkdir -p ~/.notebooklm/profiles/notebook-podcast; cat > ~/.notebooklm/profiles/notebook-podcast/master_token.json.new && mv ~/.notebooklm/profiles/notebook-podcast/master_token.json.new ~/.notebooklm/profiles/notebook-podcast/master_token.json'
          "${SSH[@]}" "set -e;
            cd '$TARGET';
            python3 -m venv .venv;
            .venv/bin/pip install -q -r requirements.txt;
            .proxy/xray run -test -config .proxy/config.json;
            pm2 startOrReload ecosystem.config.cjs --only notebook-podcast-proxy --update-env;
            sleep 3;
            for port in 18764 18776 18760 18761 18762 18763 18765 18775 18777 18778 18779; do
              if HTTP_PROXY=http://127.0.0.1:\$port HTTPS_PROXY=http://127.0.0.1:\$port timeout 30 .venv/bin/notebooklm -p notebook-podcast auth refresh --verify >/dev/null 2>&1; then break; fi;
            done;
            .venv/bin/python proxy_select.py;
            curl --proxy http://127.0.0.1:18759 -fsS -o /dev/null --max-time 20 https://notebooklm.google.com/;
            export HTTP_PROXY=http://127.0.0.1:18759 HTTPS_PROXY=http://127.0.0.1:18759;
            .venv/bin/notebooklm -p notebook-podcast auth check --test --json | .venv/bin/python -c 'import json,sys; x=json.load(sys.stdin); assert x.get(\"status\")==\"ok\" and x.get(\"checks\",{}).get(\"token_fetch\") is True';
            .venv/bin/python -c 'import httpx; from pathlib import Path; token=next(x.split(\"=\",1)[1] for x in Path(\".env\").read_text().splitlines() if x.startswith(\"BOT_TOKEN=\")); r=httpx.get(\"https://api.telegram.org/bot\"+token+\"/getMe\",timeout=20); assert r.status_code==200 and r.json().get(\"ok\") is True';
            pm2 startOrReload ecosystem.config.cjs --only notebook-podcast --update-env;
            sleep 3;
            pm2 jlist | node -e 'const a=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\"));const p=a.find(x=>x.name===\"notebook-podcast\");process.exit(p?.pm2_env?.status===\"online\"?0:1)';
            pm2 jlist | node -e 'const a=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\"));process.exit(a.every(x=>x.pm2_env.status===\"online\")?0:1)' && pm2 save || echo 'pm2 save skipped: another app is not online';
            echo 'notebook-podcast deployed and online'"
