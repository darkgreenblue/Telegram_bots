# Tarot video — ساختِ ویدیوی عمودیِ ریلز از یک فالِ **ناشناس** و ارسالش به چتِ ادمین.
#
# چرا این‌جا و نه روی سرور: رندرِ Remotion یک مرورگرِ headless بالا می‌آورد و چند دقیقه CPU
# می‌گیرد. همان سرور، ربات‌های درآمدزا را اجرا می‌کند و یک اسپایکِ CPU آن‌جا یعنی ریسک روی
# پولِ واقعی. این جاب هیچ چیزی از سرور نمی‌خواهد (نه دیتابیس، نه دسترسیِ SSH) و هیچ رباتی را
# ری‌استارت نمی‌کند، پس دقیقاً مثل `reading-lab.yml` روی رانرِ گیت‌هاب می‌نشیند.
#
# هزینه: هر ران حدود ۸ تا ۱۵ دقیقه از سهمیه‌ی Actions. برای همین `Health` از پایشِ هر
# ۳۰ دقیقه‌ای به ناظرِ روی سرور منتقل شد؛ بدونِ آن، جا برای این جاب وجود نداشت.
#
# تنها هزینه‌ی مدل، یک فراخوانیِ فال است (~۰.۶ سنت) روی همان کلیدِ محصول، دقیقاً الگوی
# آزمایشگاهِ خوانش.
#
# ⚠️ سوالِ فال هرگز روی ویدیو نوشته نمی‌شود: مالک آن را در استیکرِ «سوال» اینستاگرام تایپ
# می‌کند و ویدیو فقط جای آن مستطیل را خالی نگه می‌دارد.
name: Tarot video

on:
  workflow_dispatch:
    inputs:
      background:
        description: 'پس‌زمینه'
        type: choice
        required: false
        default: mystic
        options: [mystic, nature, minimal]
      question:
        description: 'سوالِ دستی (خالی = قدیمی‌ترین سوالِ آماده از Notion). با مقدارِ دستی، ردیفِ Notion مصرف نمی‌شود.'
        required: false
        default: ''
      dry:
        description: 'بساز ولی نفرست و ردیفِ Notion را مصرف نکن (خروجی فقط artifact)'
        type: boolean
        required: false
        default: false
      fake:
        description: 'بدونِ فراخوانیِ مدل (متنِ ساختگی) — برای تستِ لایوت با صفر هزینه'
        type: boolean
        required: false
        default: false

# دو تپِ پشتِ سرهمِ /reel نباید دو ران هم‌زمان بسازند: ران دوم صف می‌شود تا ران اول
# ردیفِ خودش را «استفاده‌شده» کند، وگرنه هر دو همان یک سوال را برمی‌دارند.
concurrency:
  group: tarot-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: video/tarot-reel/package-lock.json

      # گاردِ سکرت‌ها: شکستِ سریع و صریح بهتر از رانی است که ده دقیقه رندر کند و سرِ
      # ارسال بمیرد. هر سکرت فقط در حالتی لازم است که واقعاً استفاده می‌شود.
      - name: گاردِ سکرت‌ها
        env:
          OR_KEY: ${{ secrets.TAROT_OPENROUTER_KEY }}
          NOTION: ${{ secrets.TAROT_NOTION_TOKEN }}
          BOT:    ${{ secrets.TAROT_BOT_TOKEN }}
          OWNER:  ${{ secrets.OWNER_TELEGRAM_ID }}
          FAKE:   ${{ inputs.fake }}
          DRY:    ${{ inputs.dry }}
          Q:      ${{ inputs.question }}
        run: |
          fail=0
          if [ "$FAKE" != "true" ] && [ -z "$OR_KEY" ]; then
            echo "::error::سکرتِ TAROT_OPENROUTER_KEY ست نشده. بدونِ آن فقط حالتِ fake ممکن است."; fail=1
          fi
          if [ "$FAKE" != "true" ] && [ -z "$Q" ] && [ -z "$NOTION" ]; then
            echo "::error::سکرتِ TAROT_NOTION_TOKEN ست نشده. یا آن را بساز، یا سوال را دستی در ورودیِ question بده."; fail=1
          fi
          if [ "$DRY" != "true" ] && { [ -z "$BOT" ] || [ -z "$OWNER" ]; }; then
            echo "::error::برای ارسالِ ویدیو هم TAROT_BOT_TOKEN لازم است هم OWNER_TELEGRAM_ID. یا آن‌ها را ست کن یا با dry=true اجرا کن."; fail=1
          fi
          [ "$fail" = "0" ] || exit 1

      # کتابخانه‌های سیستمیِ لازمِ Chrome headless روی ubuntu (رانرِ گیت‌هاب همه را ندارد).
      - name: کتابخانه‌های مرورگر
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2t64 libgbm1 || \
          sudo apt-get install -y -qq --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2 libgbm1

      - name: نصبِ وابستگی‌های رندر
        run: npm ci --prefix video/tarot-reel

      # ⚠️ ترتیب مهم است: `npm ci` کلِ node_modules را پاک می‌کند و Remotion مرورگرش را
      # دقیقاً همان‌جا (`node_modules/.remotion`) کش می‌کند. اگر restore قبل از نصب بیاید،
      # هر ران دوباره ~۱۵۰ مگابایت دانلود می‌کند.
      - name: کشِ مرورگرِ Remotion
        uses: actions/cache@v4
        with:
          path: video/tarot-reel/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('video/tarot-reel/package-lock.json') }}

      - name: آماده‌سازیِ مرورگر
        run: cd video/tarot-reel && npx remotion browser ensure

      # ورودی‌های کاربر **فقط** از env عبور می‌کنند و هیچ‌وقت داخلِ متنِ اسکریپت interpolate
      # نمی‌شوند (الگوی ops.yml): `question` متنِ آزاد است و تزریق به شل باید غیرممکن بماند.
      - name: تولیدِ فال و propsِ ویدیو
        id: gen
        env:
          OPENROUTER_API_KEY: ${{ secrets.TAROT_OPENROUTER_KEY }}
          # اسکریپت‌ها NOTION_TOKEN می‌خوانند؛ نامِ سکرت عمداً TAROT_NOTION_TOKEN است تا
          # با سکرتِ Notionِ daily-brief قاطی نشود.
          NOTION_TOKEN:       ${{ secrets.TAROT_NOTION_TOKEN }}
          TAROT_BOT_TOKEN:    ${{ secrets.TAROT_BOT_TOKEN }}
          OWNER_TELEGRAM_ID:  ${{ secrets.OWNER_TELEGRAM_ID }}
          IN_BG:   ${{ inputs.background }}
          IN_Q:    ${{ inputs.question }}
          IN_FAKE: ${{ inputs.fake }}
        run: |
          ARGS=(--out "$RUNNER_TEMP/props.json" --background "$IN_BG")
          [ -n "$IN_Q" ] && ARGS+=(--question "$IN_Q")
          [ "$IN_FAKE" = "true" ] && ARGS+=(--fake)
          node tools/tarot-video/generate.mjs "${ARGS[@]}"

      - name: رندرِ ویدیو
        if: steps.gen.outputs.skip != 'true'
        run: |
          cd video/tarot-reel
          npx remotion render src/index.js TarotReel out/reel.mp4 \
            --codec=h264 --props="$RUNNER_TEMP/props.json"

      - name: ارسال به تلگرام و علامت‌زدنِ ردیفِ Notion
        if: steps.gen.outputs.skip != 'true'
        env:
          TAROT_BOT_TOKEN:    ${{ secrets.TAROT_BOT_TOKEN }}
          OWNER_TELEGRAM_ID:  ${{ secrets.OWNER_TELEGRAM_ID }}
          NOTION_TOKEN:       ${{ secrets.TAROT_NOTION_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IN_DRY:  ${{ inputs.dry }}
        run: |
          ARGS=(--video video/tarot-reel/out/reel.mp4 --props "$RUNNER_TEMP/props.json")
          [ "$IN_DRY" = "true" ] && ARGS+=(--dry)
          node tools/tarot-video/deliver.mjs "${ARGS[@]}"

      # حتی در شکست هم props و ویدیو بالا می‌روند: بدونِ آن‌ها دیباگِ یک لایوتِ خراب یعنی
      # اجرای دوباره‌ی کلِ رانِ ده‌دقیقه‌ای.
      - name: خروجیِ خام
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarot-reel
          path: |
            ${{ runner.temp }}/props.json
            video/tarot-reel/out/reel.mp4
          retention-days: 30
          if-no-files-found: ignore

      - name: هشدارِ تلگرام در شکست
        if: failure()
        env:
          TOKEN:   ${{ secrets.TAROT_BOT_TOKEN }}
          OWNER:   ${{ secrets.OWNER_TELEGRAM_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then echo "ℹ️ توکن یا OWNER ست نشده، هشدار رد شد"; exit 0; fi
          MSG="🎬 ساختِ ویدیوی تاروت شکست خورد.

          لاگ: $RUN_URL"
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$id" --data-urlencode text="$MSG" >/dev/null || true
          done
