name: CI

on:
  push:
    branches: [main]
  pull_request:
  # اجرای دستی. لازم شد چون یک بار CI روی هدِ یک PR اصلاً تریگر نشد و تنها راهِ
  # دوباره‌زدنش یک کامیتِ خالی بود، که قاعده‌ی ریپو صریحاً ممنوعش می‌کند.
  workflow_dispatch:

# 🚫 پوشِ تازه روی یک PR، اجرای قبلیِ همان PR را لغو می‌کند.
#
# اندازه‌گیریِ ۲۱ روزِ واقعی: از ۱۷۳ اجرای CI روی PR، **۳۲تا (۱۸٪)** ظرفِ کمتر از ۵
# دقیقه با یک پوشِ تازه منسوخ شدند — یعنی تا آخر دویدند تا نتیجه‌شان دور ریخته شود.
#
# ⚠️ گروه عمداً `github.ref` است نه نامِ برنچ: روی PR این `refs/pull/<n>/merge` است،
# پس دو PR هم‌زمان هم‌دیگر را نمی‌کشند. و روی `push`/`schedule` هر ران گروهِ یکتای
# خودش را می‌گیرد (`github.run_id`)، چون آن‌جا لغو کردن یعنی نبودنِ چک روی کامیتی که
# به main رسیده — دقیقاً همان چیزی که نباید بشود.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # کدام ربات‌ها واقعاً باید چک شوند؟ (بند ۳ج ریشه — سهمیه‌ی Actions)
  # گیت‌هاب per **جاب** و رند به بالا حساب می‌کند، پس ماتریسِ ثابتِ ۶تایی یعنی یک تغییرِ
  # تک‌خطی در یک ربات، پنج دقیقه‌ی کامل برای رباتی خرج می‌کند که فایلش عوض نشده.
  # منطق و گاردش: tools/ci-changed-bots.mjs و tools/check-ci-changed.mjs (fail-open).
  changes:
    runs-on: ubuntu-latest
    outputs:
      bots:  ${{ steps.f.outputs.bots }}
      tabir: ${{ steps.f.outputs.tabir }}
    steps:
      # ⚠️ fetch-depth: 0 اجباری است. پیش‌فرضِ checkout یک کلونِ shallow (عمقِ ۱) است و
      # آن‌وقت `HEAD` هیچ جدِ مشترکی با main ندارد، پس `git merge-base` شکست می‌خورد و
      # فیلتر همیشه به fail-open می‌افتد — یعنی صفر صرفه‌جویی، **بی‌صدا**. این دقیقاً
      # همان اتفاقی بود که در اولین اجرای واقعی (کامیت 5883169) لاگ نشانش داد.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          # پیامِ کامیت برای تشخیصِ «این پوش مرجِ یک PR است» (بند ۳ج ریشه). از env
          # می‌رود نه interpolation مستقیم در shell — پیامِ کامیت ورودیِ کاربر است.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node tools/ci-changed-bots.mjs

      # گاردِ تنوعِ محتوای کانال. عمداً **همین‌جا** و نه در ماتریسِ ربات‌ها: مسیرِ
      # `marketing/` در IGNORED است (هیچ جابی لازم ندارد و نباید داشته باشد)، پس اگر این
      # چک در جابِ tarot می‌نشست، یک بافرِ تازه که فقط `marketing/` را عوض می‌کند هرگز
      # سنجیده نمی‌شد. جابِ `changes` روی هر push اجرا می‌شود و این چک نه نصبی می‌خواهد
      # نه شبکه‌ای، پس هزینه‌ی اضافه‌اش صفر جاب است (بند ۳ج ریشه).
      - name: Channel content diversity guard
        run: node tools/marketing/check-day-diversity.mjs

      # گاردِ زبانیِ کپشن: همان الگوهای `defects` خودِ ربات (langdata.<loc>.json) روی
      # متنِ کانال هم اجرا می‌شوند، به‌علاوه‌ی allowlistِ هشتگ. هم‌جا با گاردِ تنوع
      # نشست چون آن هم نصب و شبکه نمی‌خواهد و هزینه‌اش صفر جابِ اضافه است.
      - name: Channel caption language guard
        run: node tools/marketing/check-day-language.mjs

  check:
    needs: changes
    if: needs.changes.outputs.bots != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bot: ${{ fromJSON(needs.changes.outputs.bots) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bots/${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix bots/${{ matrix.bot }}

      - name: Syntax check
        run: node --check bots/${{ matrix.bot }}/index.js

      - name: Metis Gemini routing check
        if: matrix.bot == 'voice2text'
        run: node bots/voice2text/metis.test.mjs

      # قرارداد آنالیتیکس: کپی محلی voice2text باید با shared/analytics.js سینک بماند
      - name: Analytics contract check
        if: matrix.bot == 'voice2text'
        run: node tools/check-analytics-sync.mjs

      # قرارداد پشتیبانی: حساب و فرمت کد پیگیری در shared + کپی voice2text + پورت tabir یکی بماند
      - name: Support contract check
        if: matrix.bot == 'voice2text'
        run: node tools/check-support-sync.mjs

      # امضای initData مینی‌اپ: تنها دروازه‌ی هویت در مسیرِ وب. بیشترِ ادعاهایش منفی‌اند،
      # چون ضعیف‌شدنِ سهویِ این تابع هیچ خطا و هیچ لاگی نمی‌سازد.
      - name: Mini App initData signature check
        if: matrix.bot == 'tarot'
        run: node tools/check-initdata.mjs

      # شناسه‌های تعریف‌نشده: `node --check` فقط سینتکس را می‌بیند و boot smoke test فقط تا
      # گاردِ ENV می‌رود، پس یک import گمشده روی مسیرِ سرد (رسید، ریفاند، ادمین) تا لحظه‌ی
      # اجرا نامرئی می‌ماند. باگِ واقعی: decideReceipt که یک روز تأییدِ خودکارِ رسید را خواباند.
      - name: Undefined identifier check
        if: matrix.bot == 'voice2text'
        run: node tools/check-undefined.mjs

      # دیپلوی باید idempotent باشد: بدونِ تغییرِ واقعی هیچ رباتی ری‌استارت نشود (بند ۳ و ۲ج/۲).
      # قطعه‌ی shellِ ساختِ .env را از خودِ deploy.yml می‌خواند و دو دیپلویِ پیاپی را شبیه‌سازی می‌کند.
      - name: Deploy idempotency check
        if: matrix.bot == 'voice2text'
        run: node tools/check-deploy-env.mjs

      # فیلترِ مسیرِ خودِ CI: تصمیم می‌گیرد چه چیزی **اجرا نشود**، پس اشتباهش قرمز
      # نمی‌شود و فقط ساکت یک محافظ را برمی‌دارد. ادعای مرکزی: هر مسیرِ ناشناخته
      # همه را روشن کند (fail-open)، نه اینکه صرفه‌جویی حداکثر شود.
      - name: CI path filter check
        if: matrix.bot == 'voice2text'
        run: node tools/check-ci-changed.mjs

      # اجراکننده‌ی محلیِ همین چک‌ها (tools/ci-local.mjs). خطرش «قرمزِ کاذب» نیست،
      # «سبزِ کاذب» است: سشنی که محلی سبز می‌گیرد و پوش می‌کند، اگر نگاشتش از ci.yml
      # جدا شده باشد یک لایه اطمینانِ دروغ هم روی حلقه‌ی گران گذاشته. ادعاها رفتاری‌اند
      # (`--list` واقعاً اجرا می‌شود)، چون نسخه‌ی متنی‌شان در تستِ جهش زنده ماند.
      - name: Local CI runner check
        if: matrix.bot == 'voice2text'
        run: node tools/check-ci-local.mjs

      # دو صرفه‌جوییِ سهمیه که بی‌صدا می‌میرند: ردکردنِ ماتریس روی مرجِ PR، و لغوِ
      # اجرای منسوخِ PR. هر دو رفتاری سنجیده می‌شوند (بند ۳ج ریشه).
      - name: Actions budget guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-actions-budget.mjs

      # همان قاعده از زاویه‌ی دوم: چکِ بالا فقط پینگ‌پنگِ .env را می‌بیند. این یکی
      # بلوک‌های **یک‌باره** را می‌بیند — بلوکی که شرطش همیشه درست است و در هر مرج
      # رباتِ زنده را `pm2 stop` می‌کند (باگِ واقعیِ ۴ شهریور ۱۴۰۵ روی tarot).
      - name: Deploy one-time block guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-deploy-onetime.mjs

      # زاویه‌ی سوم روی همان مسیرِ دیپلوی: کلونِ سرور آینه‌ی فقط-خواندنیِ main است.
      # یک ورک‌فلویِ فقط-خواندنی با `git checkout <ref> -- <path>` درختِ کار را کثیف کرد
      # و از آن لحظه **هر** دیپلوی می‌شکست (۹ شهریور ۱۴۰۵) — خرابیِ ماندگار، بدونِ راهِ
      # پاک‌کردنِ دستی چون مالک SSH ندارد.
      - name: Server worktree cleanliness guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-server-worktree.mjs

      # ناظرِ سلامت: هر دو جهتِ خطا گران است. منفیِ کاذب یعنی رباتِ زنده خوابیده و
      # کسی خبر ندارد؛ مثبتِ کاذب یعنی هشدار هر ۵ دقیقه شلیک می‌کند و بی‌معنا می‌شود،
      # پس خرابیِ واقعی لای نویزش گم می‌شود (باگِ واقعیِ ۱۱ شهریور ۱۴۰۵: سه اپِ زبانیِ
      # هم‌cwd که با `.env` فارسی «ست‌شده» حساب می‌شدند).
      - name: Health watcher guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-health-watch.mjs

      - name: Dashboard HTTP health guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-dashboard-health.mjs

      # 🔁 تشخیصِ «چند کاربر در یک صفحه حلقه می‌زنند» (بند ۹ب-۴ ریشه). جانشینِ مکانیزمی
      # که در v3.78.0 حذف شد چون هدف‌گیری‌اش غلط بود و **هیچ خطایی نمی‌داد**: تنها
      # کاشفش یک انسان بود که اتفاقاً گیرنده‌ی پیامش شد. هر دو جهتِ خطای جانشین هم
      # بی‌صداست، پس هر ادعای منفی کنارش یک کنترلِ مثبت دارد (بند ۶ب-۲).
      # روی جابِ tarot چون better-sqlite3 آن‌جا نصب است.
      - name: User-stuck detector check
        if: matrix.bot == 'tarot'
        run: node tools/check-stuck-detect.mjs

      # زاویه‌ی چهارم روی دیپلوی: سکرتی که در `env:` تعریف شده ولی به `envs:` اضافه
      # نشده، روی سرور **خالی** می‌رسد و دیپلوی با کدِ صفر و یک پیامِ دوستانه ردش
      # می‌کند (باگِ واقعیِ ۱۱ شهریور ۱۴۰۵: شش سکرتِ زبان‌های تاروت).
      - name: Deploy secret forwarding guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-deploy-envs.mjs

      # زاویه‌ی پنجم: دو رانِ Deploy که روی هم بیفتند، دو `npm ci` هم‌زمان در همان
      # پوشه می‌زنند و چون `npm ci` اول `node_modules` را پاک می‌کند، یکی پوشه را از
      # زیرِ پای آن یکی می‌کشد (باگِ واقعیِ ۱۶ شهریور ۱۴۰۵: رباتِ زنده ۱۲ دقیقه خوابید).
      # این چک علاوه بر پیکربندی، خودِ خرابی را با یک پروسه‌ی واقعی بازتولید می‌کند.
      - name: Deploy concurrency guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-deploy-concurrency.mjs

      # ⏰ پنجره‌ی امنِ دیپلوی: هر دو جهتِ خطا گران است — گاردِ شل یعنی ری‌استارت وسطِ
      # اوج، گاردِ سفت یعنی رباتِ خوابیده که تا فردا فیکسش نمی‌رسد. هر ۲۴ ساعت و
      # پروتکلِ فوری با همان تابعی سنجیده می‌شوند که خودِ ورک‌فلو صدا می‌زند.
      - name: Deploy window guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-deploy-window.mjs

      # 💓 ضربانِ زنده بودن: تعریفِ «سالم» دیگر `pm2 online` نیست، سیگنالی است که خودِ
      # حلقه‌ی رویدادِ ربات تولید می‌کند. هشت باگِ دیپلویِ ثبت‌شده همه بی‌صدا بودند و
      # همه را یک انسان کشف کرد؛ این گارد همان شکاف را می‌بندد.
      - name: Liveness heartbeat guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-heartbeat.mjs

      # ابزارِ «ارسال به مالک»: شکستِ **نیمه‌کاره** بدترین حالتش است (بعضی فایل‌ها
      # رفته‌اند و بعضی نه). کپشنِ چندخطی و اعتبارسنجیِ قبل از اولین ارسال قفل‌اند.
      - name: Send-to-owner guard
        if: matrix.bot == 'voice2text'
        run: node tools/check-send-owner.mjs

      # قرارداد «مسیر ریز» (shared/journey.js + تحلیلِ داشبورد): پایداریِ کلیدِ صفحه، حذفِ ادمین،
      # و یکی‌بودنِ هر عدد با لیستِ کاربرانش. روی جابِ dashboard چون better-sqlite3 آن‌جا نصب است.
      - name: Journey contract check
        if: matrix.bot == 'dashboard'
        run: node tools/check-journey.mjs

      # پیشنهاددهنده‌ی فال: قانونِ نشکستنیِ «فالِ تازه‌گرفته دوباره پیشنهاد نمی‌شود»
      - name: Recommender check
        if: matrix.bot == 'tarot'
        run: node tools/check-reco.mjs

      # آزمایشِ `love_slot`: اعتبارش به یک بند است، اینکه کاربرِ قدیمی هرگز exposure نگیرد.
      # اگر آن گارد بشکند آزمایش قرمز نمی‌شود، فقط نتیجه‌ای می‌دهد که غلط است — پس رفتاری
      # سنجیده می‌شود، با همان variant() واقعی روی DBِ در-حافظه.
      - name: Love-slot experiment check
        if: matrix.bot == 'tarot'
        run: node tools/check-love-slot.mjs

      # تنها نقطه‌ی **نوشتنِ** Ops روی DBِ رباتِ زنده. یک اشتباه این‌جا به جدولِ پول و
      # کاربر می‌رسد، پس دامنه‌ی نوشتن رفتاری سنجیده می‌شود، نه با خواندنِ سورس.
      - name: Ops experiment-control check
        if: matrix.bot == 'tarot'
        run: node tools/check-ops-exp.mjs

      # مسیرِ خواندنِ متنِ خامِ کاربر وقتی ریپو public است: خروجی باید در لاگِ عمومی رمز
      # شده باشد. رفتاری سنجیده می‌شود (همان شلِ ورک‌فلو اجرا و بازگشایی می‌شود)، چون یک
      # نقلِ‌قولِ جابه‌جا در کدِ درون‌خطی کافی است تا متن خام در لاگ بیفتد.
      - name: Ops sealed-query check
        if: matrix.bot == 'tarot'
        run: node tools/check-ops-sealed.mjs

      # مسیرِ پول: کسر در لحظه‌ی انتخابِ اندازه. رفتاری است (روی DB واقعیِ در-حافظه اجرا
      # می‌شود)، چون هر مسیرِ لغو که جا بماند بی‌صدا پولِ کاربر را می‌خورد.
      - name: Pay-at-size money check
        if: matrix.bot == 'tarot'
        run: node tools/check-pay-at-size.mjs

      # گفتگوی پس از فال: دومین مسیرِ پولیِ ربات (هر سؤال یک الماس). مرکزی‌ترین ادعایش
      # «کسر قبل از هر فراخوانیِ پولی» است و بقیه‌اش ریفاندِ یک‌باره، جاروی یتیم، و
      # اینکه هیچ‌کدام از هشت حالتِ دکمه‌ی کهنه بن‌بست یا کسرِ ناخواسته نسازد.
      - name: Post-reading chat check
        if: matrix.bot == 'tarot'
        run: node tools/check-chat.mjs

      # و همان هسته در حالتِ `--fake`: کلِ خطِ لوله‌ی گفتگو (کانتکست، تاریخچه، سنجه‌ها)
      # بدونِ یک بایت شبکه اجرا می‌شود. درسِ `--dry`: مسیری که در CI اجرا نشود، اولین
      # شناسه‌ی جاافتاده‌اش را به کاربرِ واقعی نشان می‌دهد.
      - name: Chat lab smoke (offline)
        if: matrix.bot == 'tarot'
        run: node tools/chat-lab.mjs --fake --only P1

      # گیتِ عضویت تنها چیزی است که می‌تواند کاربر را بیرون نگه دارد: دامنه‌ی گشاد یعنی
      # کاربرِ فعلی هم بیرون می‌ماند، و fail-closed شدنِ چکِ عضویت یعنی افتادنِ ربات از
      # ادمینیِ کانال همه‌ی ثبت‌نام‌های جدید را بی‌صدا می‌خشکاند. هر دو مسیرِ سردند.
      - name: Join gate check
        if: matrix.bot == 'tarot'
        run: node tools/check-gate.mjs

      # انتخابگرِ زبانِ رباتِ واحد: اولین پیامِ هر کاربرِ تازه. ترتیب (قبل از گیت/هدیه)،
      # سقفِ Bot API برای نام/بیو، و محدودیتِ آزمایشِ فقط-فارسی به دیتابیسِ فارسی.
      - name: Language picker check
        if: matrix.bot == 'tarot'
        run: node tools/check-lang-picker.mjs

      # جوابِ قاطعِ فال‌های تصمیم‌محور: جوابِ مبهمِ مدل («شاید»، «هر دو») هرگز نباید
      # به‌عنوانِ جوابِ قاطع نمایش داده شود، و «نشونه» اجباری است (فیدبکِ کاربرِ واقعی).
      - name: Decisive verdict check
        if: matrix.bot == 'tarot'
        run: node tools/check-verdict.mjs

      # واحدِ مبلغِ رسید: رسیدِ بانکی ریال چاپ می‌کند و فاکتورِ ما تومان است. یک‌بار تبدیل به
      # عهده‌ی مدل بود و کاربری که هر سه پرداختش را یک صفر کمتر زد **خودکار تأیید شد**.
      # این چک همان سناریو را روی هر سه کپیِ ایجنت اجرا می‌کند و انتظار دارد تأیید نشود.
      - name: Receipt amount unit check
        if: matrix.bot == 'voice2text'
        run: node tools/check-receipt-amount.mjs

      # داشبوردِ اصلی (BI): سنجه‌ها روی یک دیتابیسِ **واقعیِ** موقت اجرا می‌شوند و عددِ
      # چاپ‌شده با لیستِ کاربرانِ پشتش مقایسه می‌شود. اگر این دو واگرا شوند هیچ خطایی
      # رخ نمی‌دهد — فقط مالک روی عددی تصمیم می‌گیرد که لیستش چیزِ دیگری است.
      # روی جابِ dashboard چون better-sqlite3 آن‌جا نصب است.
      - name: Master dashboard metrics check
        if: matrix.bot == 'dashboard'
        run: node tools/check-dash.mjs

      # کشِ گزارش نباید داده‌ی فیلترهای متفاوت را قاطی کند یا مسیر پشتیبانی را پشتِ
      # محاسبه‌ی تحلیلی نگه دارد؛ این‌ها خطاهای UX هستند و در تستِ عددهای BI دیده نمی‌شوند.
      - name: Dashboard cache and fast-path check
        if: matrix.bot == 'dashboard'
        run: node tools/check-dashboard-cache.mjs

      # کارتِ متریک‌های تکمیلیِ آزمایشِ مدلِ خوانش (رضایت/تأخیر/P90/برگشتِ فالِ دوم) در
      # صفحه‌ی «تست‌ها»: صفحه با یک دیتابیسِ واقعی رندر می‌شود و عددها با محاسبه‌ی
      # مستقل مقایسه می‌شوند، به‌علاوه‌ی کنترلِ مثبتِ allowlist (فقط reading_model_ds).
      - name: Reading model A/B dashboard metrics check
        if: matrix.bot == 'dashboard'
        run: node tools/check-reading-model-metrics.mjs

      # ستون‌های درآمدِ per variant (مجموع پرداخت، per exposure، lift، شانس برد) کنارِ
      # نرخ تبدیلِ **همه‌ی** آزمایش‌ها: رندرِ واقعی روی SQLiteِ موقت، با کنترلِ منفی برای
      # پرداختِ قبل از exposure، پرداختِ تأییدنشده و حسابِ تستی.
      - name: A/B revenue columns check
        if: matrix.bot == 'dashboard'
        run: node tools/check-exp-revenue.mjs

      # کدنسِ چسبندگی (دو لایه) و CPA per کانال: هر دو روی یک دیتابیسِ واقعیِ موقت با
      # الگوهای دست‌ساز و جوابِ از پیش حساب‌شده اجرا می‌شوند. این‌ها سنجه‌هایی‌اند که اگر
      # غلط باشند صفحه هنوز رندر می‌شود و فقط **تصمیم** غلط گرفته می‌شود — پس ادعاها
      # عددی و دقیق‌اند، نه ساختاری (از جمله ریاضیِ FIFOِ الماس‌های هدیه).
      - name: Stickiness cadence + CPA check
        if: matrix.bot == 'dashboard'
        run: node tools/check-engage-cpa.mjs

      # سودِ خالص: تنها عددی در داشبورد که مستقیم «کاسبی داریم یا نه» را جواب می‌دهد.
      # اگر غلط باشد صفحه هنوز رندر می‌شود و فقط تصمیم غلط گرفته می‌شود، پس ادعاها
      # عددی و از پیش حساب‌شده‌اند (دوباره‌شماریِ تخفیف، هدیه‌ی غیرنقدی، و پنجره‌ی
      # بی‌هزینه که سودِ خوش‌بینانه می‌سازد).
      - name: Net profit check
        if: matrix.bot == 'dashboard'
        run: node tools/check-profit.mjs

      # هزینه‌ی تبلیغ per **روز** ثبت می‌شود، نه یک عددِ ثابت. سه خرابیِ ممکنش هر سه
      # بی‌صدایند: «خالی» با «صفر» یکی شود (هر روزِ واردنشده صفر حساب شود)، میانگین
      # ساده به‌جای وزنی، یا فیلدِ تاریخ مقدارِ همان روز را برنگرداند.
      - name: Campaign cost per day check
        if: matrix.bot == 'dashboard'
        run: node tools/check-cpa-day.mjs

      # ستونِ `payments.original_amount` دو واحد دارد (تومانِ دوره‌ی قبل و الماسِ حالا).
      # جمع‌کردنشان هیچ خطایی نمی‌دهد و فقط یک عددِ بی‌معنیِ بزرگ می‌سازد — یک بار
      # ۶۳۵٬۹۵۹💎 نشان داد. این چک جدایی‌شان و خالی‌بودنِ بازه‌ی مبهم را می‌سنجد.
      - name: Coin unit boundary check
        if: matrix.bot == 'dashboard'
        run: node tools/check-coin-units.mjs

      # صفحه‌ی «کاربران»: باگِ واقعی‌اش یک throw داخلِ withDb بود که بی‌صدا قورت می‌شد
      # و صفحه را برای هر رباتی که جدولِ payments دارد کاملاً خالی می‌کرد — بدونِ هیچ
      # خطای دیده‌شده. node --check و check-undefined هیچ‌کدام شناسه‌ی برهنه‌ی تعریف‌نشده
      # را نمی‌بینند، پس این چک صفحه را واقعاً رندر می‌کند و کاربرانِ واقعی را می‌جوید.
      - name: Users page check
        if: matrix.bot == 'dashboard'
        run: node tools/check-users-page.mjs

      # اکشنِ اعتباریِ صف: داشبورد فقط برای رباتی enqueue کند که واقعاً اجرایش می‌کند.
      # sweepِ ربات‌ها بعد از if/else بی‌قید `markActionDone` می‌زند، پس اکشنی که هندلر
      # ندارد **بی‌صدا** done می‌شود: ردیفِ سرگردان «حل‌شده» می‌شود، در درآمد می‌ماند، و
      # کاربر هیچ اعتباری نمی‌گیرد. خرابیِ کاملاً خاموش روی مسیرِ پول.
      - name: Credit queue capability check
        if: matrix.bot == 'dashboard'
        run: node tools/check-credit-queue.mjs

      # مسیرِ پولِ voice2text (رباتِ زنده‌ی درآمدزا). ادعاها منطق را **اجرا** می‌کنند نه
      # اینکه شکلِ `if` را ببینند: شاخه‌ای که اعتبارِ رایگان می‌دهد، «شرط عوض شد» کافی
      # نیست، «شرطِ تازه درست است» لازم است.
      - name: voice2text money path check
        if: matrix.bot == 'voice2text'
        run: node tools/check-v2t-money.mjs

      # تفکیکِ «تاروت فارسی» از «تاروت زبان‌های دیگر» (بند ۲و/۷ ریشه). هر سه خرابیِ ممکنِ
      # این تفکیک بی‌صداست: همپوشانیِ الگوها یک دیتابیس را دوبار می‌شمارد، شکافِ الگوها
      # زبانِ تازه را ناپدید می‌کند، و واحدِ اشتباه «۲۵۰ استارز» را «۲۵۰ تومان» چاپ می‌کند.
      - name: Tarot dashboard split check
        if: matrix.bot == 'dashboard'
        run: node tools/check-dash-split.mjs

      # ریلِ پرداخت: SQL واقعیِ index.js را روی DB موقت اجرا می‌کند (اتمیک بودنِ مبلغ،
      # ریاضیِ تخفیف، و قفل‌نشدنِ کد با فاکتورِ رهاشده). روی جابِ dashboard چون
      # better-sqlite3 آن‌جا نصب است.
      - name: Payment rail check
        if: matrix.bot == 'dashboard'
        run: node tools/check-payments.mjs

      # لایه‌ی دومِ دفاعِ پرداخت: کاربرِ «مشکوک» (بندِ CLAUDE.md ربات). suspectTrigger
      # را از سورس می‌بُرد و اجرا می‌کند، SQLِ نگه‌داری/آزادسازیِ برچسب را روی SQLite
      # واقعی می‌سنجد، و ساختاراً مطمئن می‌شود گیتِ processReceipt هر سه تصمیمِ خودکار
      # (approve/underpaid/reject) را برای کاربرِ مشکوک می‌بندد نه فقط approve.
      - name: Suspicious-user payment gate check
        if: matrix.bot == 'dashboard'
        run: node tools/check-suspect.mjs

      # اقتصادِ سکه + نسخه‌ی دومِ لحن (tarot): هر دو فعلاً فقط روی اکانتِ ادمین‌اند، پس این
      # چک قبل از هر چیز «نشتی به کاربرِ واقعی» را می‌گیرد؛ بعد ریاضیِ سکه (هر کارت = ۱ سکه)،
      # نردبانِ بسته‌ها، سالم‌ماندنِ چیدمان‌های قدیمی، و قانونِ «جوابِ مبهم نمایش داده نمی‌شود».
      - name: Coin economy and reading tone check
        if: matrix.bot == 'tarot'
        run: node tools/check-coins.mjs

      # جدولِ دانشِ کارت: پوششِ ۷۸ کارت، فارسیِ خالص (هیچ انگلیسی‌ای وارد پرامپت نشود) و
      # سقفِ اندازه (این متن در **هر فال** به پرامپت اضافه می‌شود). اگر فایل هنوز ساخته نشده
      # باشد سبز رد می‌شود، چون فیچر fail-safe است.
      - name: Card knowledge check
        if: matrix.bot == 'tarot'
        run: node tools/check-card-knowledge.mjs

      # سیم‌کشیِ دیتای per زبان: هر فایلِ دیتای زبان‌دار باید با `${LOCALE}` import شود و
      # نبودنش ربات را نشکند. باگی که این را لازم کرد: `hafez.js` و `quiz.js` بی‌قید
      # import می‌شدند، پس هر زبانی دیتای فارسی می‌گرفت — استثنایی که در CLAUDE.md
      # مستند شده بود ولی اصلاً پیاده نشده بود. چک هر دو سمت را می‌بندد.
      - name: Locale data wiring check
        if: matrix.bot == 'tarot'
        run: node tools/check-locale-data.mjs

      # انضباطِ منبع در اسنادِ تحقیق. باگی که این را لازم کرد: یک ادعای تصمیم‌ساز با
      # برچسبِ «طبق صفحه‌ی گوگل» وارد سند شد در حالی که آن صفحه هرگز خوانده نشده بود
      # (پراکسی می‌بنددش) و ادعا هم غلط بود. بعد به پنج جای دیگر تکثیر شد.
      - name: Research claim discipline
        if: matrix.bot == 'tarot'
        run: node tools/check-claims.mjs

      # گنجینه‌ی کارتِ روز: هم **منطقِ انتخاب** اجرا می‌شود (قاعده‌ی عدمِ تکرار بر حسبِ
      # «بارِ فال‌گیری» نه «روز»، و انتخابِ نسخه از تعدادِ واقعیِ همان خانه)، هم خودِ
      # محتوا سنجیده می‌شود. با ۹۳۶ متن در راه، یک خانه‌ی جاافتاده یا یک «—» بدونِ این
      # چک تا لحظه‌ی رسیدنِ کاربرِ واقعی ساکت می‌ماند.
      # کارت شانس: منطق روی یک SQLite واقعی **اجرا** می‌شود — از جمله همان سناریوی
      # خرابی که ممیزی پیدا کرد (رها کردنِ دستِ نیمه‌کاره) و ریاضیِ جایزه.
      - name: Lucky card check
        if: matrix.bot == 'tarot'
        run: node tools/check-lucky.mjs

      - name: Ganjineh (daily card) check
        if: matrix.bot == 'tarot'
        run: node tools/check-ganjineh.mjs

      # مهاجرتِ تومان ⟶ الماس: یک‌بار روی دیتابیسِ ربات زنده اجرا می‌شود و مستقیم به
      # موجودیِ کاربران دست می‌زند، پس منطقش قبل از اجرا اثبات می‌شود نه بعدش (بند ۹ ریشه).
      - name: Coin migration check
        if: matrix.bot == 'tarot'
        run: node tools/check-coin-migration.mjs

      # پیامِ اطلاع‌رسانیِ آپدیت: یک بار به همه‌ی کاربران می‌رود و برگشت‌پذیر نیست.
      - name: Announcement check
        if: matrix.bot == 'tarot'
        run: node tools/check-announce.mjs

      # مهاجرتِ «الماسِ بومی»: منطق روی یک SQLite واقعی اجرا می‌شود (موجودی، قیمتِ فال،
      # اعتبارِ پرداختِ معلق، اقدامِ در صف، و propهای رویداد) + گاردِ مسیرهای پرداختِ کهنه.
      - name: Coins-native migration check
        if: matrix.bot == 'tarot'
        run: node tools/check-coins-native.mjs

      # واحدِ پول در پیام‌های ادمین و پنل. `original_amount` برای پرداختِ بسته اعتبارِ
      # داخلی است نه تومان؛ چاپش با برچسبِ تومان باگِ واقعیِ رسیدِ #۱۵۳ بود.
      - name: Admin coin unit check
        if: matrix.bot == 'tarot'
        run: |
          cd bots/dashboard && npm ci --silent && cd ../..
          node tools/check-admin-coins.mjs
          node tools/check-marketing-scope.mjs

      - name: LLM cost rule check
        if: matrix.bot == 'tarot'
        run: node tools/check-llm-cost.mjs

      - name: Payment row lifetime check
        if: matrix.bot == 'tarot'
        run: node tools/check-pay-rows.mjs

      # یک فلو و یک سبک در هر سه زبانِ ریلِ استارز (مرجع: ru، که مالک تستش کرده)
      - name: Stars payment parity check
        if: matrix.bot == 'tarot'
        run: node tools/check-pay-parity.mjs

      # ریفاندِ استارز: ترتیبِ «اول تلگرام، بعد دفتر» + /paysupport در هر چهار زبان
      - name: Stars refund and paysupport check
        if: matrix.bot == 'tarot'
        run: node tools/check-refund.mjs

      - name: Fallback chain check
        if: matrix.bot == 'tarot'
        run: node tools/check-fallbacks.mjs

      - name: Repair arena check
        if: matrix.bot == 'tarot'
        run: node tools/check-repair-arena.mjs

      # 🚦 تحویلِ آپدیت با صفِ per کاربر. رفتاری است نه متنی: خودِ حلقه‌ی telegraf را با
      # ترنسپورتِ قلابی می‌دواند و ترتیبِ واقعیِ اجرا را می‌سنجد، به‌علاوه‌ی سناریوی پولی
      # روی SQLite (رسیدی که وسطِ بررسی لغو شود). سه کنترلِ مثبت دارد که با پرچمِ خاموش
      # قرمز می‌شوند، پس «سبز بودن» یعنی چیزی هست، نه اینکه چیزی را نمی‌بیند (بند ۶ب-۲).
      - name: Update dispatch check
        if: matrix.bot == 'tarot'
        run: node tools/check-dispatch.mjs

      # 🔮 بازیابیِ فال‌های نیمه‌تمام: پول و پیامِ برگشت‌ناپذیر در کار است، پس چک ابزار را
      # روی SQLite واقعی با fetch استابی می‌دواند و می‌بیند دقیقاً چه کسی چه چیزی گرفت —
      # از جمله «اول پول بعد پیام» و اینکه اجرای دوباره کسی را دوبار پیام/ریفاند نکند.
      - name: Stuck reading recovery check
        if: matrix.bot == 'tarot'
        run: node tools/check-recover-readings.mjs

      # حسابداریِ مصرفِ مدل روی همان مسیری نشسته که فالِ کاربرِ پولی از آن رد می‌شود، پس
      # شرطِ صریحِ مالک «هیچ تأثیری روی کیفیت فال نداشته باشد» این‌جا **اجرا** می‌شود:
      # بدنه‌ی ریکوئست بجز پرچمِ حسابداری بیت‌به‌بیت همان قبلی است، و سینکِ ترکیده هم
      # نمی‌تواند متنِ فال را بشکند. صفر شبکه (fetch استاب می‌شود).
      - name: LLM usage accounting check
        if: matrix.bot == 'tarot'
        run: node tools/check-llm-usage.mjs

      - name: Reading v4 structure check
        if: matrix.bot == 'tarot'
        run: node tools/check-reading-v4.mjs

      # ⏭ برشِ ریترای وقتی پیامِ «در حال تفسیر» هنوز نرسیده: مکانیزمِ عمومیِ عبور از
      # مدل‌های هم‌نام در برنامه‌ی retry، مستقل از هر آزمایشی که آن را صدا بزند.
      - name: Retry-cut deadline check
        if: matrix.bot == 'tarot'
        run: node tools/check-retry-cut.mjs

      # ⛓️ فالِ پول‌داده هرگز پشتِ یک فراخوانیِ آویزان گیر نمی‌کند (تیکتِ #TRT-1686489477):
      # fetchی که abort را نادیده می‌گیرد، سقفِ llmInflight، و ناظرِ بیرونیِ health-watch.
      - name: LLM hang guard check
        if: matrix.bot == 'tarot'
        run: node tools/check-llm-hang.mjs

      # 🧾 ایجنتِ رسید هرگز بی‌صدا نمی‌میرد (v3.120.0): زنجیره‌ی فالبکِ جمنای، اعتبارسنجیِ
      # خروجی با کد و پرسیدنِ دوباره، ددلاینِ ۶۰ثانیه‌ای مستقل از abort، و «رسید تکراری» روی
      # همه‌ی پیام‌های اعتباردیده با پس‌گرفتنِ بی‌صدا و بدونِ تگِ بی‌اعتماد (SQLite واقعی).
      - name: Receipt agent resilience check
        if: matrix.bot == 'tarot'
        run: node tools/check-receipt-agent.mjs

      # 🧪 آزمایشِ ۵۰/۵۰ مدلِ خوانش (دیپ‌سیکِ برش‌خورده در برابرِ luna): سیدِ آزمایش،
      # وضعیتِ درست، فیلترِ متقارنِ فالِ صوتی، و چرخه‌ی عمرِ readingArm/loadingShown
      # (پاک‌سازیِ تک‌مصرف، ms هرگز منفی نمی‌شود) روی SQLite واقعی اجرا می‌شوند.
      - name: Reading model A/B check
        if: matrix.bot == 'tarot'
        run: node tools/check-reading-model-ab.mjs

      # بازیابیِ فالِ پرداخت‌شده‌ی نیمه‌تحویل (#215): سشن در سیزده نقطه پاک می‌شود و
      # `/start` گارد ندارد، پس تنها اشاره‌گر به یک فالِ پول‌داده می‌توانست دور ریخته شود.
      # ادعای مرکزی: پاک‌شدنِ سشن هرگز دسترسی به آن فال را از بین نبرد.
      - name: Paid reading resume check
        if: matrix.bot == 'tarot'
        run: node tools/check-reading-resume.mjs

      # 🛟 افشای فالِ پول‌داده در برابرِ قطعیِ شبکه (v3.114.0، تیکتِ #TRT-1902690343):
      # شکستِ ارسال کارت را جا نمی‌اندازد، خطای وسطِ افشا دکمه‌ی ادامه می‌دهد، `/start`
      # سشنِ افشا را از DB بازسازی می‌کند، و «💬 پشتیبانی» هرگز پشتِ گارد نمی‌ماند.
      - name: Reveal recovery check
        if: matrix.bot == 'tarot'
        run: node tools/check-reveal-recovery.mjs

      # 🧹 /resetprofile: تنها مسیری که ادمین دیتای **کاربرِ دیگری** را پاک می‌کند. دو
      # خرابیِ بی‌صدا دارد که تستِ دستی نمی‌بیندشان: گشادشدنِ دامنه تا موجودی/پرداخت/دعوت
      # (بند ۹: پول)، و جاافتادنِ گاردِ ادمین روی دکمه‌ی تأیید که سال‌ها در چت زنده می‌ماند.
      - name: Admin profile reset check
        if: matrix.bot == 'tarot'
        run: node tools/check-reset-profile.mjs

      # 💳 کارت‌های پرداخت (v3.122.0): شماره‌ی هر فاکتور از کارتِ خودش، دکمه‌ی کپی از همان
      # پرداخت، رسید فقط به ادمینِ همان کارت با دکمه و کپیِ بی‌دکمه به مالک، و سیدِ یک‌باره.
      # هر سه خرابی بی‌صدا و روی مسیرِ پول‌اند؛ کدِ واقعی روی SQLite اجرا می‌شود.
      - name: Payment cards check
        if: matrix.bot == 'tarot'
        run: node tools/check-cards.mjs

      # ⭐ ریلِ پرداختِ استارز (زبان‌های غیرفارسی). سه خرابیِ بی‌صدا که تستِ دودِ boot به
      # آن‌ها نمی‌رسد چون مسیرِ سردند: قراردادِ فاکتورِ Bot API (currency/provider_token/
      # یک آیتم بودنِ prices و اینکه amount خودِ تعدادِ استارز است نه سِنت)، شکستنِ نسبتِ
      # ۱×/۲×/۵×ِ نردبانِ قیمت، و پایین رفتنِ بسته‌ی پایه از حداقلِ خریدِ ۵۰ استارزِ تلگرام.
      - name: Stars payment rail check
        if: matrix.bot == 'tarot'
        run: node tools/check-starspay.mjs

      # 🌍 شکلِ locale (بند ۲و: یک کدبیس، N ربات). یک کلیدِ جاافتاده در زبانِ تازه در
      # زمانِ اجرا `undefined` یا «is not a function» می‌دهد، آن‌هم روی مسیرهای سرد که
      # ممکن است هفته‌ها ساکت بمانند. این چک فقط **شکل** را قفل می‌کند، نه کیفیتِ ترجمه.
      - name: Locale shape check
        if: matrix.bot == 'tarot'
        run: node tools/check-locale-shape.mjs

      # 🌍 هیچ فارسی‌ای به کاربرِ غیرفارسی نمی‌رسد. **رفتاری**، چون باگی که این چک از
      # دلش درآمد (۱۴۰۵/۰۶/۱۱، منوی فالِ رباتِ روسی با دکمه‌های فارسی) با اسکنِ متنیِ
      # سورس گرفته نمی‌شد: هر ۳۶ ترجمه سرِ جایشان بودند، فقط `L.buttons.topic` از
      # `spreadName()` رد نمی‌شد. یعنی «ترجمه شده» با «وصل شده» یکی نیست.
      # همین‌جا قیمتِ استارز هم سنجیده می‌شود: عددِ روی دکمه باید همان عددی باشد که
      # فاکتور کسر می‌کند (منو «۳۰٬۰۰۰ ستاره» می‌گفت و فاکتور ۱۰۰ ستاره می‌گرفت).
      - name: No Persian leak check
        if: matrix.bot == 'tarot'
        run: node tools/check-no-persian.mjs

      # 🌍 دادهٔ زبانیِ ساختاری (نامِ کارت/جایگاه/چیدمان، کلیدواژه، پرامپتِ تعمیر). یک
      # ردیفِ جامانده هیچ خطایی نمی‌دهد و بی‌صدا به فارسی برمی‌گردد: کاربرِ آن زبان وسطِ
      # فالِ پولی نامِ فارسی می‌بیند، و سنجه‌ی «لنگر» آزمایشگاه برای آن زبان بی‌معنی می‌شود.
      - name: Language data check
        if: matrix.bot == 'tarot'
        run: node tools/check-langdata.mjs

      # 🚻 نشتِ جنسیت/لحنِ رسمی در **متن‌های دستیِ خودمان**. الگوهای `defects` از v3.4x
      # روی خروجیِ **مدل** اجرا می‌شدند ولی هیچ‌وقت روی رشته‌های locale؛ اولین اجرا پنج
      # نقضِ واقعی پیدا کرد. هر پنج خاموش بودند، و دقیقاً به همین دلیل بی‌صدا ماندند.
      - name: Locale gender check
        if: matrix.bot == 'tarot'
        run: node tools/check-locale-gender.mjs

      # 🌍 زمینه‌ی زبانِ **هر کاربر** (`locale-ctx.js`). از رباتِ چندزبانه به بعد یک
      # پروسه هم‌زمان به چند زبان جواب می‌دهد و هر خرابیِ این مکانیزم بی‌صداست: کاربر
      # متنِ زبانِ دیگری می‌گیرد، هیچ استثنایی پرتاب نمی‌شود و هیچ لاگی قرمز نمی‌شود.
      # چک **رفتاری** است (زمینه‌های موازی را واقعاً می‌دواند) به‌علاوه‌ی ادعاهای
      # ساختاری که ثابت می‌کنند محصول هم واقعاً از آن استفاده می‌کند — مهم‌ترینشان
      # اینکه هیچ `bot.hears` ای برچسبِ تک‌زبانه ثبت نکند.
      - name: Locale context check
        if: matrix.bot == 'tarot'
        run: node tools/check-locale-ctx.mjs

      # 🌍 بارگذاریِ `.env` باید **قبل از** هر ماژولی باشد که سرِ بارگذاری از env
      # می‌خواند. باگِ واقعی: importهای ایستای ESM قبل از بدنه اجرا می‌شوند، پس
      # `dotenv.config()` در بدنه‌ی index.js دیر بود و رباتِ غیرفارسی بی‌صدا به fa
      # برمی‌گشت (جدولِ دانشِ فارسی، langdata خالی یعنی صفر گاردِ زبانی، گنجینه‌ی
      # فارسی). چک **رفتاری** است: یک پروسه‌ی واقعی با همان محیطِ pm2، به‌علاوه‌ی یک
      # کنترلِ منفی که ثابت می‌کند بدونِ فیکس واقعاً قرمز می‌شود.
      - name: Env boot order check
        if: matrix.bot == 'tarot'
        run: node tools/check-env-boot.mjs

      # 🎯 فهرستِ معیارهای کیفیتِ آزمایشگاه. دو چیز را قفل می‌کند: (۱) هیچ مسیرِ داوریِ
      # **خودکار** برنگردد — ارزیابی کارِ سشن است نه یک مدلِ دیگر روی کلیدِ محصول
      # (تصمیمِ صریحِ مالک)؛ (۲) راستی‌آزماییِ شاهد سالم بماند، وگرنه نقلِ قولی که در
      # متن نیست می‌تواند نمره بسازد.
      - name: Reading rubric check
        if: matrix.bot == 'tarot'
        run: node tools/check-rubric.mjs

      # 🙈 نمره‌دهیِ **کور**. کلِ ارزشِ آن ابزار یک ادعای منفی است («هیچ ردی از بازو در
      # متنی که داور می‌خواند نیست»)، و طبقِ بند ۶ب-۲ ریشه یک ادعای منفیِ سبز دو معنیِ
      # متفاوت دارد. پس هر ادعا کنترلِ مثبتِ خودش را دارد و پنج جهش قرمزش می‌کنند.
      # بدونِ این ردیف، خودِ گارد در CI اجرا نمی‌شد و یک گاردِ اجرانشده هیچ چیز را
      # نمی‌پاید.
      - name: Blind scoring check
        if: matrix.bot == 'tarot'
        run: node tools/check-blind.mjs

      # ⚙️ منوی تنظیماتِ کاربر: «ریست حافظه» نباید چیزی پاک کند (حذفِ readings پاداشِ دعوت
      # را دوباره واریز می‌کند)، خطِ آب باید فقط کانتکستِ مدل را ببُرد نه منطقِ پاداش، و
      # ردیفِ یادآوری‌ها تا پایانِ آزمایشِ night_reminder نباید دیده شود.
      - name: User settings menu check
        if: matrix.bot == 'tarot'
        run: node tools/check-settings.mjs

      # ⌨️ نسخه‌ی کیبوردِ ماندگار: کیبوردِ reply روی گوشیِ کاربر ذخیره است و هیچ متدی از
      # سمتِ سرور تازه‌اش نمی‌کند، پس یک دکمه‌ی تازه می‌تواند هفته‌ها به کاربرِ فعلی نرسد
      # **بدونِ هیچ خطایی**. این چک اثرانگشتِ شکلِ کیبورد را پین می‌کند (فراموش‌کردنِ بامپ
      # = قرمز) و مطمئن می‌شود حاملِ تازه‌سازی دیتای جرنی را آلوده نمی‌کند.
      - name: Keyboard revision check
        if: matrix.bot == 'tarot'
        run: node tools/check-kb-rev.mjs

      # راهِ خروج از فلوی پرداخت: خودِ حلقه‌ی تیکتِ #TRT-8976388520 اجرا می‌شود — اول
      # ثابت می‌کند رفتارِ قدیم بعد از پنج بار انصراف هنوز قفل بود، بعد اینکه یک تپ
      # قفل را می‌شکند. به‌علاوه‌ی مسیرِ پول: رسیدِ در انتظار و پرداختِ تأییدشده لغو نشوند.
      - name: Payment exit (no dead end) check
        if: matrix.bot == 'tarot'
        run: node tools/check-pay-exit.mjs

      # 🔒 گارد مرکزی: هر callback بیرون از allowlistِ قدمِ فعلی باید پیش از هندلر
      # متوقف شود. این همان تکرارِ دقیقِ تیکتِ `pkg:` وسطِ نوشتن سؤال است.
      - name: Central flow guard check
        if: matrix.bot == 'tarot'
        run: node tools/check-central-flow-guard.mjs

      # 🧭 پشته‌ی بازگشت: لایه‌ی ۱ «بازگشت به منوی اصلی» و لایه‌ی ۲+ «بازگشت»ِ یک‌قدمی.
      # رفتاری است چون «کدام صفحه لایه‌ی ۱ است» ایستا نیست (ذخایر از کیبورد لایه‌ی ۱ است و
      # از صفحه‌ی کم‌موجودی لایه‌ی ۲)، پس همان توابع روی سشنِ واقعی اجرا می‌شوند.
      - name: Nav stack (back button) check
        if: matrix.bot == 'tarot'
        run: node tools/check-nav-stack.mjs

      # منوی فال + کارت شانس: قرارداد منو (پین اول، «همه فال‌ها» آخر)، ماتریسِ
      # موضوع×اندازه، و مهم‌تر از همه **ریاضیِ جایزه‌ی کارت شانس** که باید امیدِ
      # ریاضیِ دقیقاً ۱ سکه در روز بدهد — تنها چیزی که هزینه‌ی آن فیچر را مهار می‌کند.
      - name: UX menu + lucky card check
        if: matrix.bot == 'tarot'
        run: node tools/check-ux-menu.mjs

      # وضعیتِ دعوت‌ها و هدیه‌ها: عددها روی SQLite واقعی اجرا می‌شوند. مهم‌ترین ادعا این
      # است که «چقدر گرفتی» از دفترِ رویداد بیاید نه از «تعداد × پاداشِ امروز» — مبلغِ
      # پاداش در تاریخِ ربات عوض شده و آن فرمول به کاربرانِ قدیمی عددِ غلط می‌داد.
      - name: Invite status check
        if: matrix.bot == 'tarot'
        run: node tools/check-invite-stats.mjs

      # کاهشِ پاداشِ دعوت (۱۰ ⟵ ۵) که **فقط فارسی** است و grandfathering دارد: دعوتی که
      # پیش از مرزِ دیپلوی ثبت شده باید همان ۱۰ وعده‌داده‌شده را بگیرد. هم استثنای زبانی
      # سنجیده می‌شود، هم مرزِ `migrations` روی SQLite واقعی، هم عددی که به کاربر می‌رسد.
      - name: Referral bonus check
        if: matrix.bot == 'tarot'
        run: node tools/check-referral-bonus.mjs

      # هدیه‌ی خوش‌آمدِ ۳ الماسی و صفحه‌ی تک‌گزینه‌ایِ آنبوردینگ، که به هم وابسته‌اند:
      # هدیه باید دقیقاً کفافِ همان یک گزینه را بدهد، وگرنه اولین برخوردِ کاربرِ تازه با
      # محصول یا بن‌بست می‌شود یا متنِ صفحه («موجودیت کافیه») به او دروغ می‌گوید.
      - name: Onboarding first spread check
        if: matrix.bot == 'tarot'
        run: node tools/check-onboard-first.mjs

      # چرخه‌ی عمرِ فاکتورِ کارت‌به‌کارت: یادآوریِ ۱ساعته + انقضای ۲۴ساعته، فقط ریلِ کارت.
      - name: Invoice lifecycle check
        if: matrix.bot == 'tarot'
        run: node tools/check-invoice-lifecycle.mjs

      # آزمایشِ نمایشِ بسته‌ها (pack_reveal_v1): قراردادِ control، گاردِ ریلِ استارز.
      - name: Pack reveal experiment check
        if: matrix.bot == 'tarot'
        run: node tools/check-pack-reveal.mjs

      # آزمایشِ نردبانِ قیمت (price_ladder_p1/p2): سلامتِ نردبان در هر سه بازو،
      # تک‌متغیره بودنِ هر پله، و اینکه عددِ دکمه با عددِ فاکتور و پیامِ ادمین یکی بماند.
      - name: Price ladder experiment check
        if: matrix.bot == 'tarot'
        run: node tools/check-price-ladder.mjs

      # سوییچِ استارز per-فاکتور (فقط فارسی، فقط-ادمین): amount هرگز دست‌خورده نمی‌شود.
      - name: Stars toggle check
        if: matrix.bot == 'tarot'
        run: node tools/check-stars-toggle.mjs

      # صفحه‌ی فاکتور (v3.81.0): عنوانِ داینامیک، تطابقِ حروفِ مبلغ با خودِ عدد، و
      # اینکه پاک‌شدنِ صفحه‌ی بسته‌ها فقط روی ریلِ کارت بیفتد نه روی استارز.
      - name: Invoice page check
        if: matrix.bot == 'tarot'
        run: node tools/check-invoice-page.mjs

      # یادآوریِ شبانه‌ی A/B (شرطِ هر شاخه، ترتیبِ مهر و رویداد، دکمه‌ی انصراف)، به‌علاوه‌ی
      # دو اصلاحِ هم‌خانواده: دکمه‌ی دعوت که مستقیم مخاطبین را باز نکند، و خبرِ پاداشِ رفرال.
      - name: Night reminder A/B + invite + referral reward check
        if: matrix.bot == 'tarot'
        run: node tools/check-night-reminder.mjs

      # آزمایشگاهِ خوانش در حالتِ fake: **کلِ** مسیر واقعاً اجرا می‌شود — ساختِ پرامپت،
      # callbackِ پذیرش، رندرِ متنِ نهایی، همه‌ی سنجه‌ها و گزارش — فقط پاسخِ مدل از یک
      # استابِ محلی می‌آید. صفر شبکه، صفر هزینه.
      # چرا جای `--dry` را گرفت: dry قبل از validate برمی‌گردد، پس آن مسیر را لمس
      # نمی‌کند. یک importِ جامانده (`headlineOk`) دقیقاً همان‌جا پنهان ماند، در
      # try/catch به‌عنوان «خطای LLM» بلعیده شد، و یک دورِ کاملِ ۹ فالی را با ۴۵
      # ریکوئستِ هدررفته سوزاند. `--fake` همان باگ را در دو ثانیه قرمز می‌کند.
      - name: Reading lab (fake, full pipeline)
        if: matrix.bot == 'tarot'
        run: node tools/reading-lab.mjs --fake

      # تستِ واحدِ خودِ سنجه‌ها با ورودیِ ساختگی. حالتِ fake بالا سنجه‌ها را روی خروجیِ
      # سالم اجرا می‌کند؛ این یکی حالتِ **خراب** را هم می‌سنجد — یک کرشِ واقعی
      # (`labels[i]` تعریف‌نشده وقتی متنِ کارت خطِ جدید داشت) کلِ اجرای ۹ فالی را کشت.
      # این چک برای هر سنجه دو حالت دارد: یکی که باید قرمز کند و یکی که نباید.
      - name: Reading lab checks
        if: matrix.bot == 'tarot'
        run: node tools/check-reading-lab.mjs

      # ویدیوی ریلِ تاروت: خروجیِ این فیچر یک ویدیوست و هیچ چکِ متعارفی نمی‌بیندش. مهم‌ترین
      # ادعا هندسی است — استیکرِ سوالِ اینستاگرام یک مستطیلِ ثابت وسطِ قاب را می‌پوشاند و هر
      # کارتی که زیرش برود برای بیننده وجود ندارد. این‌جا کلِ برنامه‌ی صحنه‌ها فریم‌به‌فریم
      # سنجیده می‌شود، به‌علاوه سقفِ ۵۸ ثانیه، بی‌اتلافیِ صفحه‌بندی و قفلِ پرچمِ دستورِ ادمین.
      # هیچ نصبی از video/tarot-reel لازم نیست: ماژول‌های هندسه و زمان خالص‌اند (خودِ چک
      # اول همین خلوص را می‌سنجد، چون بقیه‌ی ادعاها بدونِ آن اصلاً اجرا نمی‌شوند).
      - name: Tarot video pipeline check
        if: matrix.bot == 'tarot'
        run: node tools/check-tarot-video.mjs

      # خطِ لوله‌ی کامل بدونِ شبکه و بدونِ هزینه: حالتِ fake همان مسیرِ واقعیِ ساختِ فال و
      # ساختِ props را می‌رود و فقط پاسخِ مدل از یک استابِ محلی می‌آید. یک importِ جامانده
      # روی این مسیر تا لحظه‌ی dispatchِ واقعی ساکت می‌ماند (همان درسِ reading-lab --fake).
      - name: Tarot video props (fake, full pipeline)
        if: matrix.bot == 'tarot'
        run: node tools/tarot-video/generate.mjs --fake --out "$RUNNER_TEMP/props.json"

      # پادکستِ روزانه: کلِ ارزشِ این ربات روی مسیرهایی است که CI معمولاً نمی‌بیند — زمان‌بندیِ
      # صبحگاهی، چانک‌بندیِ متنِ بلند برای TTS، و گاردِ «روزی یک قسمت» که فقط موقعِ ری‌استارت
      # معنی پیدا می‌کند. هر سه در توابعِ خالص‌اند و این‌جا واقعاً اجرا می‌شوند (بدونِ شبکه).
      - name: Daily brief check
        if: matrix.bot == 'daily-brief'
        run: node tools/check-daily-brief.mjs

      # اجرای واقعی تا گاردِ ENV: همه‌ی import ها (از جمله shared/) resolve می‌شوند و باید
      # با کد ۱ و پیام «خالی است» خارج شود — بدون side effect (گارد قبل از ساخت DB است).
      - name: Boot smoke test
        run: |
          cd bots/${{ matrix.bot }}
          set +e
          OUT=$(BOT_TOKEN= OPENROUTER_API_KEY= node index.js 2>&1); CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" = "1" ] || { echo "❌ انتظار exit=1 بود، شد $CODE"; exit 1; }
          echo "$OUT" | grep -q "خالی است" || { echo "❌ پیام گارد ENV دیده نشد"; exit 1; }

  # tabir-khab پایتونی است (استثنای مونوریپو) — جدا از ماتریس Node چک می‌شود
  check-tabir-khab:
    needs: changes
    if: needs.changes.outputs.tabir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bots/tabir-khab/requirements.txt

      - name: Install dependencies
        run: pip install -r bots/tabir-khab/requirements.txt

      - name: Syntax check
        run: python -m compileall -q bots/tabir-khab
