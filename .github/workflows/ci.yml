name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bot: [voice2text, resume-tailor, tarot]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bots/${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix bots/${{ matrix.bot }}

      - name: Syntax check
        run: node --check bots/${{ matrix.bot }}/index.js

  # tabir-khab پایتونی است (استثنای مونوریپو) — جدا از ماتریس Node چک می‌شود
  check-tabir-khab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bots/tabir-khab/requirements.txt

      - name: Install dependencies
        run: pip install -r bots/tabir-khab/requirements.txt

      - name: Syntax check
        run: python -m compileall -q bots/tabir-khab
