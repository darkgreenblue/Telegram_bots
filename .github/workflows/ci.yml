name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bot: [voice2text, resume-tailor]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bots/${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix bots/${{ matrix.bot }}

      - name: Syntax check
        run: node --check bots/${{ matrix.bot }}/index.js
