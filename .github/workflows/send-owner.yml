name: Send to owner

# فرستادنِ فایل/متن به تلگرامِ مالک، از روی فایل‌های خودِ ریپو.
#
# چرا وجود دارد: سشنِ Claude هیچ راهِ مستقیمی به تلگرام ندارد، و تا امروز تنها
# مسیرهای ارسال، مخصوصِ یک کار بودند (هشدارِ Health، ویدیوی ریلز، پستِ کانال).
# وقتی مالک می‌خواهد چیزی را روی گوشی‌اش ببیند (مثلِ آواتارِ پیشنهادیِ ربات‌ها)
# هیچ‌کدام جواب نمی‌داد.
#
# 💰 هزینه (بند ۳ج): فقط dispatch، یک جاب، چند اجرا در ماه. عملاً صفر.
# 🔒 هیچ سکرتِ تازه‌ای لازم ندارد: از توکنِ voice2text و آی‌دیِ مالک استفاده می‌کند.
on:
  workflow_dispatch:
    inputs:
      text:
        description: 'پیامِ متنی (اختیاری) — قبل از فایل‌ها فرستاده می‌شود'
        required: false
        default: ''
      items:
        description: 'JSON: [{"path":"…","caption":"…"}] — کپشن می‌تواند چندخطی باشد'
        required: false
        default: '[]'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send to owner
        env:
          TOKEN: ${{ secrets.VOICE2TEXT_BOT_TOKEN }}
          OWNER: ${{ secrets.OWNER_TELEGRAM_ID }}
          TEXT:  ${{ inputs.text }}
          ITEMS: ${{ inputs.items }}
        run: node tools/send-owner.mjs
