name: Admin report

# داشبوردِ مدیریتی از راه دور: این workflow را دستی (یا با API توسط Claude) اجرا کن؛
# روی سرور SSH می‌زند، آخرین کد را pull می‌کند، report.py را اجرا می‌کند و خروجی
# (کاربرها/خواب‌ها/درآمد) را در لاگِ همین job چاپ می‌کند. چون Claude به لاگِ Actions
# دسترسی دارد، هر وقت گزارش خواستی این را تریگر می‌کند و نتیجه را می‌خواند —
# بدون نیاز به SSHِ مستقیم (که از محیطِ Claude بسته است).

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run admin report over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/tabir_khab
            git pull --quiet || true
            .venv/bin/python report.py
