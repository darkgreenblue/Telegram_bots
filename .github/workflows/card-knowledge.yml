name: Card knowledge

# ساختِ یک‌باره‌ی جدولِ دانشِ ۷۸ کارت به فارسی و کامیتِ نتیجه.
# چرا این‌جا و نه در سشن: کلیدِ OpenRouter فقط به‌عنوان Secret وجود دارد.
# هزینه: حدود ۰.۰۵ تا ۰.۲۰ دلار، یک‌بار. بعد از آن runtime هیچ هزینه‌ای بابتِ دانش نمی‌دهد.
# روی رانرِ گیت‌هاب اجرا می‌شود (نه سرور) و هیچ رباتی را ری‌استارت نمی‌کند.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'فقط این کارت‌ها (مثل m00,m01). خالی = هر کارتی که هنوز ساخته نشده'
        required: false
        default: ''
      model:
        description: 'مدل'
        required: false
        default: 'google/gemini-2.5-flash'

permissions:
  contents: write

concurrency: card-knowledge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build Persian card knowledge
        env:
          OPENROUTER_API_KEY: ${{ secrets.TAROT_OPENROUTER_KEY }}
          KNOWLEDGE_MODEL: ${{ inputs.model }}
        run: node tools/build-card-knowledge.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      # گاردِ کیفیت **قبل** از کامیت: فایلِ ناقص یا انگلیسی‌آلود نباید وارد ریپو شود
      - name: Validate
        run: node tools/check-card-knowledge.mjs

      - name: Commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bots/tarot/card-knowledge.fa.json; then
            echo "بدون تغییر"; exit 0
          fi
          git add bots/tarot/card-knowledge.fa.json
          git commit -m "data(tarot): جدولِ دانشِ کارت‌ها به فارسی (تولیدِ خودکار)"
          git push origin main

      # نکته: `secrets` در شرطِ step مجاز نیست (خطای «Unrecognized named-value»)، پس
      # خالی‌بودنِ سکرت داخلِ خودِ اسکریپت چک می‌شود — همان الگوی health.yml.
      - name: Telegram alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TAROT_BOT_TOKEN }}
          IDS: ${{ secrets.OWNER_TELEGRAM_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$IDS" ]; then echo "ℹ️ سکرت ست نشده — هشدار رد شد"; exit 0; fi
          for id in $(echo "$IDS" | tr ',' ' '); do
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$id" \
              -d text="❌ ساختِ جدولِ دانشِ کارت‌ها شکست خورد: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          done
