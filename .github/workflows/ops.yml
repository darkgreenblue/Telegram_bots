# Ops — دسترسی on-demand به لاگ‌ها و وضعیت pm2 روی VPS (بدون نیاز به SSH کاربر)
#
# هر سشن Claude Code می‌تواند این workflow را با workflow_dispatch اجرا کند
# (از طریق GitHub MCP: actions_run_trigger) و بعد خروجی را از لاگ جاب بخواند
# (get_job_logs). خروجی دستورها مستقیم در لاگ همین جاب چاپ می‌شود.
name: Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'چه کاری؟'
        required: true
        type: choice
        options: [status, sys, logs, errors, restart, env-check, db-query, exp, daypost, channel-overlap, channel-overlap-read, tunnel-url, recover-dry, recover-send, announce-dry, announce-send]
      app:
        description: 'نام اپ pm2 (برای logs/errors/restart/db-query) مثل tarot'
        required: false
        default: ''
      lines:
        description: 'تعداد خطوط لاگ'
        required: false
        default: '100'
      query:
        description: 'db-query: کوئری SQL فقط-خواندنی. exp: اسپکِ JSON (نه SQL) مثل {"op":"status","key":"love_slot","to":"running"}'
        required: false
        default: ''
      only:
        description: 'فقط این آی‌دی‌ها (announce-*) — کاماجدا. خالی = همه‌ی کاربران'
        required: false
        default: ''

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Run ops command on VPS
        uses: appleboy/ssh-action@v1
        env:
          OPS_ACTION: ${{ inputs.action }}
          OPS_APP:    ${{ inputs.app }}
          OPS_LINES:  ${{ inputs.lines }}
          OPS_QUERY:  ${{ inputs.query }}
          OPS_ONLY:   ${{ inputs.only }}
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OPS_ACTION,OPS_APP,OPS_LINES,OPS_QUERY,OPS_ONLY
          script: |
            set -e
            cd ~/voice2text
            # ضد تزریق: نام اپ و تعداد خطوط فقط با الگوی امن
            case "$OPS_APP"   in (*[!a-z0-9-]*) echo "❌ نام اپ نامعتبر"; exit 1;; esac
            case "$OPS_LINES" in (*[!0-9]*|'') OPS_LINES=100;; esac

            case "$OPS_ACTION" in
              status)
                pm2 ls
                echo
                pm2 jlist | node -e "
                  const a = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                  for (const p of a) console.log(
                    p.name.padEnd(16),
                    'status=' + p.pm2_env.status,
                    'restarts=' + p.pm2_env.restart_time,
                    'uptime_min=' + Math.round((Date.now() - p.pm2_env.pm_uptime) / 60000),
                    'mem_mb=' + Math.round((p.monit?.memory || 0) / 1048576)
                  );"
                echo
                # آیا بعد از reboot سرور، pm2 خودکار بالا می‌آید؟
                if systemctl list-unit-files 2>/dev/null | grep -q '^pm2-ubuntu'; then
                  echo "pm2 startup: ✅ $(systemctl is-enabled pm2-ubuntu 2>/dev/null || echo '?')"
                else
                  echo "pm2 startup: ❌ تنظیم نشده — بعد از reboot سرور ربات‌ها خودکار بالا نمی‌آیند (فیکس: pm2 startup + دستور چاپ‌شده + pm2 save)"
                fi
                ;;
              logs)
                [ -n "$OPS_APP" ] || { echo "❌ app لازم است"; exit 1; }
                echo "===== $OPS_APP — out.log (آخرین $OPS_LINES خط) ====="
                tail -n "$OPS_LINES" ~/.pm2/logs/"$OPS_APP"-out.log 2>/dev/null || echo "(خالی/موجود نیست)"
                echo
                echo "===== $OPS_APP — error.log (آخرین $OPS_LINES خط) ====="
                tail -n "$OPS_LINES" ~/.pm2/logs/"$OPS_APP"-error.log 2>/dev/null || echo "(خالی/موجود نیست)"
                ;;
              errors)
                [ -n "$OPS_APP" ] || { echo "❌ app لازم است"; exit 1; }
                echo "===== $OPS_APP — error.log (آخرین $OPS_LINES خط) ====="
                tail -n "$OPS_LINES" ~/.pm2/logs/"$OPS_APP"-error.log 2>/dev/null || echo "(خالی/موجود نیست)"
                ;;
              restart)
                [ -n "$OPS_APP" ] || { echo "❌ app لازم است"; exit 1; }
                pm2 restart "$OPS_APP" --update-env
                sleep 3
                pm2 ls
                echo "--- ۲۰ خط آخر بعد از ری‌استارت ---"
                tail -n 20 ~/.pm2/logs/"$OPS_APP"-out.log 2>/dev/null || true
                tail -n 20 ~/.pm2/logs/"$OPS_APP"-error.log 2>/dev/null || true
                ;;
              env-check)
                # فقط وجود فایل‌ها — هرگز محتوای .env چاپ نمی‌شود
                for d in bots/*/; do
                  n=$(basename "$d")
                  [ -f "$d/.env" ] && echo "$n: .env ✅" || echo "$n: .env ❌"
                done
                ;;
              db-query)
                # کوئری فقط-خواندنی روی SQLite همان ربات (اتصال readonly — نوشتن در سطح SQLite رد می‌شود)
                [ -n "$OPS_APP" ]   || { echo "❌ app لازم است"; exit 1; }
                [ -n "$OPS_QUERY" ] || { echo "❌ query لازم است"; exit 1; }
                cd "bots/$OPS_APP"
                # 🐛 باگِ واقعیِ ۱۲ شهریور ۱۴۰۵: این‌جا `ls data/*.db | head -1` بود، یعنی
                # **اولین فایل به ترتیبِ الفبا**. از وقتی تاروت چنددیتابیسی شد آن فایل
                # `bot-es.db`ِ خالی است، پس هر کوئریِ تاروت با اطمینان «rows: 0» می‌داد در
                # حالی که دیتای واقعی در `bot-fa.db` بود. هم‌خانواده‌ی دقیقِ باگِ
                # `channel-overlap` (همان `readdirSync` که دیتابیسِ خالیِ زبانِ دیگری را برداشت).
                #
                # حالا بزرگ‌ترین فایل انتخاب می‌شود (پرجمعیت‌ترین)، و **همه‌ی نامزدها با
                # اندازه‌شان چاپ می‌شوند** تا انتخابِ اشتباه دیده شود نه اینکه بی‌صدا بماند.
                # `OPS_ONLY` نامِ فایلِ دلخواه را تحمیل می‌کند (مثلاً `bot-ru.db`).
                if [ -n "$OPS_ONLY" ] && [ -f "data/$OPS_ONLY" ]; then
                  DBFILE="data/$OPS_ONLY"
                else
                  DBFILE=$(ls -S data/*.db 2>/dev/null | head -1)
                fi
                [ -n "$DBFILE" ] || { echo "❌ هیچ فایل .db در bots/$OPS_APP/data نیست"; exit 1; }
                echo "--- دیتابیس‌های موجود (بزرگ‌ترین اول) ---"
                ls -Sla data/*.db 2>/dev/null | awk '{print "    " $NF "  " $5 " بایت"}'
                echo "===== db-query روی $OPS_APP/$DBFILE ====="
                DBFILE="$DBFILE" node -e "
                  const path = require('path');
                  const D = require(path.join(process.cwd(), 'node_modules', 'better-sqlite3'));
                  const db = new D(process.env.DBFILE, { readonly: true, fileMustExist: true });
                  const stmt = db.prepare(process.env.OPS_QUERY);
                  if (stmt.reader) {
                    const rows = stmt.all();
                    console.log(JSON.stringify(rows.slice(0, 200), null, 1));
                    console.log('--- rows: ' + rows.length + (rows.length > 200 ? ' (فقط ۲۰۰ ردیف اول چاپ شد)' : ''));
                  } else {
                    console.log('کوئری خروجی‌ای برنمی‌گرداند (اتصال readonly است — هیچ تغییری اعمال نشد)');
                  }
                "
                ;;
              exp)
                # 🧪 کنترلِ آزمایشِ A/B بدونِ داشبورد (تنها نقطه‌ی **نوشتنِ** Ops).
                # تا امروز تنها نویسنده‌ی جدولِ experiments داشبورد بود و داشبورد فقط از
                # مرورگرِ مالک پشتِ تونل باز می‌شود، پس هر آزمایشی یک قدمِ دستیِ اجباری
                # داشت — خلافِ بند ۷ ریشه.
                # منطق عمداً در tools/ops-exp.mjs است نه این‌جا: SQLاش کاراکترهایی دارد
                # که شل داخلِ رشته‌ی دابل‌کوت تفسیر می‌کند (جانشینیِ دستور و بسطِ متغیر).
                # نسخه‌ی درون‌خطیِ همین کار با همان خطا شکست، پس الگوی announce-tarot.mjs
                # را گرفت. چکِ tools/check-ops-exp.mjs همین را قفل کرده.
                [ -n "$OPS_APP" ]   || { echo "❌ app لازم است"; exit 1; }
                [ -n "$OPS_QUERY" ] || { echo "❌ اسپکِ JSON لازم است"; exit 1; }
                cd "bots/$OPS_APP"
                DBFILE=$(ls data/*.db 2>/dev/null | head -1)
                [ -n "$DBFILE" ] || { echo "❌ هیچ فایل .db در bots/$OPS_APP/data نیست"; exit 1; }
                echo "===== exp روی $OPS_APP/$DBFILE ====="
                node ../../tools/ops-exp.mjs "$DBFILE"
                ;;
              recover-dry|recover-send)
                # 🔮 بازیابیِ فال‌های نیمه‌تمام. پیش‌فرضِ `recover-dry` هیچ پیامی نمی‌فرستد و
                # هیچ الماسی جابه‌جا نمی‌کند؛ فقط چاپ می‌کند چه کسی چه متنی می‌گیرد.
                # ریفاند **قبل از** ارسال ثبت می‌شود، پس پیامِ نرسیده پول را نمی‌سوزاند.
                cd ~/voice2text
                if [ "$OPS_ACTION" = "recover-send" ]; then SEND="--send"; else SEND=""; fi
                case "$OPS_ONLY" in (*[!0-9,]*) echo "❌ لیستِ آی‌دی نامعتبر"; exit 1;; esac
                echo "===== recover $SEND ${OPS_ONLY:+(فقط: $OPS_ONLY)} ====="
                RECOVER_ONLY="$OPS_ONLY" node tools/recover-stuck-readings.mjs bots/tarot/data $SEND
                ;;
              announce-dry|announce-send)
                # 📣 پیامِ اطلاع‌رسانیِ آپدیت. عمداً از خودِ دیپلوی جداست تا مالک **اول**
                # وضعیتِ ربات را چشمی تأیید کند و بعد پیامِ برگشت‌ناپذیر به ~۱۰۰ کاربر برود.
                # گاردِ `assertReady` داخلِ خودِ اسکریپت جلوی ارسالِ زودهنگام را می‌گیرد
                # (تا مهاجرت اجرا نشده و دنیای الماس باز نشده، ارسالِ واقعی رد می‌شود).
                cd ~/voice2text
                # ⚠️ عمداً `if` صریح و نه `[ … ] && SEND=…`: زیرِ `set -e` یک AND-listِ
                # ناموفق روی سرورِ زنده ریسکِ بی‌دلیل است، و این مسیر به ~۱۰۰ کاربر پیام می‌دهد.
                if [ "$OPS_ACTION" = "announce-send" ]; then SEND="--send"; else SEND=""; fi
                # ضد تزریق: لیستِ آی‌دی فقط رقم و کاما. اسکریپت خودش `ANNOUNCE_ONLY` را
                # می‌خواند؛ خالی یعنی همه‌ی کاربران.
                case "$OPS_ONLY" in (*[!0-9,]*) echo "❌ لیستِ آی‌دی نامعتبر"; exit 1;; esac
                echo "===== announce $SEND ${OPS_ONLY:+(فقط: $OPS_ONLY)} ====="
                ANNOUNCE_ONLY="$OPS_ONLY" node tools/announce-tarot.mjs bots/tarot/data $SEND
                ;;
              channel-overlap)
                # چند نفر فقط عضوِ کانال‌اند و هرگز وارد ربات نشده‌اند؟
                #
                # ⚠️ **detached** اجرا می‌شود و رانر منتظر نمی‌ماند. دلیل: این کار برای
                # هر کاربرِ ربات یک getChatMember می‌زند و با احترام به نرخِ تلگرام
                # ده‌ها دقیقه طول می‌کشد. اگر رانر منتظر بماند، همان ده‌ها دقیقه از
                # سهمیه‌ی Actions می‌سوزد در حالی که هیچ کاری روی رانر انجام نمی‌شود
                # (سهمیه‌ی همین ریپو یک بار تمام شد و پنج روز پستِ کانال را برد).
                # نتیجه با `channel-overlap-read` خوانده می‌شود؛ آن یکی چند ثانیه است.
                [ -n "$OPS_APP" ] || { echo "❌ app لازم است"; exit 1; }
                [ -n "$OPS_QUERY" ] || { echo "❌ query = نامِ کانال (مثل @taroot_fa)"; exit 1; }
                case "$OPS_QUERY" in (@[A-Za-z0-9_]*) ;; (*) echo "❌ نامِ کانال نامعتبر"; exit 1;; esac
                TOKEN=$(grep -m1 '^BOT_TOKEN=' "bots/$OPS_APP/.env" | cut -d= -f2-)
                [ -n "$TOKEN" ] || { echo "❌ BOT_TOKEN در .env نیست"; exit 1; }
                OUT="$HOME/channel-overlap.log"
                # اجرای قبلی (اگر هست) کشته می‌شود و از نو شروع می‌کنیم. اسکریپت فقط
                # می‌خواند و هیچ چیزی را تغییر نمی‌دهد، پس کشتنش بی‌خطر است. گاردِ
                # «اگر در جریان است شروع نکن» یک بار قفلمان کرد: پروسه‌ی یک اجرای
                # کنسل‌شده روی سرور زنده مانده بود و چون stdoutش به کانالِ SSHِ مرده
                # می‌رفت، هم بلاک می‌کرد هم هیچ خروجی‌ای نداشت.
                pkill -f '[c]hannel-overlap.mjs' 2>/dev/null && echo "🧹 اجرای قبلی متوقف شد" || true
                sleep 1
                : > "$OUT"
                TELEGRAM_TOKEN="$TOKEN" nohup node tools/marketing/channel-overlap.mjs \
                  "bots/$OPS_APP/data" "$OPS_QUERY" >> "$OUT" 2>&1 &
                echo "🚀 سنجش در پس‌زمینه‌ی سرور شروع شد (رانر منتظر نمی‌ماند)"
                sleep 3
                echo "---- شروعِ خروجی ----"; head -n 20 "$OUT" 2>/dev/null
                echo; echo "برای دیدنِ نتیجه: Ops → channel-overlap-read"
                ;;
              channel-overlap-read)
                OUT="$HOME/channel-overlap.log"
                if pgrep -f '[c]hannel-overlap.mjs' >/dev/null 2>&1; then
                  echo "⏳ هنوز در حال اجراست. آخرین خطوط:"
                else
                  echo "✅ اجرا تمام شده. خروجیِ کامل:"
                fi
                tail -n 40 "$OUT" 2>/dev/null || echo "(هنوز خروجی‌ای نیست)"
                ;;
              daypost)
                # سلامتِ کرونِ انتشارِ روزانه‌ی کانال (مسیرِ بحرانیِ جدید، مستقل از Actions).
                # بدونِ این، تنها راهِ فهمیدنِ خرابی «پست نیامد» بود، یعنی بعد از از‌دست‌رفتنِ روز.
                echo "---- سرویسِ cron ----"
                systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || echo "⚠️ سرویسِ cron فعال نیست"
                echo "---- خطِ crontab ----"
                crontab -l 2>/dev/null | grep 'vps-daily-post' || echo "❌ کرون در crontab نیست"
                echo "---- ساعتِ سرور و تهران ----"
                echo "server: $(date '+%F %H:%M %Z')  |  Tehran: $(TZ=Asia/Tehran date '+%F %H:%M')"
                echo "---- مارکرهای اخیر (روزهای منتشرشده) ----"
                ls -1t ~/.cache/taroot-daypost 2>/dev/null | head -10 || echo "(هنوز هیچ مارکری نیست)"
                echo "---- ۳۰ خطِ آخرِ لاگ ----"
                tail -n 30 ~/taroot-daypost.log 2>/dev/null || echo "(لاگ هنوز ساخته نشده؛ یعنی کرون هنوز یک بار هم اجرا نشده)"
                ;;
              sys)
                # 📟 عکسِ فوریِ منابعِ سرور — برای جواب‌دادن به «سرور ضعیف است یا معماری؟»
                # بدونِ SSH. هیچ ورودیِ کاربری نمی‌گیرد، پس سطحِ تزریق ندارد.
                echo "---- ساعت ----"
                echo "server: $(date '+%F %H:%M:%S %Z')  |  Tehran: $(TZ=Asia/Tehran date '+%F %H:%M:%S')"
                uptime || true
                echo
                echo "---- CPU: بار باید با تعدادِ هسته سنجیده شود، نه مطلق ----"
                echo "cores:   $(nproc)"
                echo "loadavg: $(cat /proc/loadavg)"
                echo "(سه عددِ اول = بارِ ۱/۵/۱۵ دقیقه. سالم یعنی کمتر از تعدادِ هسته.)"
                echo
                echo "---- steal time: آیا هاستِ VPS ما را خفه می‌کند؟ ----"
                if command -v vmstat >/dev/null 2>&1; then
                  vmstat 1 5
                  echo "(ردیفِ اول میانگینِ از-بوت است و گمراه‌کننده؛ چهار ردیفِ بعدی نمونه‌ی زنده‌اند.)"
                  echo "(st = درصدِ CPU که هایپروایزر از ما گرفته. پایدار بالای ۵ یعنی سرور oversold؛ نزدیکِ صفر یعنی مشکل از هاست نیست.)"
                  echo "(wa = انتظارِ I/O. بالا یعنی دیسک گلوگاه است. r = صفِ آماده‌به‌اجرا.)"
                else
                  echo "(vmstat نصب نیست — بسته‌ی procps لازم است)"
                fi
                echo
                echo "---- حافظه ----"
                free -m || true
                echo
                echo "---- دیسک ----"
                df -h / 2>/dev/null || true
                echo
                echo "---- فشارِ منابع (PSI) — صفر یعنی هیچ‌کس منتظرِ منبع نمانده ----"
                for f in /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory; do
                  if [ -r "$f" ]; then echo "$f -> $(head -1 "$f")"; fi
                done
                echo
                echo "---- سهمِ واقعیِ CPU هر ربات از عمرِ خودش ----"
                echo "(عددِ پایین یعنی پروسه CPU-bound نیست و دارد پشتِ await/I-O منتظر می‌ماند،"
                echo " یعنی ارتقای سرور کمکی نمی‌کند. عددِ نزدیک به ۱۰۰ یعنی یک هسته اشباع است.)"
                pm2 jlist | node -e "
                  const fs = require('fs');
                  const a = JSON.parse(fs.readFileSync(0, 'utf8'));
                  const HZ = 100;
                  const upt = parseFloat(fs.readFileSync('/proc/uptime', 'utf8').split(' ')[0]);
                  for (const p of a) {
                    try {
                      const st = fs.readFileSync('/proc/' + p.pid + '/stat', 'utf8');
                      const f = st.slice(st.lastIndexOf(')') + 2).split(' ');
                      const cpuSec = (Number(f[11]) + Number(f[12])) / HZ;
                      const ageSec = upt - Number(f[19]) / HZ;
                      console.log(
                        p.name.padEnd(14),
                        'cpu_share=' + (100 * cpuSec / ageSec).toFixed(1) + '%',
                        'cpu_sec=' + cpuSec.toFixed(0),
                        'age_min=' + Math.round(ageSec / 60),
                        'threads=' + f[17]
                      );
                    } catch (e) { console.log(p.name.padEnd(14), '(خوانده نشد: ' + e.message + ')'); }
                  }"
                echo
                echo "---- ۱۰ پروسه‌ی پرمصرف (pcpu = میانگینِ کلِ عمر، نه لحظه‌ای) ----"
                ps -eo pid,pcpu,pmem,rss,etime,comm --sort=-pcpu | head -11 || true
                echo
                echo "---- سوکت‌ها ----"
                ss -s 2>/dev/null | head -6 || true
                echo
                echo "---- تأخیرِ شبکه به تلگرام (۵ نمونه، بدونِ توکن) ----"
                for i in 1 2 3 4 5; do
                  out=$(curl -s -o /dev/null --max-time 10 \
                    -w "  dns %{time_namelookup}s | tcp %{time_connect}s | tls %{time_appconnect}s | total %{time_total}s | http %{http_code}" \
                    https://api.telegram.org/ 2>&1) || true
                  echo "${out:-  (نمونه شکست خورد)}"
                done
                echo "(http=200/404 یعنی رسیدیم؛ http=000 یعنی اصلاً وصل نشد. tls بالا یعنی دست‌دادنِ کند.)"
                ;;
              tunnel-url)
                # آدرس فعلی تونل داشبورد (quick tunnel بعد از هر ری‌استارت عوض می‌شود)
                echo "dash-tunnel: $(systemctl is-active dash-tunnel 2>/dev/null || echo 'نصب نشده')"
                echo "dashboard local: HTTP $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/login || echo 000) (انتظار: 200)"
                URL=$(sudo journalctl -u dash-tunnel -n 1000 -o cat 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1 || true)
                echo "🌐 ${URL:-آدرس trycloudflare در لاگ نبود (named tunnel؟ یا سرویس تازه بالا آمده)}"
                ;;
            esac
