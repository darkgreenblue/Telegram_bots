name: Reading lab

# 🧪 آزمایشگاهِ خوانشِ تاروت: کاربر را آفلاین شبیه‌سازی می‌کند و چند فالِ کامل می‌گیرد،
# با **همان** پرامپت و همان کدی که در پروداکشن اجرا می‌شود (`bots/tarot/reading-core.js`).
#
# چرا این‌جا و نه روی سرور: هیچ چیزی از سرور لازم ندارد (نه دیتابیس، نه توکنِ تلگرام) و
# **هیچ رباتی را ری‌استارت نمی‌کند**. تنها رازِ لازم کلیدِ OpenRouterِ خودِ تاروت است، پس
# هزینه دقیقاً روی همان کلیدی می‌نشیند که محصول از آن استفاده می‌کند.
#
# هزینه: هر فالِ سه‌کارتی حدود ۰.۶ سنت، صلیب سلتی حدود ۱.۳ سنت. یک دورِ کاملِ ۹ فالی
# زیرِ ۱۰ سنت است. با `dry: true` هیچ فراخوانی‌ای نمی‌رود (فقط اندازه‌ی ورودی سنجیده می‌شود).

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'زبان (fa | ru | …). سناریوها و سنجه‌ها per زبان اند.'
        required: false
        default: 'fa'
      model:
        description: 'مدلِ تحتِ آزمایش (خالی = همان مدلِ محصول). مثل: openai/gpt-5-mini'
        required: false
        default: ''
      fallback:
        description: 'مدلِ فالبک (خالی = پیش‌فرضِ محصول)'
        required: false
        default: ''
      list_models:
        description: 'فقط فهرستِ مدل‌ها و قیمتِ واقعیِ OpenRouter را چاپ کن و تمام'
        type: boolean
        required: false
        default: false
      only:
        description: 'پرسوناها (خالی = همه). مثل: P1,P2'
        required: false
        default: ''
      dry:
        description: 'بدونِ فراخوانیِ مدل (فقط سلامتِ خطِ لوله و اندازه‌ی ورودی)'
        type: boolean
        required: false
        default: false
      probe:
        description: 'اندازه‌گیریِ نرخِ خرابیِ شکلِ خروجی per چیدمان (به‌جای اجرای سناریوها)'
        type: boolean
        required: false
        default: false
      reps:
        description: 'چند پاسِ کامل روی همان سناریوها (برای جدا کردنِ اثر از نویز). در حالتِ probe: تکرارِ هر چیدمان'
        required: false
        default: '1'

concurrency:
  group: reading-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # آزمایشگاه هیچ وابستگیِ npm ندارد (فقط ماژول‌های داخلیِ Node)، پس نه npm ci لازم
      # است نه کشِ node_modules. اگر روزی وابستگی اضافه شد، همین‌جا نصبش کن.
      # 🔎 فهرستِ مدل‌ها: endpointِ رایگانِ OpenRouter، بدونِ کلید و بدونِ هزینه. این‌جا
      # اجرا می‌شود چون محیطِ توسعه خروجیِ شبکه به openrouter.ai ندارد و slug و قیمت
      # هرگز نباید حدس زده شوند.
      - name: فهرستِ مدل‌ها
        if: inputs.list_models
        run: node tools/or-models.mjs

      - name: گاردِ کلید
        if: '!inputs.list_models'
        env:
          KEY: ${{ secrets.TAROT_OPENROUTER_KEY }}
        run: |
          if [ "${{ inputs.dry }}" != "true" ] && [ -z "$KEY" ]; then
            echo "::error::سکرتِ TAROT_OPENROUTER_KEY ست نشده — بدونِ آن فقط حالتِ dry ممکن است."
            exit 1
          fi

      - name: اجرای آزمایشگاه
        if: '!inputs.list_models'
        env:
          OPENROUTER_API_KEY: ${{ secrets.TAROT_OPENROUTER_KEY }}
          # زبان از env می‌رود چون `reading-core.js` مسیرِ فایل‌های per زبان را
          # لحظه‌ی بارگذاریِ ماژول می‌خواند؛ `--locale` هم همین را ست می‌کند.
          LOCALE: ${{ inputs.locale }}
        run: |
          ARGS="--locale ${{ inputs.locale }}"
          [ -n "${{ inputs.model }}" ] && ARGS="$ARGS --model ${{ inputs.model }}"
          [ -n "${{ inputs.fallback }}" ] && ARGS="$ARGS --fallback ${{ inputs.fallback }}"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          # `reps` در **هر دو** حالت پاس داده می‌شود. قبلاً فقط به probe می‌رسید و
          # یک دورِ سه‌پاسه بی‌صدا تک‌پاسه اجرا می‌شد — یعنی گزارشِ «نویز سنجیده شد»
          # می‌دادیم بدونِ اینکه اصلاً چند پاس گرفته باشیم.
          [ -n "${{ inputs.reps }}" ] && ARGS="$ARGS --reps ${{ inputs.reps }}"
          if [ "${{ inputs.probe }}" = "true" ]; then
            node tools/reading-lab.mjs $ARGS --probe
          else
            node tools/reading-lab.mjs $ARGS --out reading-lab-out.json
          fi

      # در حالتِ probe فایلی ساخته نمی‌شود (گزارشش فقط در لاگ است)، پس این قدم رد می‌شود
      - name: خروجیِ خام
        if: always() && inputs.probe != true && inputs.list_models != true
        uses: actions/upload-artifact@v4
        with:
          name: reading-lab-${{ inputs.locale }}
          path: reading-lab-out.json
          retention-days: 30
          if-no-files-found: ignore
