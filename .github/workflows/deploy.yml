name: Deploy

on:
  push:
    branches: [main]
  # اجرای دستی: هم برای force_all، هم برای اعمالِ secretهای تازه‌ساخته بدون کامیت جدید
  workflow_dispatch:
    inputs:
      force_all:
        description: 'دیپلوی اجباری همه‌ی ربات‌ها (حتی بدون تغییر)'
        type: boolean
        default: false
      urgent:
        description: '🚨 پروتکلِ فوری: دیپلوی خارج از ساعتِ امن (فقط با تشخیصِ مالک)'
        type: boolean
        default: false
      reason:
        description: 'دلیلِ فوریت — اجباری وقتی urgent روشن است؛ در تلگرام ثبت می‌شود'
        type: string
        default: ''

  # ⏰ گرفتنِ دیپلویِ به‌تعویق‌افتاده در پنجره‌ی امن. کرونِ گیت‌هاب UTC است و تهران
  # UTC+3:30 (ایران از ۲۰۲۲ ساعتِ تابستانی ندارد، پس این افست ثابت است).
  #   04:35 UTC = 08:05 تهران   ·   05:35 UTC = 09:05 تهران
  # دو پنجره چون زمان‌بندیِ Actions تضمینی نیست و روی همین ریپو ۱ تا ۴ ساعت تأخیر
  # دیده شده (بند ۳ج). دیپلوی ذاتاً idempotent است: اگر چیزی عوض نشده باشد هیچ
  # رباتی reload نمی‌شود، پس اجرای دوم بی‌ضرر است.
  schedule:
    - cron: '35 4 * * *'
    - cron: '35 5 * * *'

# 🔒 **دو دیپلوی هرگز هم‌زمان روی سرور نمی‌دوند.**
#
# 🐛 باگِ واقعیِ ۱۴۰۵/۰۶/۱۶ که رباتِ زنده را خواباند و جابِ دیپلوی را قرمز کرد:
# دو مرج با ۲۰ ثانیه فاصله (۰۶:۵۳:۳۲ و ۰۶:۵۳:۵۲) دو رانِ Deploy ساختند که کاملاً
# روی هم افتادند. هر دو به همان سرور SSH زدند و هر دو `npm ci` را در **همان پوشه**
# (`bots/tarot`) اجرا کردند. و `npm ci` طبقِ تعریفش اول `node_modules` را پاک می‌کند،
# پس یکی پوشه را از زیرِ پای `npm`ِ آن یکی کشید. امضای دقیقش در لاگ:
#
#     npm error Error: Cannot find module './BufferList'   ← ماژول وسطِ require ناپدید شد
#     npm error gyp ERR! stack Error: ENOENT ... uv_cwd    ← cwdِ خودِ پروسه پاک شد
#
# این با گاردِ `INSTALLED_DIRS` (که نصبِ تکراری را **داخلِ یک ران** حذف می‌کند) بسته
# نمی‌شود: آن یک متغیرِ شل است و هر ران نسخه‌ی خودش را دارد. دو ران همچنان دو `npm ci`
# هم‌زمان می‌زنند. آن باگ و این باگ دو چیزِ متفاوت‌اند و هر دو واقعی.
#
# ⚠️ `cancel-in-progress` عمداً **false** است و باید بماند. لغوِ رانِ در حالِ اجرا،
# `npm ci` را وسطِ کار می‌کُشد و دقیقاً همان `node_modules`ِ نیمه‌پاک‌شده را جا می‌گذارد
# که این بلوک برای جلوگیری از آن نوشته شده. یعنی `true` نه‌تنها کمک نمی‌کند، خودش
# مسبب همان خرابی می‌شود.
#
# صف‌شدن چیزی را از دست نمی‌دهد: دیپلوی در خطِ `git reset --hard origin/main` همیشه
# **mainِ همان لحظه** را می‌برد، نه کامیتِ خودش را. پس رانی که پشتِ صف منتظر می‌ماند
# (یا حتی به‌عنوان pendingِ کهنه لغو شود) هیچ کامیتی را جا نمی‌گذارد.
#
# گارد: tools/check-deploy-concurrency.mjs
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 🔑 مجوز صریح پین می‌شود، نه ارثی. `GH_FETCH_TOKEN` (پایین) با همین مجوز
    # `git fetch`ِ سرور را احراز هویت می‌کند؛ توکنی که مجوزِ خواندنِ محتوا نداشته
    # باشد یک رشته‌ی **بی‌اثر** است و همان خرابیِ ۱۴۰۵/۰۶/۲۱ را برمی‌گرداند.
    # ⚠️ و مجوزِ پیش‌فرضِ ورک‌فلوها یک **تنظیمِ سطحِ ریپو** است که بیرونِ گیت عوض
    # می‌شود، پس محدودشدنش هیچ دیفی نشان نمی‌دهد: تنها راهِ مصون‌کردنش همین
    # نوشتنِ صریح است. `contents: read` دقیقاً چیزی است که checkout و fetch لازم
    # دارند و نه ذره‌ای بیشتر (این جاب هیچ نوشتنی روی گیت‌هاب ندارد).
    permissions:
      contents: read
    steps:
      # چک‌اوت لازم است چون گیتِ پنجره یک اسکریپتِ داخلِ ریپوست (تک‌منبعِ منطق).
      - uses: actions/checkout@v4

      # ⏰ ---------- پنجره‌ی امنِ دیپلوی ----------
      # هر دیپلوی یعنی ری‌استارتِ رباتِ زنده، و ری‌استارت وسطِ اوج یعنی فلوی نیمه‌کاره‌ی
      # کاربرِ واقعی. بند ۲ج/۲ می‌گفت «در ساعتِ کم‌ترافیک مرج کن» ولی اجرایش دستی و
      # فراموش‌شدنی بود؛ حالا خودکار است. منطق و ساعت‌ها تک‌منبع‌اند در
      # tools/deploy-window.mjs (هر دو جابِ دیپلوی همان را صدا می‌زنند).
      #
      # 🚨 پروتکلِ فوری (تشخیصِ مالک): `urgent: true` در اجرای دستی با یک دلیلِ اجباری،
      # یا `[deploy-now]` در پیامِ کامیت. هر دو ساعت را دور می‌زنند و **در تلگرام ثبت
      # می‌شوند** — استثنایی که بی‌صدا باشد خیلی زود قاعده می‌شود.
      - name: پنجره‌ی امنِ دیپلوی
        id: gate
        env:
          # ⚠️ پیامِ کامیت از راهِ env می‌آید نه ${{ }} داخلِ اسکریپت: درج مستقیمش یک
          # تزریقِ کلاسیکِ Actions است (بند ۹: ورودی هرگز در shell interpolate نشود).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          URGENT:     ${{ inputs.urgent }}
          REASON:     ${{ inputs.reason }}
        run: node tools/deploy-window.mjs

      - name: Deploy to VPS
        if: steps.gate.outputs.go == 'true'
        uses: appleboy/ssh-action@v1
        # تک‌منبعِ حقیقت برای همه‌ی کلیدها = GitHub Secrets.
        # برای هر ربات جدید: دو خط اینجا اضافه کن، نامش را به envs اضافه کن،
        # یک بلوک write_env و یک deploy_bot در اسکریپت پایین بگذار.
        env:
          # 🔑 توکنِ موقتِ خودِ همین ران، فقط برای `git fetch` روی کلونِ سرور.
          # کلونِ سرور ریموتِ HTTPS دارد و مخزن **private** است، پس گیت پسورد می‌خواهد
          # و بدونِ credential شکست می‌خورد. تا وقتی مخزن موقتاً public بود (بند ۳ج ریشه)
          # fetchِ ناشناس کار می‌کرد و همین باعث شد این وابستگی ماه‌ها نامرئی بماند؛ با
          # private شدنِ دوباره، هر دیپلوی روی `could not read Password` مرد.
          # ⚠️ این توکن با پایانِ همین جاب باطل می‌شود و هرگز روی دیسکِ سرور یا در
          # `.git/config` نمی‌نشیند (از راهِ GIT_ASKPASS خوانده می‌شود، نه از URL).
          GH_FETCH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          # voice2text (اختیاری: تا وقتی این secretها تنظیم نشوند، .env فعلی روی سرور استفاده می‌شود)
          VOICE2TEXT_BOT_TOKEN:         ${{ secrets.VOICE2TEXT_BOT_TOKEN }}
          VOICE2TEXT_OPENROUTER_KEY:    ${{ secrets.VOICE2TEXT_OPENROUTER_KEY }}
          VOICE2TEXT_OPENROUTER_KEY_PERSONAL_USED: ${{ secrets.VOICE2TEXT_OPENROUTER_KEY_PERSONAL_USED }}
          VOICE2TEXT_NOTION_TOKEN:      ${{ secrets.VOICE2TEXT_NOTION_TOKEN }}
          # resume-tailor
          RESUME_TAILOR_BOT_TOKEN:      ${{ secrets.RESUME_TAILOR_BOT_TOKEN }}
          RESUME_TAILOR_OPENROUTER_KEY: ${{ secrets.RESUME_TAILOR_OPENROUTER_KEY }}
          # tarot
          TAROT_BOT_TOKEN:              ${{ secrets.TAROT_BOT_TOKEN }}
          TAROT_OPENROUTER_KEY:         ${{ secrets.TAROT_OPENROUTER_KEY }}
          # PATِ ریزدانه‌ی گیت‌هاب تا دستورِ /reel بتواند ورک‌فلوی Tarot video را صدا بزند
          TAROT_VIDEO_DISPATCH_TOKEN:   ${{ secrets.TAROT_VIDEO_DISPATCH_TOKEN }}
          # ⭐ سوییچِ استارز فقط-ادمین (v3.76.0): نرخِ زنده از نوبیتکس می‌آید (عمومی،
          # بدونِ کلید)؛ این یکی فقط fallbackِ اختیاری است، بدونش قیمت‌گذاریِ استارز
          # روی fallbackِ ثابتِ کد می‌ماند (بند «قیمت‌گذاری» در bots/tarot/CLAUDE.md).
          TAROT_USDT_TOMAN_RATE:        ${{ secrets.TAROT_USDT_TOMAN_RATE }}
          # 🌍 تاروتِ per زبان (بند ۲و). کلیدِ OpenRouter عمداً جداست تا هزینه و درآمدِ
          # هر زبان مستقل اندازه‌گیری شود. نبودنِ هرکدام یعنی همان زبان دیپلوی نمی‌شود.
          TAROT_RU_BOT_TOKEN:           ${{ secrets.TAROT_RU_BOT_TOKEN }}
          TAROT_RU_OPENROUTER_KEY:      ${{ secrets.TAROT_RU_OPENROUTER_KEY }}
          TAROT_PT_BOT_TOKEN:           ${{ secrets.TAROT_PT_BOT_TOKEN }}
          TAROT_PT_OPENROUTER_KEY:      ${{ secrets.TAROT_PT_OPENROUTER_KEY }}
          TAROT_ES_BOT_TOKEN:           ${{ secrets.TAROT_ES_BOT_TOKEN }}
          TAROT_ES_OPENROUTER_KEY:      ${{ secrets.TAROT_ES_OPENROUTER_KEY }}
          # daily-brief (پادکست روزانه): دو تای اول اجباری، Notion اختیاری
          # (بدون Notion ربات بالا می‌آید ولی رودمپ ندارد). موتورهای صدا هم از همان کلیدِ OpenRouter می‌آیند.
          DAILY_BRIEF_BOT_TOKEN:        ${{ secrets.DAILY_BRIEF_BOT_TOKEN }}
          DAILY_BRIEF_OPENROUTER_KEY:   ${{ secrets.DAILY_BRIEF_OPENROUTER_KEY }}
          DAILY_BRIEF_NOTION_TOKEN:     ${{ secrets.DAILY_BRIEF_NOTION_TOKEN }}
          # dashboard (داشبورد ادمین): توکن ورود + تونل اختیاری Cloudflare (named) + گیرنده‌ی آدرس تونل
          DASHBOARD_TOKEN:              ${{ secrets.DASHBOARD_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN:      ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          OWNER_TELEGRAM_ID:            ${{ secrets.OWNER_TELEGRAM_ID }}
          # اجرای دستی با force_all=true → همه ری‌دیپلوی می‌شوند
          FORCE_ALL:                    ${{ github.event.inputs.force_all || 'false' }}
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_FETCH_TOKEN,VOICE2TEXT_BOT_TOKEN,VOICE2TEXT_OPENROUTER_KEY,VOICE2TEXT_OPENROUTER_KEY_PERSONAL_USED,VOICE2TEXT_NOTION_TOKEN,RESUME_TAILOR_BOT_TOKEN,RESUME_TAILOR_OPENROUTER_KEY,TAROT_BOT_TOKEN,TAROT_OPENROUTER_KEY,TAROT_VIDEO_DISPATCH_TOKEN,TAROT_USDT_TOMAN_RATE,TAROT_RU_BOT_TOKEN,TAROT_RU_OPENROUTER_KEY,TAROT_PT_BOT_TOKEN,TAROT_PT_OPENROUTER_KEY,TAROT_ES_BOT_TOKEN,TAROT_ES_OPENROUTER_KEY,DAILY_BRIEF_BOT_TOKEN,DAILY_BRIEF_OPENROUTER_KEY,DAILY_BRIEF_NOTION_TOKEN,DASHBOARD_TOKEN,CLOUDFLARE_TUNNEL_TOKEN,OWNER_TELEGRAM_ID,FORCE_ALL
          script: |
            set -e
            cd ~/voice2text
            # ⚠️ **قبل از** هر reload گرفته می‌شود. گاردِ ضربانِ پایین می‌پرسد «ضربانی
            # تازه‌تر از این لحظه آمد؟»؛ اگر این مهر بعد از ری‌استارت گرفته می‌شد، ضربانِ
            # کهنه‌ی پروسه‌ی قبلی به‌عنوان سلامتِ پروسه‌ی جدید خوانده می‌شد و گارد دقیقاً
            # همان سبزِ دروغینی را می‌داد که برای حذفش ساخته شده.
            DEPLOY_STARTED_AT=$(date +%s)
            OLD_HEAD=$(git rev-parse HEAD)

            # ---------- همگام‌سازیِ مقاوم با main (باگِ واقعیِ ۹ شهریور ۱۴۰۵) ----------
            # کلونِ سرور یکی است ولی چند چیز هم‌زمان رویش گیت می‌زنند: خودِ دیپلوی، کرونِ
            # ساعتیِ vps-daily-post.sh، و ورک‌فلوهایی که از سرور چیزی می‌خوانند. دو دیپلویِ
            # پشت‌سرهم با دو شکلِ خرابی قرمز شدند و هر دو اینجا مهار می‌شوند:
            #
            #  ۱) «cannot lock ref refs/remotes/origin/main: is at X but expected Y» — یک
            #     گیتِ دیگر در همان ثانیه fetch می‌کرد (ورک‌فلوی News probe دقیقاً هم‌زمان
            #     dispatch شده بود). قفلِ ref موقتی است؛ تنها راهش تلاشِ دوباره است.
            #
            #  ۲) «Your local changes ... would be overwritten by merge» — همان ورک‌فلو با
            #     `git checkout origin/main -- tools/news` فایلی را در درختِ کار و index
            #     نشانده بود. این یکی **خودش پاک نمی‌شد**: از آن لحظه هر دیپلویِ بعدی
            #     می‌مرد و مالک هم SSH ندارد که دستی تمیزش کند.
            #
            # درمان: به‌جای `git pull` که جلوی هر ناخالصی می‌ایستد، صریحاً درخت را با
            # origin/main یکی می‌کنیم. کلونِ سرور آینه‌ی فقط-خواندنیِ main است (گاردِ CI:
            # tools/check-server-worktree.mjs)، پس چیزی برای از دست دادن ندارد و
            # `reset --hard` هم فایلِ نیمه‌کاره‌ی staged را برمی‌دارد و هم فایلِ untracked
            # ای را که با محتوای تازه تصادم دارد. فایل‌های ignore شده (`.env`، `data/`،
            # `node_modules/`, `.env.bak`) اصلاً لمس نمی‌شوند.
            # احرازِ هویتِ fetch (باگِ واقعیِ ۱۴۰۵/۰۶/۲۱): ریموتِ کلونِ سرور HTTPS است و
            # مخزن private، پس گیت پسورد می‌خواهد. توکن از راهِ **askpass** به گیت داده
            # می‌شود نه از راهِ URL یا آرگومان، پس نه در `.git/config` می‌نشیند و نه در
            # `ps` دیده می‌شود. فایلِ موقت با پایانِ اسکریپت پاک می‌شود.
            # نبودِ توکن (مثلاً مخزنِ public یا اجرای دستی) مسیر را نمی‌شکند: askpass
            # رشته‌ی خالی می‌دهد و fetchِ ناشناس مثل قبل انجام می‌شود.
            export GIT_TERMINAL_PROMPT=0
            GIT_ASKPASS_FILE=$(mktemp)
            printf '#!/bin/sh\ncase "$1" in Username*) echo x-access-token ;; *) echo "$GH_FETCH_TOKEN" ;; esac\n' > "$GIT_ASKPASS_FILE"
            chmod 700 "$GIT_ASKPASS_FILE"
            export GIT_ASKPASS="$GIT_ASKPASS_FILE"
            trap 'rm -f "$GIT_ASKPASS_FILE"' EXIT

            FETCH_OK=0
            for attempt in 1 2 3; do
              if git fetch --quiet origin main; then FETCH_OK=1; break; fi
              # ⚠️ متنِ قبلی بی‌قید می‌گفت «احتمالاً گیتِ هم‌زمان»، و همان حدسِ چسبیده به
              # پیام یک بار تشخیص را منحرف کرد: علتِ واقعی نبودِ credential بود که با
              # هیچ تعدادی تلاشِ دوباره درست نمی‌شود. حالا فقط خودِ خطا گزارش می‌شود.
              echo "⚠️ تلاشِ $attempt برای git fetch نشد — ۱۰ ثانیه دیگر دوباره (اگر خطا Password است، مسئله credential است نه هم‌زمانی)"
              sleep 10
            done
            if [ "$FETCH_OK" != "1" ]; then echo "❌ git fetch بعد از ۳ تلاش شکست خورد"; exit 1; fi
            # همان ضمانتِ --ff-only: اگر main فرزندِ HEADِ سرور نباشد، چیزی روی سرور هست
            # که در main نیست. آن‌وقت باید آدم نگاه کند، نه اینکه reset چیزی را دور بریزد.
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "❌ origin/main فست‌فوروارد نیست (HEADِ سرور: $OLD_HEAD) — دیپلوی متوقف شد"
              exit 1
            fi
            if ! git diff --quiet HEAD --; then
              echo "⚠️ درختِ کارِ سرور تغییرِ محلیِ ناخواسته داشت — دور انداخته شد:"
              git status --porcelain --untracked-files=no | head -20
            fi
            git reset --hard --quiet origin/main

            NEW_HEAD=$(git rev-parse HEAD)
            CHANGED_FILES=$(git diff --name-only "$OLD_HEAD" "$NEW_HEAD" || echo "")
            # تغییر زیرساخت مشترک → همه‌ی ربات‌ها ری‌دیپلوی می‌شوند
            INFRA_CHANGED=0
            if echo "$CHANGED_FILES" | grep -qE '^(ecosystem\.config\.cjs|shared/|\.github/workflows/deploy\.yml)'; then INFRA_CHANGED=1; fi

            # ---------- مهاجرت یک‌باره به ساختار مونوریپو (در دیپلوی‌های بعدی no-op) ----------
            NEED_MIGRATE=0
            if pm2 jlist | grep -q '/home/ubuntu/voice2text/index.js'; then NEED_MIGRATE=1; fi
            # مهم: قبل از جابجایی data، پروسه متوقف شود تا فایل‌های باز SQLite خراب نشوند.
            if [ "$NEED_MIGRATE" = "1" ]; then pm2 stop voice2text || true; fi
            [ -d data ] && [ ! -d bots/voice2text/data ] && mv data bots/voice2text/data || true
            [ -f .env ] && [ ! -f bots/voice2text/.env ] && mv .env bots/voice2text/.env || true
            if [ "$NEED_MIGRATE" = "1" ]; then pm2 delete voice2text || true; fi

            # ---------- ساخت .env هر ربات از روی GitHub Secrets ----------
            # قاعده: فقط وقتی توکنِ آن ربات ست شده باشد، .env نوشته/به‌روز می‌شود؛
            # در غیر این صورت .env موجود روی سرور دست‌نخورده می‌ماند (عدم‌شکستن رباتِ فعال).
            # اگر محتوای .env عوض شود، همان ربات برای ری‌لود علامت می‌خورد (ENV_CHANGED).
            ENV_CHANGED=""
            # ربات‌هایی که ADMIN_IDS می‌گیرند — **تک‌منبعِ حقیقت**. هم write_env و هم بلوکِ
            # upsertِ پایین از همین لیست می‌خوانند. اگر دو جا جدا نگه داشته شوند واگرا می‌شوند و
            # نتیجه‌اش پینگ‌پنگِ همیشگی است: write_env فایلِ بدونِ ADMIN_IDS می‌سازد → cmp فرق
            # می‌کند → ENV_CHANGED → upsert دوباره ADMIN_IDS را می‌گذارد → ENV_CHANGED. یعنی
            # **هر دیپلوی، حتی وقتی هیچ کدِ رباتی عوض نشده، ربات‌های زنده را ری‌استارت می‌کند**
            # (باگِ واقعی؛ در لاگ به‌شکلِ «دلیل: env» روی PRِ صرفاً مستنداتی دیده شد).
            ADMIN_BOTS=" voice2text tarot tarot-ru tarot-pt tarot-es daily-brief "
            # $1=نامِ اپِ pm2 ، $2=محتوای .env (بدونِ ADMIN_IDS) ، $3=مسیرِ فایل (اختیاری)
            # آرگومانِ سوم برای تاروتِ چندزبانه لازم شد: چند اپِ pm2 روی **یک** پوشه‌ی کد
            # می‌نشینند و هرکدام `.env.<locale>` خودش را دارد. بدونِ آن، هر زبان یک کپیِ
            # کامل از کدِ ربات می‌خواست، یعنی دقیقاً همان «N فورک» که بند ۲و ممنوع می‌کند.
            write_env() {
              envpath="${3:-bots/$1/.env}"
              mkdir -p "$(dirname "$envpath")"
              content="$2"
              case "$ADMIN_BOTS" in
                *" $1 "*)
                  if [ -n "$OWNER_TELEGRAM_ID" ]; then
                    content="$(printf '%s\nADMIN_IDS=%s' "$content" "$OWNER_TELEGRAM_ID")"
                  fi
                  ;;
              esac
              ( umask 077; printf '%s\n' "$content" > "$envpath.new" )
              if [ ! -f "$envpath" ] || ! cmp -s "$envpath.new" "$envpath"; then
                mv "$envpath.new" "$envpath"
                ENV_CHANGED="$ENV_CHANGED $1"
                echo "🔑 $envpath از روی secrets نوشته/به‌روز شد"
              else
                rm -f "$envpath.new"
              fi
            }
            if [ -n "$VOICE2TEXT_BOT_TOKEN" ] && [ -n "$VOICE2TEXT_OPENROUTER_KEY" ]; then
              # بکاپ یک‌باره از .env دستیِ سرور (شامل هر متغیر اضافه‌ای که ممکن است داشته باشد)
              [ -f bots/voice2text/.env ] && [ ! -f bots/voice2text/.env.bak ] && cp bots/voice2text/.env bots/voice2text/.env.bak || true
              V2T_ENV="$(printf 'BOT_TOKEN=%s\nOPENROUTER_API_KEY=%s' "$VOICE2TEXT_BOT_TOKEN" "$VOICE2TEXT_OPENROUTER_KEY")"
              [ -n "$VOICE2TEXT_NOTION_TOKEN" ] && V2T_ENV="$(printf '%s\nNOTION_TOKEN=%s' "$V2T_ENV" "$VOICE2TEXT_NOTION_TOKEN")"
              [ -n "$VOICE2TEXT_OPENROUTER_KEY_PERSONAL_USED" ] && V2T_ENV="$(printf '%s\nOPENROUTER_API_KEY_PERSONAL=%s' "$V2T_ENV" "$VOICE2TEXT_OPENROUTER_KEY_PERSONAL_USED")"
              write_env voice2text "$V2T_ENV"
            fi
            if [ -n "$RESUME_TAILOR_BOT_TOKEN" ] && [ -n "$RESUME_TAILOR_OPENROUTER_KEY" ]; then
              write_env resume-tailor "$(printf 'BOT_TOKEN=%s\nOPENROUTER_API_KEY=%s' "$RESUME_TAILOR_BOT_TOKEN" "$RESUME_TAILOR_OPENROUTER_KEY")"
            fi
            if [ -n "$TAROT_BOT_TOKEN" ] && [ -n "$TAROT_OPENROUTER_KEY" ]; then
              # کلیدِ اختیاری **داخلِ** همین بلوک append می‌شود، وگرنه cmp هر دیپلوی فرق می‌بیند
              # و رباتِ زنده بی‌دلیل ری‌استارت می‌شود (همان باگِ پینگ‌پنگِ ADMIN_IDS).
              TRT_ENV="$(printf 'BOT_TOKEN=%s\nOPENROUTER_API_KEY=%s\nLOCALE=fa' "$TAROT_BOT_TOKEN" "$TAROT_OPENROUTER_KEY")"
              [ -n "$TAROT_VIDEO_DISPATCH_TOKEN" ] && TRT_ENV="$(printf '%s\nVIDEO_DISPATCH_TOKEN=%s' "$TRT_ENV" "$TAROT_VIDEO_DISPATCH_TOKEN")"
              [ -n "$TAROT_USDT_TOMAN_RATE" ] && TRT_ENV="$(printf '%s\nUSDT_TOMAN_RATE=%s' "$TRT_ENV" "$TAROT_USDT_TOMAN_RATE")"
              write_env tarot "$TRT_ENV"
            fi
            # 🌍 یک بلوک per زبان. هرکدام کاملاً مستقل است: نبودِ سکرتِ یک زبان فقط
            # همان زبان را رد می‌کند و به فارسی و بقیه کاری ندارد.
            # ⚠️ `VIDEO_DISPATCH_TOKEN` عمداً **فقط** به فارسی داده می‌شود؛ دستورِ /reel
            # ابزارِ محتوای کانالِ فارسی است و هر کلیدِ اضافه در .env یعنی یک سطحِ حمله‌ی
            # بی‌دلیل روی سروری که ربات‌های زنده رویش‌اند (همان استدلالِ TAROT_NOTION_TOKEN).
            for lang in ru pt es; do
              upper="$(echo "$lang" | tr '[:lower:]' '[:upper:]')"
              eval "tok=\${TAROT_${upper}_BOT_TOKEN:-}"
              eval "key=\${TAROT_${upper}_OPENROUTER_KEY:-}"
              if [ -n "$tok" ] && [ -n "$key" ]; then
                write_env "tarot-$lang" \
                  "$(printf 'BOT_TOKEN=%s\nOPENROUTER_API_KEY=%s\nLOCALE=%s' "$tok" "$key" "$lang")" \
                  "bots/tarot/.env.$lang"
              else
                # ⚠️ نامِ سکرتِ خالی صریح چاپ می‌شود، وگرنه تنها نشانه یک «ℹ️ .env نبود»
                # است که هم برای «هنوز نساختیمش» و هم برای «ساختی ولی نامش فرق دارد»
                # یکسان به نظر می‌رسد. مقدار هرگز چاپ نمی‌شود، فقط نام.
                miss=""
                [ -z "$tok" ] && miss="TAROT_${upper}_BOT_TOKEN"
                [ -z "$key" ] && miss="$miss TAROT_${upper}_OPENROUTER_KEY"
                echo "⚠️ سکرتِ خالی روی رانر:$miss — تا ست نشدنش tarot-$lang بالا نمی‌آید"
              fi
            done
            if [ -n "$DAILY_BRIEF_BOT_TOKEN" ] && [ -n "$DAILY_BRIEF_OPENROUTER_KEY" ]; then
              # کلیدهای اختیاری داخلِ همین بلوک append می‌شوند، وگرنه cmp هر دیپلوی فرق می‌بیند
              # و ربات بی‌دلیل ری‌استارت می‌شود (همان باگِ پینگ‌پنگِ ADMIN_IDS — بالا).
              DLB_ENV="$(printf 'BOT_TOKEN=%s\nOPENROUTER_API_KEY=%s' "$DAILY_BRIEF_BOT_TOKEN" "$DAILY_BRIEF_OPENROUTER_KEY")"
              [ -n "$DAILY_BRIEF_NOTION_TOKEN" ] && DLB_ENV="$(printf '%s\nNOTION_TOKEN=%s' "$DLB_ENV" "$DAILY_BRIEF_NOTION_TOKEN")"
              write_env daily-brief "$DLB_ENV"
            fi
            if [ -n "$DASHBOARD_TOKEN" ]; then
              write_env dashboard "$(printf 'DASHBOARD_TOKEN=%s\nPORT=8787' "$DASHBOARD_TOKEN")"
            fi

            # ---------- ادمین یکپارچه‌ی همه‌ی ربات‌های Node: ADMIN_IDS = OWNER_TELEGRAM_ID ----------
            # مستقل از ست‌بودن توکنِ ربات در Secrets اجرا می‌شود؛ voice2text ممکن است .env دستیِ سرور
            # داشته باشد که write_env دست نمی‌زند. فقط خطِ ADMIN_IDS را upsert می‌کند (توکن/کلید/نوشن
            # دست نمی‌خورد → قانون «voice2text نشکند») و اگر عوض شد همان ربات را برای ری‌لود علامت می‌زند.
            # برای رباتی که write_env نوشته این حلقه no-op است (ADMIN_IDS از قبل درست است) — همان
            # چیزی که جلوی ری‌استارتِ بی‌دلیل در هر دیپلوی را می‌گیرد. لیست از $ADMIN_BOTS می‌آید.
            if [ -n "$OWNER_TELEGRAM_ID" ]; then
              for b in $ADMIN_BOTS; do
                envf="bots/$b/.env"
                [ -f "$envf" ] || continue
                cur=$(sed -n 's/^ADMIN_IDS=//p' "$envf" | head -1)
                [ "$cur" = "$OWNER_TELEGRAM_ID" ] && continue
                [ -f "bots/$b/.env.bak" ] || cp "$envf" "bots/$b/.env.bak"
                if grep -q '^ADMIN_IDS=' "$envf"; then
                  sed -i "s|^ADMIN_IDS=.*|ADMIN_IDS=${OWNER_TELEGRAM_ID}|" "$envf"
                else
                  printf 'ADMIN_IDS=%s\n' "$OWNER_TELEGRAM_ID" >> "$envf"
                fi
                ENV_CHANGED="$ENV_CHANGED $b"
                echo "🔑 $b/ADMIN_IDS به‌روز شد (ادمین‌های مشترک)"
              done
            fi

            # ---------- پاک‌سازی یک‌باره‌ی دیتای تستی tarot (لانچ ۱۴۰۵/۰۴/۲۰) — انجام شد، بلوک برداشته شد ----------
            # این پاک‌سازی یک‌بار در دیپلوی لانچ اجرا و marker `bots/tarot/data/.launch-wipe-done` ست شد.
            # بلوکِ خودکار عمداً حذف شد تا «حذفِ کاربران غیرادمین» یک footgunِ نهفته نماند (مثلاً بعد از
            # restore دیتابیس بدون marker روی رباتِ زنده). اسکریپت `tools/launch-wipe-tarot.mjs` برای
            # استفاده‌ی دستیِ آگاهانه می‌ماند (خودش قبل از حذف، بکاپ VACUUM INTO می‌گیرد و گاردِ حجم دارد).

            # ---------- دیپلوی انتخابی: فقط ربات‌هایی که واقعاً تغییر کرده‌اند ----------
            # خط قرمز: merge ای که به یک ربات ربطی ندارد نباید ربات‌های دیگر (خصوصاً voice2text) را ری‌استارت کند.
            # $1=نامِ اپِ pm2 ، $2=پوشه‌ی کد (پیش‌فرض bots/$1) ، $3=مسیرِ .env (پیش‌فرض bots/$1/.env)
            # دو آرگومانِ اختیاری برای تاروتِ چندزبانه‌اند: چند اپ روی یک پوشه‌ی کد.
            deploy_bot() {
              name="$1"
              srcdir="${2:-bots/$1}"
              envpath="${3:-bots/$1/.env}"
              if [ ! -f "$envpath" ]; then
                echo "ℹ️ $envpath نبود — $name رد شد (بدون اثر روی بقیه)"
                return
              fi
              reason=""
              [ "$FORCE_ALL" = "true" ] && reason="force"
              [ -z "$reason" ] && [ "$INFRA_CHANGED" = "1" ] && reason="infra"
              # تغییر کد خود ربات (تغییر مستندات .md و .env.example ری‌استارت لازم ندارد)
              if [ -z "$reason" ] && echo "$CHANGED_FILES" | grep -E "^$srcdir/" | grep -vE '\.(md|example)$' | grep -q .; then reason="code"; fi
              case " $ENV_CHANGED " in *" $name "*) [ -z "$reason" ] && reason="env";; esac
              # اگر ربات اصلاً در pm2 نیست (ربات تازه) → استارت
              if [ -z "$reason" ] && ! pm2 jlist | grep -q "\"name\":\"$name\""; then reason="new-app"; fi
              if [ -z "$reason" ]; then
                echo "⏭ $name بدون تغییر — دست نخورد (ری‌استارت نشد)"
                return
              fi
              # 📦 **نصب فقط یک بار per پوشه‌ی کد، نه یک بار per اپ.**
              #
              # 🐛 باگِ واقعیِ ۱۴۰۵/۰۶/۱۶ که رباتِ زنده را خواباند: چهار اپِ زبانیِ تاروت
              # `cwd` مشترکِ `bots/tarot` دارند و فقط `ENV_FILE`شان فرق می‌کند، پس این تابع
              # چهار بار برای همان پوشه صدا زده می‌شد. و `npm ci` طبقِ تعریفش **اول
              # `node_modules` را پاک می‌کند** و بعد از نو می‌سازد. یعنی سه اجرای آخر،
              # `node_modules` را از زیرِ پای پروسه‌هایی می‌کشیدند که چند ثانیه قبل reload
              # شده بودند: هر پروسه‌ای که در آن پنجره بوت می‌شد
              # `ERR_MODULE_NOT_FOUND: telegraf` می‌گرفت، pm2 دوباره بالا می‌آورد، دوباره
              # می‌مرد. نتیجه: کرش‌لوپ با ۱۷ ری‌استارت، در حالی که دیپلوی **سبز** تمام شد.
              #
              # سه اجرای آخر از اول هم بی‌فایده بودند: همان `package.json` و همان lockfile.
              # پس این فقط رفعِ باگ نیست، حذفِ کارِ تکراری هم هست (بند ۹/۰).
              case " $INSTALLED_DIRS " in
                *" $srcdir "*)
                  echo "↩︎ $srcdir از قبل در همین دیپلوی نصب شده — npm ci دوباره اجرا نمی‌شود" ;;
                *)
                  INSTALLED_DIRS="$INSTALLED_DIRS $srcdir"
                  npm ci --prefix "$srcdir" --omit=dev ;;
              esac
              pm2 startOrReload ecosystem.config.cjs --update-env --only "$name"
              echo "✅ $name دیپلوی شد (دلیل: $reason)"
            }
            # پوشه‌هایی که در همین اجرا `npm ci` خورده‌اند (بالا توضیح داده شده).
            INSTALLED_DIRS=""
            # بلوکِ یک‌باره‌ی «مهاجرتِ الماسِ بومی» این‌جا بود و **حذف شد**: مهاجرت روی
            # سرور اجرا و مهر خورد (ردیفِ `coins_native` در جدولِ `migrations`)، پس طبق
            # قاعده‌ی ثابتِ ریپو بلوکِ یک‌باره بعد از تأییدِ اجرا برداشته می‌شود.
            # چرا فقط «تمیزکاری» نبود: آن بلوک **بی‌قید و شرط** `pm2 stop tarot` می‌زد و
            # فقط `deploy_bot` (که تنها با تغییرِ کدِ همان ربات کار می‌کند) برش می‌گرداند.
            # یعنی هر مرجی که tarot را لمس نکرده بود — حتی یک مرجِ صرفاً مستنداتی —
            # رباتِ زنده‌ی درآمدزا را متوقف می‌کرد و گاردِ پایین چند ثانیه بعد نجاتش می‌داد.
            # ۴ شهریور ۱۴۰۵ در لاگِ دیپلویِ یک PRِ فقط-analytics دیده شد.

            # 🧟 پاک‌سازیِ یک‌باره‌ی اپِ روحِ `voice2text-ops` (۱۴۰۵/۰۶/۱۲)
            #
            # چه بود: یک اپِ pm2 که به `~/voice2text/ops-server.js` اشاره می‌کرد. آن فایل
            # **هرگز در ریپو نبوده** (نه در درخت، نه در تاریخچه، نه هیچ ارجاعی)، یعنی دستی
            # روی سرور ساخته شده بود. وقتی از بین رفت، pm2 شروع کرد ثانیه‌ای چند بار
            # ری‌استارتش کند: ۹۹۱+ ری‌استارت، uptime همیشه صفر، و ۳۳٪ CPU روی همان سروری
            # که ربات‌های زنده رویش‌اند.
            #
            # چرا هیچ‌کس خبردار نشد: این اپ در `ecosystem.config.cjs` نیست و
            # `health-watch.mjs` فقط روی `eco.apps` حلقه می‌زند. یعنی یک پروسه‌ی کاملاً
            # نامرئی برای پایش. مالک فقط از روی جدولِ pm2 در لاگِ دیپلوی دیدش.
            #
            # شرط عمداً **دو تکه** است و بعد از انجامِ کار false می‌شود: هم اپ باید در pm2
            # باشد و هم فایلش نباشد. اگر روزی `ops-server.js` واقعاً ساخته شود، این بلوک
            # خودبه‌خود بی‌اثر می‌ماند و چیزی را حذف نمی‌کند.
            # 🗑 بعد از تأییدِ اجرا، این بلوک از deploy.yml برداشته شود (بند ۳ ریشه).
            GHOST_OPS=$(pm2 describe voice2text-ops >/dev/null 2>&1 && [ ! -f ~/voice2text/ops-server.js ] && echo 1 || true)
            if [ -n "$GHOST_OPS" ]; then
              echo "🧟 اپِ روحِ voice2text-ops پیدا شد (فایلِ ops-server.js وجود ندارد) — حذف می‌شود"
              pm2 delete voice2text-ops || true
              pm2 save || true
            fi

            deploy_bot voice2text
            deploy_bot tarot
            # 🌍 هر زبان جدا؛ همان پوشه‌ی کد، `.env` خودش. زبانی که سکرت ندارد بی‌صدا رد
            # می‌شود، پس این حلقه تا قبل از ساختِ سکرت‌ها کاملاً بی‌اثر است.
            for lang in ru pt es; do
              deploy_bot "tarot-$lang" bots/tarot "bots/tarot/.env.$lang"
            done

            # ---------- گاردِ «تاروت حتماً بالا باشد» ----------
            # ⚠️ این گارد **عمداً ماند** با اینکه علتِ تاریخی‌اش (بلوکِ یک‌باره‌ی بالا) رفته:
            # یک ادعای مستقل است، نه وصله‌ی آن بلوک. tarot 🟢 زنده و درآمدزاست و اگر به هر
            # دلیلی (کرشِ پی‌درپی که pm2 از آن دست کشیده، توقفِ دستی، بلوکِ یک‌باره‌ی آینده)
            # لحظه‌ی دیپلوی خاموش باشد، `pm2 save` همان وضعیتِ stopped را **ماندگار** می‌کند
            # و ری‌بوت هم نجاتش نمی‌دهد. این دقیقاً ۴ شهریور ۱۴۰۵ اتفاق افتاد.
            # 🛑 معاوضه‌ی آگاهانه: توقفِ عمدیِ ربات (توقفِ اضطراری، بند ۱۱ ریشه) با اولین
            # دیپلوی باطل می‌شود. برای تعمیراتِ واقعی از `Ops restart` استفاده کن، نه
            # `pm2 stop`ِ بلندمدت.
            TRT_STATUS=$(pm2 jlist | node -e "
              const a = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const p = a.find(x => x.name === 'tarot');
              console.log(p ? p.pm2_env.status : 'missing');" 2>/dev/null || echo unknown)
            if [ "$TRT_STATUS" != "online" ]; then
              echo "⚠️ tarot لحظه‌ی دیپلوی online نبود (status=$TRT_STATUS) — بالا آورده می‌شود"
              pm2 start ecosystem.config.cjs --only tarot 2>/dev/null || pm2 restart tarot || true
              sleep 3
              pm2 jlist | node -e "
                const a = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                const p = a.find(x => x.name === 'tarot');
                const s = p ? p.pm2_env.status : 'missing';
                console.log(s === 'online' ? '✅ tarot بالا آمد' : '❌ tarot هنوز بالا نیست: ' + s);
                if (s !== 'online') process.exit(1);"
            fi

            # ---------- گاردِ کرش‌لوپ: «online» کافی نیست ----------
            # 🐛 درسِ ۱۴۰۵/۰۶/۱۶: گاردِ بالا فقط `status` را می‌بیند، و اپی که هر چند ثانیه
            # می‌میرد و pm2 دوباره بالایش می‌آورد **بینِ دو کرش `online` گزارش می‌شود**. آن
            # روز دیپلوی با همین سبزِ دروغین تمام شد در حالی که هر چهار رباتِ تاروت
            # کرش‌لوپ بودند، و مالک خودش فهمید نه ما. یعنی خرابی نه از پایش رد شد، از
            # **تعریفِ سلامت** رد شد.
            # تشخیص: شمارنده‌ی ری‌استارتِ pm2 را دو بار با فاصله می‌خوانیم. اپِ سالم بینِ دو
            # نمونه ری‌استارت نمی‌شود؛ اپِ کرش‌لوپ حتماً می‌شود. جابِ قرمز = هشدارِ تلگرام.
            echo "---- گاردِ کرش‌لوپ (نمونه‌ی اول) ----"
            RESTARTS_BEFORE=$(pm2 jlist | node -e "
              const a = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              console.log(a.filter(x => /^tarot|^voice2text|^dashboard/.test(x.name))
                           .map(x => x.name + '=' + x.pm2_env.restart_time).join(' '));" 2>/dev/null || echo "")
            sleep 12
            RESTARTS_AFTER=$(pm2 jlist | node -e "
              const a = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              console.log(a.filter(x => /^tarot|^voice2text|^dashboard/.test(x.name))
                           .map(x => x.name + '=' + x.pm2_env.restart_time).join(' '));" 2>/dev/null || echo "")
            echo "قبل : $RESTARTS_BEFORE"
            echo "بعد : $RESTARTS_AFTER"
            if [ -n "$RESTARTS_BEFORE" ] && [ "$RESTARTS_BEFORE" != "$RESTARTS_AFTER" ]; then
              echo "❌ کرش‌لوپ: شمارنده‌ی ری‌استارت در ۱۲ ثانیه بالا رفت. اپ‌ها بوت نمی‌شوند."
              echo "--- خطای تاروت ---"
              tail -n 30 ~/.pm2/logs/tarot-error.log 2>/dev/null || true
              exit 1
            fi
            echo "✅ هیچ اپی در پنجره‌ی ۱۲ ثانیه‌ای ری‌استارت نشد"

            # ---------- گاردِ ضربان: «ری‌استارت نشد» هم کافی نیست ----------
            # گاردِ بالا نبودِ کرش‌لوپ را ثابت می‌کند، ولی پروسه‌ای که اصلاً بوت نشده و
            # pm2 عقب‌نشینیِ نمایی کرده هم در یک پنجره‌ی ۱۲ثانیه‌ای ری‌استارت نمی‌شود، و
            # پروسه‌ای که زنده و بی‌فایده است هم همین‌طور. تنها چیزی که «کار می‌کند» را
            # ثابت می‌کند سیگنالی است که **خودِ حلقه‌ی رویدادِ ربات** تولید کند.
            #
            # هر اپِ تاروت هر ۲۰ ثانیه `data/heartbeat-<locale>.txt` را می‌نویسد. اگر بعد
            # از reload ضربانی تازه‌تر از لحظه‌ی شروعِ دیپلوی نیامد، آن اپ بالا نیامده —
            # فرقی نمی‌کند pm2 چه می‌گوید. جابِ قرمز = هشدارِ تلگرام به مالک.
            echo "---- گاردِ ضربان ----"
            HB_DEADLINE=$(( $(date +%s) + 90 ))
            HB_BAD=""
            for loc in fa ru pt es; do
              envf=".env"; [ "$loc" = "fa" ] || envf=".env.$loc"
              # اپی که سکرتش ست نشده عمداً دیپلوی نمی‌شود، پس ضربان هم ندارد و
              # نبودنش خرابی نیست (درسِ ۱۱ شهریور: نامِ فایلِ env، نه `.env` ثابت).
              [ -f "bots/tarot/$envf" ] || { echo "⏭ tarot-$loc سکرت ندارد — از گارد معاف"; continue; }
              hb="bots/tarot/data/heartbeat-$loc.txt"
              while :; do
                beat=$(cat "$hb" 2>/dev/null || echo 0)
                if [ "$beat" -ge "$DEPLOY_STARTED_AT" ] 2>/dev/null; then
                  echo "✅ tarot-$loc ضربان دارد (سنِ $(( $(date +%s) - beat ))s)"; break
                fi
                if [ "$(date +%s)" -ge "$HB_DEADLINE" ]; then
                  echo "❌ tarot-$loc بعد از دیپلوی هیچ ضربانی نزد"; HB_BAD="$HB_BAD tarot-$loc"; break
                fi
                sleep 5
              done
            done
            if [ -n "$HB_BAD" ]; then
              echo "❌ این اپ‌ها بوت نشدند:$HB_BAD"
              echo "--- خطای تاروت ---"
              tail -n 30 ~/.pm2/logs/tarot-error.log 2>/dev/null || true
              exit 1
            fi

            deploy_bot daily-brief
            deploy_bot dashboard

            # ---------- ناظرِ سلامت ----------
            # اپِ pm2ای که جای پایشِ هر ۳۰ دقیقه‌ایِ GitHub Actions را گرفت (که ۷۲٪ سهمیه‌ی
            # حساب را می‌خورد). عمداً از deploy_bot رد نمی‌شود: نه `bots/<name>/.env` دارد و
            # نه وابستگیِ npm، پس هر دو شرطِ آن تابع اینجا بی‌معنی است.
            HW_REASON=""
            [ "$FORCE_ALL" = "true" ] && HW_REASON="force"
            [ -z "$HW_REASON" ] && [ "$INFRA_CHANGED" = "1" ] && HW_REASON="infra"
            # ⚠️ ماژول‌هایی که health-watch import می‌کند هم «کدِ» او حساب می‌شوند.
            # وگرنه یک PR که فقط `tools/stuck-detect.mjs` را تنظیم کند بی‌صدا به سرور
            # نمی‌رسد: دیپلوی سبز، هیچ خطایی، و ناظر ماه‌ها نسخه‌ی قدیمی را اجرا می‌کند.
            # هر importِ محلیِ تازه باید این‌جا هم اضافه شود؛ گاردِ دوطرفه‌اش در
            # tools/check-health-watch.mjs است (هم جاافتادن، هم ردیفِ بی‌مصرف).
            if [ -z "$HW_REASON" ] && echo "$CHANGED_FILES" | grep -qE '^tools/(health-watch|stuck-detect)\.mjs$'; then HW_REASON="code"; fi
            if [ -z "$HW_REASON" ] && ! pm2 jlist | grep -q '"name":"health-watch"'; then HW_REASON="new-app"; fi
            if [ -n "$HW_REASON" ]; then
              pm2 startOrReload ecosystem.config.cjs --update-env --only health-watch
              pm2 save || true
              echo "✅ health-watch دیپلوی شد (دلیل: $HW_REASON)"
            else
              echo "⏭ health-watch بدون تغییر"
            fi

            # resume-tailor بازنشسته شد (منسوخ + مصرف LLM بی‌سقف/SSRF) — یک‌باره از pm2 حذف می‌شود
            pm2 delete resume-tailor 2>/dev/null && pm2 save || true

            # ---------- اسکریپت‌های یک‌باره: انجام‌شده و عمداً برداشته‌شده ----------
            # قاعده‌ی ثابت: هر بلوکِ یک‌باره بعد از تأییدِ اجرا از این‌جا حذف می‌شود، چون
            # فایلِ marker روی سرور زندگی می‌کند و بعد از هر restore از بکاپ از بین می‌رود —
            # یعنی بلوکِ باقی‌مانده یک تله‌ی خفته است که روزی دوباره به همه پول می‌دهد.
            # انجام‌شده‌ها (اسکریپتشان در tools/ برای آرشیو مانده):
            #   • launch-wipe-tarot.mjs            — پاک‌سازیِ دیتای تست، لانچ ۱۴۰۵/۰۴/۲۰
            #   • goodwill-credit-tarot.mjs        — جبرانِ کاربرِ باگِ تخفیف، ۱۴۰۵/۰۵/۰۹
            #   • welcome-bonus-backfill-tarot.mjs — هدیه‌ی خوش‌آمدِ کاربرانِ فعلی، ۱۴۰۵/۰۵/۰۹
            #     (۳۷ کاربر اعتبار گرفتند، ۲۵ پیام رسید، ۱۲ نفر ربات را بلاک کرده بودند)

            # ---------- Cloudflare Tunnel داشبورد (هیچ پورت inbound باز نمی‌شود) ----------
            # named tunnel اگر CLOUDFLARE_TUNNEL_TOKEN ست باشد (آدرس ثابت با دامنه)،
            # وگرنه quick tunnel رایگان trycloudflare (آدرس بعد از هر ری‌استارت عوض می‌شود؛
            # آدرس فعلی به تلگرام مالک پیام می‌شود و با Ops → tunnel-url هم قابل خواندن است).
            if [ -f bots/dashboard/.env ]; then
              if ! command -v cloudflared >/dev/null 2>&1; then
                echo "⬇️ نصب cloudflared..."
                curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                sudo dpkg -i /tmp/cloudflared.deb >/dev/null 2>&1 || sudo apt-get -f install -y -q
                rm -f /tmp/cloudflared.deb
              fi
              CF_BIN=$(command -v cloudflared)
              if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
                TUNNEL_EXEC="$CF_BIN tunnel --no-autoupdate run --token $CLOUDFLARE_TUNNEL_TOKEN"
              else
                TUNNEL_EXEC="$CF_BIN tunnel --no-autoupdate --url http://127.0.0.1:8787"
              fi
              printf '[Unit]\nDescription=Cloudflare tunnel for bots dashboard\nAfter=network-online.target\n\n[Service]\nExecStart=%s\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' "$TUNNEL_EXEC" > /tmp/dash-tunnel.service
              if ! sudo cmp -s /tmp/dash-tunnel.service /etc/systemd/system/dash-tunnel.service 2>/dev/null; then
                sudo cp /tmp/dash-tunnel.service /etc/systemd/system/dash-tunnel.service
                sudo chmod 600 /etc/systemd/system/dash-tunnel.service
                sudo systemctl daemon-reload
                sudo systemctl enable dash-tunnel >/dev/null 2>&1 || true
                sudo systemctl restart dash-tunnel
                echo "🌀 dash-tunnel راه‌اندازی/به‌روز شد"
                sleep 5
              fi
              rm -f /tmp/dash-tunnel.service
              # چک دسترسی لوکال داشبورد + استخراج آدرس تونل و ارسال به تلگرام مالک
              DASH_HTTP=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/login || echo 000)
              echo "داشبورد لوکال: HTTP $DASH_HTTP (انتظار: 200)"
              TUNNEL_URL=$(sudo journalctl -u dash-tunnel -n 1000 -o cat 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1 || true)
              [ -z "$TUNNEL_URL" ] && [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ] && TUNNEL_URL="(named tunnel — آدرس دامنه‌ی خودت)"
              echo "🌐 آدرس داشبورد: ${TUNNEL_URL:-هنوز آماده نیست — Ops → tunnel-url}"
              # فقط وقتی آدرسِ quick tunnel *واقعاً عوض شده* به مالک خبر بده (وگرنه هر دیپلوی = اسپم).
              # آدرسِ آخرین‌بارِ اطلاع‌داده‌شده در ~/.dash-tunnel-last-url نگه داشته می‌شود.
              # named tunnel آدرس ثابت دارد → هرگز پیام نمی‌دهیم (URL با trycloudflare شروع نمی‌شود).
              case "$TUNNEL_URL" in
                https://*.trycloudflare.com)
                  LAST_URL_FILE="$HOME/.dash-tunnel-last-url"
                  PREV_URL=$(cat "$LAST_URL_FILE" 2>/dev/null || true)
                  if [ "$TUNNEL_URL" != "$PREV_URL" ] && [ -n "$OWNER_TELEGRAM_ID" ]; then
                    MSG_TOKEN="${TAROT_BOT_TOKEN:-${VOICE2TEXT_BOT_TOKEN:-$RESUME_TAILOR_BOT_TOKEN}}"
                    if [ -n "$MSG_TOKEN" ]; then
                      # OWNER_TELEGRAM_ID می‌تواند لیستِ چند آیدیِ عددی با کاما باشد
                      IFS=',' read -ra OWNERS <<< "$OWNER_TELEGRAM_ID"
                      for id in "${OWNERS[@]}"; do
                        id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
                        curl -fsS -X POST "https://api.telegram.org/bot${MSG_TOKEN}/sendMessage" \
                          -d chat_id="$id" \
                          --data-urlencode text="🌐 آدرس جدید داشبورد (عوض شد): $TUNNEL_URL" >/dev/null || true
                      done
                    fi
                  fi
                  printf '%s' "$TUNNEL_URL" > "$LAST_URL_FILE" 2>/dev/null || true
                  ;;
              esac
            fi

            # ---------- کرونِ انتشارِ روزانه‌ی کانال روی خودِ سرور (idempotent) ----------
            # چرا روی سرور و نه GitHub Actions: سقفِ دقیقه‌ی Actions ریپوی خصوصی تمام‌شدنی
            # است و وقتی تمام شد هیچ workflow ای اجرا نمی‌شود؛ ۲۲ تا ۲۶ مرداد ۱۴۰۵ دقیقاً
            # این‌طور از دست رفت. سرور نه سقفِ دقیقه دارد نه به بیلینگِ گیت‌هاب وصل است.
            chmod +x tools/marketing/vps-daily-post.sh 2>/dev/null || true
            NODE_BIN="$(command -v node || echo /usr/bin/node)"
            CRON_LINE="30 * * * * PATH=$(dirname "$NODE_BIN"):/usr/local/bin:/usr/bin:/bin REPO_DIR=$HOME/voice2text $HOME/voice2text/tools/marketing/vps-daily-post.sh >> $HOME/taroot-daypost.log 2>&1"
            # خطِ قبلی را (هر شکلی که داشته) بردار و خطِ تازه را بگذار؛ اجرای دوباره no-op است.
            #
            # ⚠️ `|| true` روی grep حیاتی است و نبودنش یک بار کرون را بی‌صدا خراب کرد:
            # وقتی crontab خالی است، grep ورودی‌ای نمی‌گیرد و با کدِ ۱ برمی‌گردد؛ زیرِ
            # `set -e` ساب‌شل همان‌جا می‌مرد، `echo` هرگز اجرا نمی‌شد و `crontab -`
            # ورودیِ **خالی** می‌گرفت. یعنی کرون نصب نمی‌شد ولی چون خودِ `crontab -`
            # موفق بود، پیامِ «نصب شد» چاپ می‌شد. خرابیِ بی‌صدا با گزارشِ موفقیت.
            EXISTING="$(crontab -l 2>/dev/null | grep -v 'vps-daily-post.sh' || true)"
            printf '%s\n%s\n' "$EXISTING" "$CRON_LINE" | sed '/^$/d' | crontab -
            # هرگز موفقیت را فرض نکن؛ از خودِ crontab بپرس
            if crontab -l 2>/dev/null | grep -q 'vps-daily-post.sh'; then
              echo "🗓 کرونِ انتشارِ روزانه نصب/به‌روز شد (هر ساعت چک می‌کند، ۱۰ صبح تهران منتشر می‌کند)"
            else
              echo "❌ نصبِ کرونِ انتشارِ روزانه شکست خورد"; exit 1
            fi

            pm2 save
            echo "---- وضعیت نهایی ----"
            pm2 ls

      # استثنا باید دیده شود، وگرنه قاعده می‌شود. هر بار که ساعتِ امن دور زده شد،
      # مالک همان لحظه می‌داند — چه خودش زده باشد چه یک سشن.
      - name: Telegram notice on urgent bypass
        if: steps.gate.outputs.bypass != '' && steps.gate.outputs.go == 'true'
        env:
          T_V2T:   ${{ secrets.VOICE2TEXT_BOT_TOKEN }}
          T_TAROT: ${{ secrets.TAROT_BOT_TOKEN }}
          T_RT:    ${{ secrets.RESUME_TAILOR_BOT_TOKEN }}
          OWNER:   ${{ secrets.OWNER_TELEGRAM_ID }}
          WHY:     ${{ steps.gate.outputs.why }}
        run: |
          TOKEN="${T_V2T:-${T_TAROT:-$T_RT}}"
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then exit 0; fi
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$id" \
              --data-urlencode text="🚨 دیپلوی خارج از ساعتِ امن اجرا شد — $WHY" || true
          done

      # اگر دیپلوی شکست بخورد، به تلگرام مالک پیام می‌رود (نیازمند secret اختیاری OWNER_TELEGRAM_ID)
      - name: Telegram alert on failure
        if: failure()
        env:
          T_V2T:   ${{ secrets.VOICE2TEXT_BOT_TOKEN }}
          T_TAROT: ${{ secrets.TAROT_BOT_TOKEN }}
          T_RT:    ${{ secrets.RESUME_TAILOR_BOT_TOKEN }}
          OWNER:   ${{ secrets.OWNER_TELEGRAM_ID }}
        run: |
          TOKEN="${T_V2T:-${T_TAROT:-$T_RT}}"
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then echo "ℹ️ OWNER_TELEGRAM_ID یا توکن ربات ست نشده — هشدار تلگرام رد شد"; exit 0; fi
          # OWNER_TELEGRAM_ID می‌تواند لیستِ چند آیدیِ عددی با کاما باشد (بدون نیاز به کد جدید)
          IFS=',' read -ra OWNERS <<< "$OWNER"
          for id in "${OWNERS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"; [ -n "$id" ] || continue
            curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$id" \
              --data-urlencode text="🚨 Deploy شکست خورد — لاگ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          done

  # ---------- tabir-khab (استثنای مونوریپو: پایتون + systemd، نه pm2) ----------
  # سرویس روی سرور همان‌جاست که همیشه بود: /home/ubuntu/tabir_khab با سرویسِ
  # systemd به نام tabir-khab. این جاب فقط «محتوای» bots/tabir-khab را با
  # git archive روی همان مسیر overlay می‌کند — .env و دیتابیس‌های SQLite و
  # logs/ و .venv/ روی سرور دست‌نخورده می‌مانند — و بعد همان ری‌استارتِ
  # همیشگی را می‌زند. جدا از جاب pm2 است تا خطای هرکدام به دیگری سرایت نکند.
  # دیپلوی انتخابی: فقط وقتی bots/tabir-khab تغییر کرده باشد (یا force_all) ری‌استارت می‌شود.
  deploy-tabir-khab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # همان گیتِ پنجره‌ی امن، از همان تک‌منبع. دو کپیِ bash دیر یا زود واگرا می‌شوند
      # و آن‌وقت نیمی از دیپلوی در ساعتِ امن می‌رود و نیمی نه — بی‌صدا.
      - name: پنجره‌ی امنِ دیپلوی
        id: gate
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          URGENT:     ${{ inputs.urgent }}
          REASON:     ${{ inputs.reason }}
        run: node tools/deploy-window.mjs

      - name: Check if tabir-khab changed
        id: changed
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          BEFORE:    ${{ github.event.before }}
        run: |
          DEPLOY=1
          if [ "${{ github.event_name }}" = "push" ] && [ "$FORCE_ALL" != "true" ] \
             && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -E '^bots/tabir-khab/' | grep -vE '\.md$' | grep -q .; then
              DEPLOY=1
            else
              DEPLOY=0
            fi
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          [ "$DEPLOY" = "1" ] && echo "🚀 tabir-khab دیپلوی می‌شود" || echo "⏭ tabir-khab بدون تغییر — ری‌استارت نشد"

      - name: Deploy tabir-khab (overlay + restart)
        # گیتِ پنجره در کنارِ شرطِ «تغییر کرده؟» — هر دو باید سبز باشند.
        if: steps.changed.outputs.deploy == '1' && steps.gate.outputs.go == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # توکن‌های تلگرامِ per-language — هر کدام ست باشد در .env سرور upsert می‌شود؛
          # خالی = دست‌نخورده. (فارسی از قبل با نامِ قدیمی TELEGRAM_BOT_TOKEN روی سرور است؛
          # TABIR_TELEGRAM_BOT_TOKEN_FA فقط برای تعویضِ احتمالیِ آن است.)
          T_FA: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_FA }}
          T_EN: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_EN }}
          T_AR: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_AR }}
          T_RU: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_RU }}
          T_ES: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_ES }}
          T_PT: ${{ secrets.TABIR_TELEGRAM_BOT_TOKEN_PT }}
          T_BALE: ${{ secrets.TABIR_BALE_BOT_TOKEN }}
          ADMIN_IDS_VAL: ${{ secrets.OWNER_TELEGRAM_ID }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 185.204.171.170 >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key ubuntu@185.204.171.170"

          # ۱) کد جدید را روی مسیر فعلی سرور overlay کن (فایل‌های untracked مثل .env/db دست نمی‌خورند)
          git archive HEAD:bots/tabir-khab | $SSH 'mkdir -p /home/ubuntu/tabir_khab && tar -x -C /home/ubuntu/tabir_khab'

          # ۲) upsertِ توکن‌ها در .env سرور — فقط کلیدهایی که در Secrets ست شده‌اند؛
          #    بقیه‌ی .env (OPENROUTER_API_KEY, GAPGPT_API_KEY, پرداخت و...) دست نمی‌خورد.
          #    مقادیر هرگز در لاگ چاپ نمی‌شوند (فقط نام کلید).
          {
            echo "TELEGRAM_BOT_TOKEN_FA=$T_FA"
            echo "TELEGRAM_BOT_TOKEN_EN=$T_EN"
            echo "TELEGRAM_BOT_TOKEN_AR=$T_AR"
            echo "TELEGRAM_BOT_TOKEN_RU=$T_RU"
            echo "TELEGRAM_BOT_TOKEN_ES=$T_ES"
            echo "TELEGRAM_BOT_TOKEN_PT=$T_PT"
            echo "BALE_BOT_TOKEN=$T_BALE"
            echo "ADMIN_IDS=$ADMIN_IDS_VAL"
          } | $SSH 'umask 077
            cd /home/ubuntu/tabir_khab
            touch .env
            [ -f .env.bak ] || cp .env .env.bak
            while IFS= read -r line; do
              key=${line%%=*}; val=${line#*=}
              [ -n "$val" ] || continue
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                printf "%s\n" "${key}=${val}" >> .env
              fi
              echo "🔑 ${key} از Secrets در .env ست شد"
            done'

          # ۳) وابستگی‌ها + ری‌استارت + چک سلامت (همان دستورهای دیپلوی قبلیِ این ربات)
          $SSH 'set -e
            cd /home/ubuntu/tabir_khab
            which ffmpeg >/dev/null || sudo apt-get install -y -q ffmpeg < /dev/null
            .venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart tabir-khab
            sleep 2
            sudo systemctl is-active tabir-khab
            echo "✅ tabir-khab دیپلوی شد"'
