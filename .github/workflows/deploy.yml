name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/voice2text
            git pull --ff-only

            # --- مهاجرت یک‌باره به ساختار مونوریپو (در دیپلوی‌های بعدی no-op می‌شود) ---
            # تشخیص نیاز به مهاجرت: پروسه‌ی قدیمی هنوز به index.js ریشه اشاره می‌کند؟
            NEED_MIGRATE=0
            if pm2 jlist | grep -q '/home/ubuntu/voice2text/index.js'; then NEED_MIGRATE=1; fi
            # مهم: قبل از جابجایی پوشه‌ی data، پروسه باید متوقف شود تا فایل‌های باز SQLite
            # (.db / .db-wal / .db-shm) حین نوشتن جابجا نشوند و دیتابیس خراب نشود.
            if [ "$NEED_MIGRATE" = "1" ]; then pm2 stop voice2text || true; fi
            # انتقال دیتابیس و env قدیمی از ریشه به پوشه‌ی ربات (وقتی پروسه متوقف است)
            [ -d data ] && [ ! -d bots/voice2text/data ] && mv data bots/voice2text/data || true
            [ -f .env ] && [ ! -f bots/voice2text/.env ] && mv .env bots/voice2text/.env || true
            # حذف پروسه‌ی قدیمی تا با مسیر/‌cwd جدید از ecosystem استارت شود
            if [ "$NEED_MIGRATE" = "1" ]; then pm2 delete voice2text || true; fi

            # --- نصب وابستگی‌ها به‌صورت per-bot ---
            npm ci --prefix bots/voice2text --omit=dev

            # --- استارت/ریلود voice2text از ecosystem (داون‌تایم حداقلی) ---
            pm2 startOrReload ecosystem.config.cjs --update-env --only voice2text

            # --- resume-tailor فقط در صورت وجود .env روی سرور دیپلوی شود (وگرنه skip امن) ---
            if [ -f bots/resume-tailor/.env ]; then
              npm ci --prefix bots/resume-tailor --omit=dev
              pm2 startOrReload ecosystem.config.cjs --update-env --only resume-tailor
            else
              echo "ℹ️ bots/resume-tailor/.env یافت نشد — این ربات skip شد (voice2text دست‌نخورده)."
            fi

            pm2 save
