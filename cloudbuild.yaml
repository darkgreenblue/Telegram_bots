steps:
  # ... (مراحل قبلی بیلد و دیپلوی) ...
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tg-voice2text', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tg-voice2text']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tg-voice2text'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tg-voice2text'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/tg-voice2text'

options:
  logging: CLOUD_LOGGING_ONLY